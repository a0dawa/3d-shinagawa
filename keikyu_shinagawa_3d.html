function stepRide(dt){
  atcRaw=atcLimit(rideS);                       // 瞬時の許容速度(null=制限なし)
  const rv=(atcRaw===null)?Infinity:atcRaw, ev=(atcLim===null)?Infinity:atcLim;
  if(rv<ev-1e-9){ atcLim=atcRaw; atcUpT=0; }    // 現示ダウンは即時
  else if(rv>ev+1e-9){                          // 現示アップは10秒待つ
    atcUpT+=dt;
    if(atcUpT>=ATC_UP_LAG){ atcLim=atcRaw; atcUpT=0; }
  }else atcUpT=0;
  atcOn=(atcLim!==null&&rideV>atcLim);
  // 扉扱い:停止位置に着いたら25秒開ける。離れたら次の停車で再び開く
  if(doorOpenT>0){
    doorOpenT=Math.max(0,doorOpenT-dt);
    if(doorOpenT===0){doorSt=null;doorPSD=null;}
  }else{
    // 点灯条件:停止位置の前後1m以内、かつ速度が完全に0km/hであること
    const st=rideStopAt(rideS);
    if(st&&rideV===0&&doorArmed!==st&&rideStops(st)){                 // 特急は通過駅では開けない(利用者指示)
      doorSt=st;doorPSD=ridePSDFor(st);doorOpenT=DOOR_OPEN_SEC;doorArmed=st;
    }
    if(doorArmed&&Math.abs(stopPosOf(doorArmed,1)-rideS)>DOOR_REARM) doorArmed=null;
  }
  // 加減速の応答は一次遅れ(時定数 NOTCH_LAG 秒)。さらに速度による特性を加味する:
  //   力行 : 60km/h までは設定どおり、以降は鈍化し 120km/h で半分
  //   制動 : 120km/h では75%、速度が落ちるほど強まり 60km/h 以下で設定どおり
  // 扉が開いている間(=戸閉灯が消えている間)は力行できない
  const nUse=atcOn?NIDX_B7:(doorOpenT>0?Math.min(notch,NIDX_N):notch);
  const aSet=NOTCHES[nUse].a;
  // 保安装置の制動は指令どおりの減速度で効く(速度による鈍化を受けない)。
  // 鈍化を受けると高速域でパターンに追従できず、頭打ちのまま接近してしまう。
  const aCmd=atcOn?aSet:aSet*accCurve(rideV,aSet);
  accEff += (aCmd-accEff)*Math.min(1, dt/NOTCH_LAG);
  rideV=clamp(rideV+accEff*dt,0,VMAX);
  rideS+=(rideV/3.6)*dt; if(rideS>DOM.x1+30){rideS=DOM.x0+20;}   // 線路の端(泉岳寺方のトンネル)の先で新馬場方へ戻る
}
// マスコン操作の遊び(反応遅れ1.0秒):cmdNotch=操作値 / notch=実際に効いている段
let cmdNotch=NIDX_N, accEff=0; const NOTCH_LAG=1.0;   // accEff=実際に効いている加速度[km/h/s]
let chaseOn=false,chaseIdx=0;const chaseEye=new THREE.Vector3();
const CH={th:Math.PI/2-.35,ph:.92,r:150};   // 追尾カメラの球面パラメータ(操作可能)
function applyCam(){
  const x=cam.tx+cam.r*Math.sin(cam.ph)*Math.cos(cam.th), z=cam.tz+cam.r*Math.sin(cam.ph)*Math.sin(cam.th);
  camera.position.set(x, Math.max(cam.ty+cam.r*Math.cos(cam.ph), terH(x,z)+3), z);   // 丘(地形)の中へは入らない
  camera.lookAt(cam.tx,cam.ty,cam.tz);
}
function flyTo(to,dur){fly={a:Object.assign({},cam),b:Object.assign(Object.assign({},cam),to),t0:performance.now(),dur:dur||1400};}
function stepFly(now){
  if(!fly)return;
  let t=(now-fly.t0)/fly.dur;if(t>=1){Object.assign(cam,fly.b);fly=null;return;}
  t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  for(const k of['tx','ty','tz','r','th','ph'])cam[k]=fly.a[k]+(fly.b[k]-fly.a[k])*t;
}
const pts=new Map();let pinchD=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinchD=0;if(!rideOn)fly=null;});
canvas.addEventListener('pointerup',e=>{pts.delete(e.pointerId);pinchD=0;});
canvas.addEventListener('dblclick',()=>{if(rideOn){rideYaw=0;ridePitch=0;}});   // 正面へ戻す
canvas.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinchD=0;});
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(rideOn){   // 運転モード:ドラッグで首振り(左右±120°/上下±45°)。2本指は無視
    if(pts.size>=2)return;
    rideYaw   = clamp(rideYaw   - dx*.004, -2.1, 2.1);
    ridePitch = clamp(ridePitch - dy*.003, -0.8, 0.8);
    return;
  }
  if(pts.size===2){
    const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0){if(chaseOn)CH.r=clamp(CH.r*pinchD/d,60,650);else cam.r=clamp(cam.r*pinchD/d,90,9800);}
    pinchD=d;return;
  }
  if(chaseOn){CH.th+=dx*.005;CH.ph=clamp(CH.ph-dy*.004,.18,1.45);return;}   // 追尾中は角度のみ操作
  setAuto(false);
  if(e.shiftKey||e.ctrlKey||(e.buttons&2)){cam.th+=dx*.005;cam.ph=clamp(cam.ph-dy*.004,.14,1.5);}   // 回転=修飾キー+ドラッグ
  else{pan(dx,dy);}   // 移動=ドラッグのみ
});
canvas.addEventListener('wheel',e=>{e.preventDefault();if(rideOn)return;
  if(chaseOn){CH.r=clamp(CH.r*Math.pow(1.0016,e.deltaY),60,650);return;}   // 追尾中は距離を操作
  fly=null;cam.r=clamp(cam.r*Math.pow(1.0016,e.deltaY),90,9800);},{passive:false});

function pan(dx,dy){
  const k=cam.r*.0014;
  const fx=-Math.cos(cam.th),fz=-Math.sin(cam.th),rx=-fz,rz=fx;
  cam.tx-=(rx*dx-fx*dy)*k;cam.tz-=(rz*dx-fz*dy)*k;   // dyの符号を反転(上下の追従を修正)
  cam.tx=clamp(cam.tx,-8500,800);cam.tz=clamp(cam.tz,-900,2100);
}

const el=(t,at)=>{const n=document.createElementNS(NSPS,t);for(const k in at)n.setAttribute(k,at[k]);nsvg.appendChild(n);return n;};
function buildNav(){

  for(const s of STA){

function accCurve(v,a){
  if(a>0)    return clamp(1-0.75*(v-60)/60, 0.20, 1);    // 力行:60km/h超で鈍化し120km/hで25%
  if(a<-0.2) return clamp(1-0.25*(v-60)/60, 0.70, 1);    // 制動:120km/hで75%、60km/h以下で100%
  return 1;                                              // 惰行(中立)
}

/* 影の「落とす/受ける」は最後に一括で設定する。生成箇所ごとに付けると
   必ず付け忘れが出て、その物だけ影が無いという分かりにくい不整合になる。
   ・地表は受けるだけ(巨大な板なので落とす側に入れても無駄)
   ・線(架線)とラベル(Sprite)は対象外 */
const SHADOW_STAT={cast:0,recv:0};
function applyShadows(){
  SHADOW_STAT.cast=0;SHADOW_STAT.recv=0;
  scene.traverse(function(o){
    if(!(o.isMesh||o.isInstancedMesh))return;
    o.receiveShadow=true;SHADOW_STAT.recv++;
    // 空ドームは裏面の巨大な球。影の対象に入れると世界中が影になる
    if(o===skyDome){o.castShadow=false;o.receiveShadow=false;SHADOW_STAT.recv--;return;}
    if(o===groundMesh||o.userData.flat){o.castShadow=false;return;}   // 地表と、地表に敷いた平らな面(道路)は受けるだけ
    // 夜の灯りは「光っている面」なので影を落とさない(落とすと灯りが黒い塊になる)
    if(o.userData.night){o.castShadow=false;o.receiveShadow=false;SHADOW_STAT.recv--;return;}
    o.castShadow=true;SHADOW_STAT.cast++;
  });
}
applyShadows();

let last=performance.now();
/* 世界(列車・扉・交差鉄道)を dt 秒進める。
   実時間のループと撮影モードの両方から呼ぶ。撮影では固定の dt を与えるので、
   何度流しても同じ絵が出る(動画の作り直しで結果が変わらない)。 */
function stepWorld(dt){
  stepRoadCars(dt);       // 自動車(線路を横切る道路・並ぶ幹線)
  stepPeds(dt);           // 歩道を歩く人
  if(!trainsOn) return;
  for(const t of trains){
    driveTrain(t,dt);     // 各駅停車の自動運転(加速P4/60km/h上限/減速B5/停車25秒)
    placeTrain(t);
    stepCarDoors(t,dt);   // 客用扉:停車中はホーム側だけ開く
  }
  stepSwitches(dt);       // 分岐器:近づく列車の進路へ転換(載っている間は動かさない)
  stepFlow(dt);           // 乗り降り:降りる人→階段・EV、その後に並んだ人が乗る
  stepPSD(dt);            // ホームドア:停車中(発車3秒前まで)だけ開く
  for(const c of parkedCars) lodCar(c);   // 留置中の編成もLODを見直す
  stepXRail(dt);          // 井の頭線・世田谷線
}
let cineOn=false;         // 撮影モード:実時間のループを止め、CINE が時間を進める
function loop(now){
  requestAnimationFrame(loop);
  if(cineOn){last=now;return;}
  // 最初のコマは rAF の時刻が読み込み完了の時刻より前のことがあり、差が負になる
  // (そのままだと列車や雪が数秒ぶん逆に進む)。0〜0.05秒に収める
  const dt=clamp((now-last)/1000,0,.05);last=now;
  stepWorld(dt);
  if(rideOn){
    stepRide(dt);
    updSpd();
    // 視線=線路の接線方向(勾配も含む)。同じ軌道オフセット上の前後2点から方向を作るため、
    // 曲線でも画面中央が線路の正面を向く。
    const p=frame(rideS,rideZf(rideS));            // 自列車の線(特急=本線・八幡山は外側の通過線/各停=待避線・停車線)
    const pa=frame(rideS-6,rideZf(rideS-6)), pb=frame(rideS+6,rideZf(rideS+6));   // 振り分けのS字でも線路の向きを見る
    let tx=pb.x-pa.x, tz=pb.z-pa.z, ty=railY(rideS+6)-railY(rideS-6);
    const tl=Math.hypot(tx,ty,tz)||1; tx/=tl; ty/=tl; tz/=tl;
    const EYE=3.2;                                   // 運転士の目線(レール面から)
    camera.up.set(0,1,0);
    camera.position.set(p.x, railY(rideS)+EYE, p.z);
    // 進行方向を基準に、ドラッグ量(rideYaw/ridePitch)だけ首を振る
    const base=Math.atan2(tz,tx), a2=base+rideYaw;
    const cp=Math.cos(ridePitch);
    const dx=Math.cos(a2)*cp, dz=Math.sin(a2)*cp, dy=ty*cp+Math.sin(ridePitch);
    camera.lookAt(p.x+dx*200, railY(rideS)+EYE+dy*200, p.z+dz*200);
    cam.tx=p.x;cam.tz=p.z;
  }else if(chaseOn){   // 注視点=列車固定、視点=球面(CH)上をユーザー操作可
    const t=trains[chaseIdx],zf=trainZf(t);
    const hx=t.x,ph2=frame(hx,zf(hx));
    const ty=railY(hx)+3;
    const ex=ph2.x+CH.r*Math.sin(CH.ph)*Math.cos(CH.th);
    const ey=Math.max(ty+CH.r*Math.cos(CH.ph),1.5,terH(ex,ph2.z+CH.r*Math.sin(CH.ph)*Math.sin(CH.th))+1.5);   // 地表(地形)より下へは行かない(掘割の列車を低い角度で見るとき)
    const ez=ph2.z+CH.r*Math.sin(CH.ph)*Math.sin(CH.th);
    const kk=Math.min(1,dt*3.6);
    chaseEye.x+=(ex-chaseEye.x)*kk;chaseEye.y+=(ey-chaseEye.y)*kk;chaseEye.z+=(ez-chaseEye.z)*kk;
    camera.position.copy(chaseEye);
    camera.lookAt(ph2.x,ty,ph2.z);
    cam.tx=ph2.x;cam.tz=ph2.z;
  }else{
    stepFly(now);
    if(autoOrbit&&!fly&&pts.size===0)cam.th+=dt*.03;
    applyCam();
  }
  syncNav();
  // 影の写す範囲を注視点へ追従させる(太陽の向きは変えない)
  sunFollow(cam.tx,cam.tz,
    Math.hypot(camera.position.x-cam.tx,camera.position.y,camera.position.z-cam.tz));
  CINE.tick(dt);          // 雪・花びら(冬・春)を進め、空をカメラの真上へ
  lodStruct();            // 駅・高架橋の細部は近くだけ描く(今のカメラで判定)
  // 車両の LOD も描く直前の今のカメラで(stepWorld はカメラを動かす前。最初のコマはカメラが原点=笹塚の近くに
  // あり、笹塚の留置車を高精細で描いて車番の画像まで作っていた)
  for(const t of trains) for(const c of t.cars) if(c.visible) lodCar(c);
  for(const c of parkedCars) lodCar(c);
  renderer.render(scene,camera);
}

/* ============ 13. 撮影モード(動画用) ============
   動画は「駅のフォーカス → 次の駅までの前面展望・俯瞰 → 次の駅のフォーカス」を
   繰り返す。時刻(朝/昼/夕/夜)と季節(春夏秋冬)を場面ごとに差し替える。

   ・実時間のループは止め(cineOn)、外部(tools/capture.js)が1コマずつ
     「時間を dt 進める → カメラを置く → 1枚描く」を呼ぶ。
     固定の dt なので、何度流しても同じ動画になる。
   ・色は「画面上でこう見せたい色」で書く。トーンマッピングを通すと沈むので、
     invTone() が逆算して実際に設定する値を作る(tools/tune_sky.js と同じ考え方)。 */
const CINE=(function(){
  /* ---- トーンマッピングの逆算(見せたい色 → 設定すべき色) ---- */
  const l2s=v=>(v<=0.0031308)?v*12.92:1.055*Math.pow(v,1/2.4)-0.055;
  const AIN=[[0.59719,0.07600,0.02840],[0.35458,0.90834,0.13383],[0.04823,0.01566,0.83777]];
  const AOUT=[[1.60475,-0.10208,-0.00327],[-0.53108,1.10813,-0.07276],[-0.07367,-0.00605,1.07602]];
  const mul=(M,c)=>[0,1,2].map(i=>M[0][i]*c[0]+M[1][i]*c[1]+M[2][i]*c[2]);
  const rrt=v=>(v*(v+0.0245786)-0.000090537)/(v*(0.983729*v+0.432951)+0.238081);
  function toneShow(lin){                      // リニア → 画面上のsRGB値(0〜1)
    const e=renderer.toneMappingExposure/0.6;
    let x=mul(AIN,[lin[0]*e,lin[1]*e,lin[2]*e]).map(rrt);
    return mul(AOUT,x).map(v=>l2s(Math.min(1,Math.max(0,v))));
  }
  const H=h=>[((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255];
  /* 見せたい色(16進) → 設定すべき著作値(16進)。ACESは成分を混ぜるので
     成分ごとではなく3成分まとめて反復で追い込む。 */
  function invTone(hex){
    const t=H(hex); let c=t.slice();
    for(let i=0;i<120;i++){
      const o=toneShow(c.map(s2l)); let moved=0;
      for(let k=0;k<3;k++){
        const r=(o[k]>1e-6)?t[k]/o[k]:1.6;
        const nv=Math.min(1,Math.max(0,c[k]*Math.pow(r,0.7)));
        moved=Math.max(moved,Math.abs(nv-c[k])); c[k]=nv;
      }
      if(moved<1e-7) break;
    }
    return (Math.round(c[0]*255)<<16)|(Math.round(c[1]*255)<<8)|Math.round(c[2]*255);
  }

  /* ---- 時刻 ------------------------------------------------------------
     az=方位[°](0=東・90=南・180=西) / el=高度[°]。空の色は"見せたい色"で書く。 */
  const TIME={
    morning:{n:'朝',  az: 12, el:19, sun:0xffd9a8, si:0.62,
             hs:0xdfe6f2, hg:0x8d8a86, hi:0.74, expo:1.18,
             sky:{top:0x8fb4dd, hor:0xf0e2d2, bot:0xc9ccce, glow:0xffe9c6}, fog:[2200,10000]},
    // 昼は画面の既定の見え方(3章の太陽・半球光・空の"見え方"・フォグ)と同じ値にする。
    // 画面のメニューは開いた時に 昼 を当てるので、ここがずれると既定の絵が変わってしまう
    noon   :{n:'昼',  dir:{x:2400,y:3200,z:1600}, sun:0xfff4e0, si:0.72,
             hs:0xe4ecf4, hg:0x8a8d90, hi:0.82, expo:1.18,
             sky:{top:0x9cc0e8, hor:0xd6e4ef, bot:0xc6d0d6, glow:0xf2e6d4}, fog:[2600,11500]},
    evening:{n:'夕',  az:168, el:14, sun:0xffb070, si:0.60,
             hs:0xe9d9cf, hg:0x87807c, hi:0.62, expo:1.18,
             sky:{top:0x7d9ec8, hor:0xf2c89a, bot:0xb8a89c, glow:0xffd9a0}, fog:[1800,9000]},
    // 夜は「暗いが見える」ようにする。地物を照らすのではなく灯りを足す(8b章)ので、
    // 環境光はほんの少し上げるだけでよい。lights:true が NIGHT を有効にする
    // 2026-10-12 利用者指示「夜が暗すぎる。もう少しだけ明るく」:環境光 0.26→0.34・露出 1.26→1.34・空を少し明るく
    // 2026-10-13 同じく「もう少しだけ明るく」:環境光 0.34→0.40・露出 1.34→1.40・空をもう少し明るく
    night  :{n:'夜',  az:115, el:48, sun:0xa8bcdc, si:0.10, lights:true,
             hs:0x3a4766, hg:0x1a2030, hi:0.40, expo:1.40,
             sky:{top:0x1e2b4a, hor:0x506083, bot:0x30394c, glow:0x7688ae}, fog:[1800,8200]},
  };
  /* ---- 季節(樹木と地表の色。いずれも"見せたい色"ではなく直接の着色) ---- */
  const SEASON={
    // 桜は一般樹と必ず別の色にする(同じにすると並木が消える)
    spring:{n:'春', ground:0xc6d9a6, tree:[0x8fbf72,0x7fb268,0xa8cf86], sakura:0xf2c0d2},
    summer:{n:'夏', ground:0xa6c893, tree:[0x5f8a4e,0x6f9160,0x55804a], sakura:0x7aa05e},
    autumn:{n:'秋', ground:0xc4c088, tree:[0xd08a3a,0xc2693a,0xb79a46], sakura:0xc9743a},
    winter:{n:'冬', ground:0xc0c2b2, tree:[0x8f8a76,0x7d7a68,0x9a927e], sakura:0xa6927c},
  };

  let curTime='noon', curSeason='summer', farCut=0;
  /* ---- 天候(2026-10-12 利用者指示:晴れ・曇り・雨・大雨・雷・雪。大雨と雷は併用できる) --------------
     時刻の表(TIME)に重ねて掛ける。晴れは掛けない(既定の見え方のまま)。雷だけを選ぶと 'storm'(暗い雲と雨に雷)。
       cloud … 空を同じ明るさの灰へ寄せる割合 / dim … その灰の明るさ(地平の見え方に掛ける)
       si・hi … 直射光・環境光に掛ける / fog … フォグの距離に掛ける(見通しが悪くなる)
       rain … 雨の粒(1=雨・2=大雨) / snow … 雪の粒 / wet … 地表を濡れて暗く / cover … 地表と木を雪で白く */
  const WEATHER={
    clear :{n:'晴れ'},
    cloudy:{n:'曇り', cloud:0.85, dim:0.92, si:0.40, hi:1.02, fog:0.70},
    rain  :{n:'雨',   cloud:0.95, dim:0.74, si:0.22, hi:0.86, fog:0.30, rain:1, wet:0.84},
    heavy :{n:'大雨', cloud:1.00, dim:0.56, si:0.12, hi:0.70, fog:0.13, rain:2, wet:0.74},
    storm :{n:'雷',   cloud:1.00, dim:0.48, si:0.12, hi:0.64, fog:0.25, rain:1, wet:0.80},
    snow  :{n:'雪',   cloud:0.95, dim:0.90, si:0.30, hi:1.05, fog:0.22, snow:1, cover:0.62},
  };
  let curWeather='clear', curThunder=false;
  const wxOf=()=>WEATHER[curWeather]||WEATHER.clear;
  const fogMul=()=>(wxOf().fog||1);
  // 見せたい色(16進)を、明るさ g(0〜1)のやや青みの灰へ c だけ寄せる
  const H2=h=>[((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255];
  const lumH=h=>{const c=H2(h); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];};
  function toGray(hex,g,c){
    const a=H2(hex), t=[g*0.97,g*0.99,g*1.03];
    const r=a.map((v,i)=>Math.min(1,Math.max(0,v+(t[i]-v)*c)));
    return (Math.round(r[0]*255)<<16)|(Math.round(r[1]*255)<<8)|Math.round(r[2]*255);
  }
  // 時刻×天候で、光・空・フォグを決める(時刻と天候のどちらを先に指定しても同じ結果)
  const WXB={hi:1, fog:new THREE.Color(), bg:new THREE.Color()};
  function applyAtmos(){
    const t=TIME[curTime]||TIME.noon, w=wxOf();
    sun.color.copy(srgb(t.sun)); sun.intensity=t.si*(w.si||1);
    hemi.color.copy(srgb(t.hs)); hemi.groundColor.copy(srgb(t.hg)); hemi.intensity=t.hi*(w.hi||1);
    renderer.toneMappingExposure=t.expo;
    // 空は"見せたい色"から逆算する。フォグは地平と同じ値(遠景が空へ溶ける)
    let sk=t.sky;
    if(w.cloud){ const g=lumH(sk.hor)*w.dim;
      sk={top:toGray(sk.top,g*0.92,w.cloud), hor:toGray(sk.hor,g,w.cloud), bot:toGray(sk.bot,g,w.cloud), glow:toGray(sk.glow,g,w.cloud)}; }
    SKY.TOP=invTone(sk.top); SKY.HOR=invTone(sk.hor);
    SKY.BOT=invTone(sk.bot); SKY.SUN=invTone(sk.glow);
    rebuildSky();
    scene.fog.color.copy(srgb(SKY.HOR));
    scene.fog.near=t.fog[0]*fogMul(); scene.fog.far=t.fog[1]*fogMul();
    scene.background.copy(srgb(SKY.HOR));
    skyDome.material.color.setScalar(1);
    WXB.hi=hemi.intensity; WXB.fog.copy(scene.fog.color); WXB.bg.copy(scene.background);
  }
  function setTime(k){
    const t=TIME[k]||TIME.noon; curTime=k;
    const a=(t.az||0)*Math.PI/180, e=(t.el||0)*Math.PI/180;
    setSunDir(t.dir?Object.assign({},t.dir)
      :{x:Math.cos(e)*Math.cos(a)*4000, y:Math.sin(e)*4000, z:Math.cos(e)*Math.sin(a)*4000});
    applyAtmos();
    NIGHT.set(!!t.lights);      // 窓・街灯・ホームの灯り(8b章)
    pidsSetTime(k);             // 発車標の時刻(7章)
    applyLook();                // 地表・樹木は時刻でも明るさが変わる
  }
  /* 地表と樹木の色を今の「季節 × 時刻」で塗り直す。
     **夜は地表と緑を暗く落とす**(`GROUND_NIGHT`)。落とさないと、夜なのに
     昼と同じ鮮やかな緑の地面が広がって、灯りを足しても夜に見えない。
     時刻と季節のどちらを変えても呼ぶ(片方だけだと前の時刻の明るさが残る)。 */
  /* ---- 季節の天候:冬=雪 / 春=桜の花びら(ほのかに) -----------------------
     【設計方針】
     ・粒は**世界に固定した場**として持ち、カメラの周り BOX 四方だけを切り出して描く
       (水平は剰余で巡回させる)。カメラが速く動いても粒が一緒に流されず、
       前面展望では正しく後ろへ流れていく
     ・位置は**時刻 t だけの関数**(乱数は生成時に一度だけ)。撮影の世界時間と同じ
       fxT で進めるので、撮り直しても並列に撮っても同じ粒が同じ場所に降る
     ・カメラのごく近く(NEAR 未満)の粒は描かない。目の前の1粒が画面を覆う
     ・点群は照明を受けないので、夜は色を落とす(昼の白のままだと夜に光って見える) */
  let fxT=0;
  const FX=(function(){
    // 粒を描くのはカメラの周り BOX 四方・上下 V の範囲だけ。広く取ると大半の粒が
    // 遠くて1画素未満になり、480×270では何も降っていないように見える(実測)
    const BOX=120, V=90, NEAR=5;
    function tex(draw){
      const cv=document.createElement('canvas');cv.width=cv.height=64;
      draw(cv.getContext('2d'));return canvasTex(cv);
    }
    const snowTex=tex(function(c){
      const g=c.createRadialGradient(32,32,2,32,32,30);
      g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.5,'rgba(255,255,255,0.75)');
      g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);
    });
    const petalTex=tex(function(c){        // 先端に切れ込みのある花びら
      c.translate(32,32);c.rotate(0.6);c.fillStyle='rgba(255,255,255,1)';
      c.beginPath();c.ellipse(0,0,24,14,0,0,Math.PI*2);c.fill();
      c.globalCompositeOperation='destination-out';
      c.beginPath();c.arc(27,0,7,0,Math.PI*2);c.fill();
    });
    function make(n,map,hex,size,opacity){
      const pos=new Float32Array(n*3), seed=new Float32Array(n*4);
      for(let i=0;i<n*4;i++) seed[i]=Math.random();
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const m=new THREE.PointsMaterial({map:map,color:srgb(hex),size:size,sizeAttenuation:true,
        transparent:true,opacity:opacity,depthWrite:false,alphaTest:0.02});
      const p=new THREE.Points(g,m);
      p.frustumCulled=false; p.visible=false; scene.add(p);
      return {p:p,pos:pos,seed:seed,n:n,base:srgb(hex)};
    }
    // 落下速度[m/s]・横揺れの振幅[m]と周期・風で流れる速さ[m/s]
    const SPEC={
      snow :{n:13000,fall:1.1, sway:0.6, freq:0.7, drift:0.25},
      petal:{n:1200, fall:0.7, sway:1.8, freq:1.3, drift:0.9},   // ほのかに=雪の1/10
    };
    const snow =make(SPEC.snow.n, snowTex, 0xffffff,0.62,0.95);
    const petal=make(SPEC.petal.n,petalTex,0xf6b8cc,0.55,0.95);
    // 中心 c・周期 L で v を巡回させる([c-L/2, c+L/2) に収める)
    const wrap=(v,c,L)=>c+((((v-c+L/2)%L)+L)%L)-L/2;
    function place(o,k,t){
      const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
      const a=o.pos, s=o.seed;
      for(let i=0;i<o.n;i++){
        const r0=s[i*4], r1=s[i*4+1], r2=s[i*4+2], r3=s[i*4+3];
        const sp=k.fall*(0.7+0.6*r3), ph=r3*6.2832, sw=k.sway*(0.5+r2);
        const y=cy+V/2-((((r1*V+sp*t)%V)+V)%V);          // 上下もカメラ基準で巡回
        const x=wrap(r0*BOX+k.drift*t+sw*Math.sin(t*k.freq+ph),cx,BOX);
        const z=wrap(r2*BOX+sw*Math.cos(t*k.freq*0.8+ph*1.3),cz,BOX);
        const near=Math.hypot(x-cx,y-cy,z-cz)<NEAR;
        a[i*3]=x; a[i*3+1]=(near||y<0)?-50:y; a[i*3+2]=z;   // 近すぎる粒・地中の粒は退ける
      }
      o.p.geometry.attributes.position.needsUpdate=true;
    }
    /* 雨:線分(落ちる向きに伸ばした筋)。雪と同じく世界に固定した場をカメラの周り RBOX 四方・上下 RV で巡回させる。
       大雨は本数を増やし、風で斜めに流す。1回の描画(LineSegments。本数は drawRange で切り替える) */
    const RBOX=70, RV=40, RNEAR=2.5;
    const RSPEC={
      rain :{n:5000, fall:8.0, len:0.55, wind:0.6, op:0.38},
      heavy:{n:14000,fall:10.0,len:0.95, wind:2.6, op:0.55},
    };
    const rain=(function(){
      const n=RSPEC.heavy.n, pos=new Float32Array(n*6), seed=new Float32Array(n*4);
      for(let i=0;i<n*4;i++) seed[i]=Math.random();
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const m=new THREE.LineBasicMaterial({color:srgb(0xc9d3dd),transparent:true,opacity:0.4,depthWrite:false});
      const p=new THREE.LineSegments(g,m); p.frustumCulled=false; p.visible=false; scene.add(p);
      return {p:p,pos:pos,seed:seed,n:0,k:null,base:srgb(0xc9d3dd)};
    })();
    function placeRain(o,k,t){
      const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z, a=o.pos, s=o.seed, dl=k.len/k.fall;
      for(let i=0;i<o.n;i++){
        const r0=s[i*4], r1=s[i*4+1], r2=s[i*4+2], r3=s[i*4+3], sp=k.fall*(0.85+0.3*r3);
        const y=cy+RV/2-((((r1*RV+sp*t)%RV)+RV)%RV);
        const x=wrap(r0*RBOX+k.wind*t,cx,RBOX), z=wrap(r2*RBOX,cz,RBOX);
        const off=(y<0)||Math.hypot(x-cx,y-cy,z-cz)<RNEAR;
        // 下端(今の位置)と上端(少し前の位置=風上・上)
        a[i*6]=x; a[i*6+1]=off?-50:y; a[i*6+2]=z;
        a[i*6+3]=x-k.wind*dl; a[i*6+4]=off?-50:y+sp*dl; a[i*6+5]=z;
      }
      o.p.geometry.attributes.position.needsUpdate=true;
    }
    /* 雷:光る時刻は世界時間 t だけで決まる(撮り直しても同じ所で光る)。600秒の周期に 4〜14秒おきの落雷を並べ、
       1回の落雷は「強く光る→少し暗く→もう一度光る→消える」(半分ほどは1回だけ)。光る間は環境光・空・フォグを明るくし、
       遠く(2.5〜4.5km)にジグザグの稲妻を出す */
    const BOLT=(function(){
      let sd=12345; const rnd=()=>((sd=(sd*1103515245+12345)&0x7fffffff)/0x7fffffff);
      const T=[]; for(let t=3+rnd()*4; t<600; t+=6+rnd()*12) T.push({t:t,dbl:rnd()<0.55,a:rnd()*6.2832,d:2500+rnd()*2000,s:Math.floor(rnd()*1e6)});
      return T;
    })();
    const BOLT_P=600;
    function strikeAt(t){ const tt=((t%BOLT_P)+BOLT_P)%BOLT_P; let b=null; for(const q of BOLT){ if(q.t<=tt) b=q; else break; } return b?{b:b,dt:tt-b.t}:null; }
    function flashOf(dt,dbl){
      if(dt<0) return 0;
      if(dt<0.07) return 1;
      if(!dbl) return dt<0.6?Math.exp(-(dt-0.07)/0.09):0;
      if(dt<0.16) return 0.22;
      if(dt<0.24) return 0.85;
      return dt<0.8?0.85*Math.exp(-(dt-0.24)/0.11):0;
    }
    const bolt=(function(){
      const N=48, g=new THREE.BufferGeometry(), pos=new Float32Array(N*6*3);
      g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const m=new THREE.MeshBasicMaterial({color:new THREE.Color(3.2,3.4,4.0),fog:false,transparent:true,depthWrite:false,
        blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
      const p=new THREE.Mesh(g,m); p.frustumCulled=false; p.visible=false; p.renderOrder=1; scene.add(p);
      return {p:p,pos:pos,N:N,seed:-1};
    })();
    function shapeBolt(b){                     // 稲妻の帯(雲の底 1400m → 地表)。カメラに向けた幅 8m の帯をジグザグに
      if(bolt.seed===b.s&&bolt.cam&&Math.hypot(bolt.cam[0]-camera.position.x,bolt.cam[1]-camera.position.z)<200) return;
      bolt.seed=b.s; bolt.cam=[camera.position.x,camera.position.z];
      let sd=b.s||1; const rnd=()=>((sd=(sd*1103515245+12345)&0x7fffffff)/0x7fffffff);
      const cx=camera.position.x+Math.cos(b.a)*b.d, cz=camera.position.z+Math.sin(b.a)*b.d;
      const rx=-Math.sin(b.a), rz=Math.cos(b.a), W=8;      // 視線に直角な横の向き
      const P=[]; let x=0;
      for(let i=0;i<=bolt.N;i++){ P.push([cx+rx*x, 1400*(1-i/bolt.N), cz+rz*x]); x+=(rnd()-0.5)*90; }
      const a=bolt.pos; let k=0;
      for(let i=0;i<bolt.N;i++){ const A=P[i], B=P[i+1], w=W*(1-0.6*i/bolt.N);
        const q=[[A[0]-rx*w,A[1],A[2]-rz*w],[A[0]+rx*w,A[1],A[2]+rz*w],[B[0]+rx*w,B[1],B[2]+rz*w],[B[0]-rx*w,B[1],B[2]-rz*w]];
        for(const j of [0,1,2,0,2,3]){ a[k++]=q[j][0]; a[k++]=q[j][1]; a[k++]=q[j][2]; } }
      bolt.p.geometry.attributes.position.needsUpdate=true;
    }
    let thunder=false, flash=0;
    return {
      set(w,season,night){
        snow.p.visible=!!w.snow; petal.p.visible=(season==='spring'&&!w.rain&&!w.snow);
        const d=night?0.45:1;
        snow.p.material.color.copy(snow.base).multiplyScalar(d);
        petal.p.material.color.copy(petal.base).multiplyScalar(d);
        const rk=w.rain===2?RSPEC.heavy:(w.rain?RSPEC.rain:null);
        rain.k=rk; rain.n=rk?rk.n:0; rain.p.visible=!!rk;
        rain.p.geometry.setDrawRange(0,rain.n*2);
        rain.p.material.opacity=rk?rk.op:0;
        rain.p.material.color.copy(rain.base).multiplyScalar(night?0.4:1);
        thunder=!!w.thunder; if(!thunder){ flash=0; bolt.p.visible=false; }
      },
      update(t){
        if(snow.p.visible) place(snow,SPEC.snow,t);
        if(petal.p.visible) place(petal,SPEC.petal,t);
        if(rain.p.visible&&rain.k) placeRain(rain,rain.k,t);
        if(thunder){
          const s=strikeAt(t); flash=s?flashOf(s.dt,s.b.dbl):0;
          hemi.intensity=WXB.hi*(1+2.6*flash);
          scene.fog.color.copy(WXB.fog).multiplyScalar(1+1.8*flash);
          scene.background.copy(WXB.bg).multiplyScalar(1+1.8*flash);
          skyDome.material.color.setScalar(1+2.4*flash);
          bolt.p.visible=!!s&&flash>0.3;
          if(bolt.p.visible) shapeBolt(s.b);
        }
      },
      flash:()=>flash, strikeAt:strikeAt, BOLT:BOLT,
      snow:snow, petal:petal, rain:rain, bolt:bolt, SPEC:SPEC, RSPEC:RSPEC, BOX:BOX, V:V, NEAR:NEAR, RBOX:RBOX, RV:RV, RNEAR:RNEAR,
    };
  })();

  const GROUND_NIGHT=0.55;          // 夜の地表と緑(昼の55%。2026-10-12 に 40%→48%、10-13 に 55% へ少し明るく)
  const URBAN_GROUND=0xc3c0b3, URBAN_MIX=0.3;     // 実データの緑があるときの既定の地表(住宅地など)
  function applyLook(){
    const s=SEASON[curSeason]||SEASON.summer;
    const dark=(TIME[curTime]&&TIME[curTime].lights)?GROUND_NIGHT:1;
    const w=wxOf(), wet=w.wet||1, cov=w.cover||0, SNOWC=srgb(0xe9edf1).multiplyScalar(dark);   // 雨=濡れて暗く・雪=白く
    MAT.ground.color.copy(srgb(s.ground)).multiplyScalar(dark*wet);
    if(LU.tint){
      LU.tint(srgb(s.ground).multiplyScalar(dark*wet).lerp(SNOWC,cov));
      // 実データの緑(公園・農地・山林)があるときは、既定の地表(住宅地・商業地…)を灰褐色へ寄せる。全面が芝生に見えない
      MAT.ground.color.lerp(srgb(URBAN_GROUND).multiplyScalar(dark*wet),URBAN_MIX);
    }
    if(cov) MAT.ground.color.lerp(SNOWC,cov);
    // 航空写真(3章)も地表と同じ係数:夜は暗く・雨は濡れて暗く・雪は白へ寄せる
    { const g=ORTHO_GAIN*dark*wet; ORTHO_U.uOrthoGain.value.set(g,g,g); ORTHO_U.uOrthoSnow.value.set(SNOWC.r,SNOWC.g,SNOWC.b,cov);
      const bc=srgb(ORTHO_BAND_HEX).multiplyScalar(dark*wet).lerp(SNOWC,cov); ORTHO_U.uOrthoBand.value.set(bc.r,bc.g,bc.b,1); }
    // 樹木は登録簿の順=インスタンスの順。種別(桜/一般)で色を選ぶ
    const col=new THREE.Color();
    for(let i=0;i<CITY.trees.length;i++){
      const tr=CITY.trees[i];
      const h=(tr.kind==='桜')?s.sakura:s.tree[(i*7)%s.tree.length];
      setSrgb(col,h).multiplyScalar(dark);
      if(cov) col.lerp(SNOWC,cov*0.55);       // 雪が積もった木
      CITY.crown.setColorAt(i,col);
    }
    if(CITY.crown.instanceColor)CITY.crown.instanceColor.needsUpdate=true;
    FX.set(Object.assign({thunder:curThunder},w), curSeason, dark<1);    // 雪・雨・雷(天候)/ 春=桜(雨と雪の日は無し)。夜は粒の色を落とす
  }
  function setSeason(k){ curSeason=k; applyLook(); }
  /* 天候:k は WEATHER のキー。thunder は大雨と雷(storm)にだけ付く(雷だけ=storm) */
  function setWeather(k,thunder){
    if(k==='thunder'){ k='storm'; thunder=true; }
    if(!WEATHER[k]) k='clear';
    curWeather=k; curThunder=(k==='storm')||(k==='heavy'&&!!thunder);
    applyAtmos(); applyLook();
  }

  /* ---- カメラ ---------------------------------------------------------- */
  function aimAt(px,py,pz,lx,ly,lz){
    camera.up.set(0,1,0);
    camera.position.set(px,py,pz); camera.lookAt(lx,ly,lz);
    cam.tx=px;cam.tz=pz;            // 影の追従はここを見る
  }
  const tangent=(s,d)=>{            // 線形の接線(単位)
    const a=frame(s-d,0), b=frame(s+d,0);
    let tx=b.x-a.x, tz=b.z-a.z; const l=Math.hypot(tx,tz)||1;
    return {x:tx/l, z:tz/l, y:(railY(s+d)-railY(s-d))/(2*d)};
  };
  // 駅のフォーカス:駅を見下ろしながらゆっくり回り込む(u=0〜1)
  function shotStation(st,u,th0){
    const p=frame(st.x,0), y=railY(st.x);
    const th=(th0===undefined?0.9:th0)+u*0.6, ph=0.92, r=205;
    aimAt(p.x+r*Math.sin(ph)*Math.cos(th), y+r*Math.cos(ph), p.z+r*Math.sin(ph)*Math.sin(th),
          p.x, y+5, p.z);
  }
  /* 駅のフォーカスに列車の到着/発車を入れる。自動運転の列車は等間隔で回っているだけ
     なので、撮る駅にちょうど列車が居るとは限らない。カットの頭で1本を"置き直す"。
     駅を見下ろす画では停車中の列車は上屋に隠れ、10秒で止まる/動き出すだけの動き
     (制動・加速で約40m)ではほとんど写らない(実測)。そこで動きの大きい区間を切り取る:
       arrive … 停止位置の ARRIVE_T 秒手前(60km/h から B5 で減速し始める所)に置く。
                カットの中でホームへ滑り込み、カットの後で止まる
       depart … 発車して DEPART_T 秒たった所に置く。カットの中で加速して駅を出ていく
     置き直しは列車の状態を絶対値で書き換えるので、それまでの経過に依らない
     (撮影ではコマ番号で決まる時刻に適用するので、並列に撮っても同じ映像になる)。
     同じ向きの別の列車が近くに居れば後ろへ退ける(同じ線路に2本重ならないように)。 */
  const STAGE={ARRIVE_T:20.0, DEPART_T:6.0, CLEAR:900, BACK:1200, PASS_T:30};
  function stage(i,mode,dir){
    const st=STA[i], t=trains.find(q=>q.dir===dir);
    if(!st||!t) return null;
    const stop=stopPosOf(st,dir)-dir*CAR_HALF, dec=DRIVE.DEC/3.6, acc=DRIVE.ACC/3.6;
    const vmax=DRIVE.VMAX_KMH/3.6, pass=!stopsAt(t,st);
    /* 近くの同じ向きの列車は後ろへ退ける。退け先は 450m ずつずらし、ほかの列車と 300m 以内にならない所を選ぶ。
       通過する列車(特急)はカットの間(PASS_T 秒)に上限の速さで先へ進むので、その先に居る列車も退ける
       (上りに各停・急行を足したので、通過駅のホームに各停が停まっていることがある) */
    const ahead=pass?STAGE.CLEAR+trainVmax(t)*STAGE.PASS_T:STAGE.CLEAR;
    const mv=trains.filter(q=>q!==t&&q.dir===dir&&(q.x-stop)*dir<ahead&&(stop-q.x)*dir<STAGE.CLEAR);
    let slot=0;
    for(const q of mv){
      let x;
      do{ x=stop-dir*(STAGE.BACK+450*slot); slot++; }
      while(trains.some(r=>r!==q&&r!==t&&r.dir===dir&&mv.indexOf(r)<0&&Math.abs(r.x-x)<300)&&slot<8);
      q.x=x; q.v=0; q.st='run'; q.target=null; q.atSt=null; q.dwell=0;
      for(const c of q.cars) setCarDoors(c,0,1);
      q.dr=0; q.dside=1;
      placeTrain(q);
    }
    if(pass){                                // 通過する駅(特急):本線の上限で駆け抜ける所を切り取る
      const vp=trainVmax(t);
      t.x=stop-dir*vp*(mode==='arrive'?4:-1); t.v=vp; t.st='run'; t.target=null; t.atSt=null; t.dwell=0;
      for(const c of t.cars) setCarDoors(c,0,1);
      t.dr=0; t.dside=1; placeTrain(t); syncSwitches(); return t;
    }
    if(mode==='arrive'){
      const v=Math.min(vmax,dec*STAGE.ARRIVE_T), d=v*v/(2*dec);   // 制動距離ちょうどの位置から減速
      t.x=stop-dir*d; t.v=v; t.st='brake'; t.target={s:stop,st:st}; t.atSt=null; t.dwell=0;
    }else{
      const v=Math.min(vmax,acc*STAGE.DEPART_T), d=v*v/(2*acc);   // 発車してから進んだ距離
      t.x=stop+dir*d; t.v=v; t.st='run'; t.dwell=0; t.atSt=null; t.target=null;
    }
    for(const c of t.cars) setCarDoors(c,0,1);            // 扉は閉めた状態から(開閉は自動運転が行う)
    t.dr=0; t.dside=1;
    placeTrain(t);
    syncSwitches();                                       // 置き直した列車が載る分岐器はその進路へ
    return t;
  }
  // 前面展望:下り線の運転台から
  function shotFront(s){
    const off=zDown(s), p=frame(s,off), t=tangent(s,6), EYE=3.3;
    aimAt(p.x, railY(s)+EYE, p.z, p.x+t.x*200, railY(s)+EYE+t.y*200, p.z+t.z*200);
  }
  // 俯瞰展望:進行方向の左斜め後ろから、少し先を見る
  function shotAerial(s,u){
    const p=frame(s,0), y=railY(s), t=tangent(s,40);
    const side=135+25*Math.sin(u*Math.PI), h=90+18*Math.sin(u*Math.PI);
    aimAt(p.x-t.x*150-t.z*side, y+h, p.z-t.z*150+t.x*side, p.x+t.x*70, y+4, p.z+t.z*70);
  }

  function hideUI(){
    for(const id of ['nav','tools','spd','navTog','toolTog','rot'])
      {const e=document.getElementById(id); if(e)e.style.display='none';}
    for(const sp of staLabels.concat(tagLabels,xingLabels)) sp.visible=false;
  }
  /* 画面の左下に出す字幕。駅名と「時刻・季節」を出す。
     3D内のスプライトではなくDOMに置く:撮影の画像にはそのまま写り、
     解像度を変えても字の大きさが崩れない。 */
  let capEl=null;
  function caption(main,sub){
    if(!capEl){
      capEl=document.createElement('div');
      capEl.style.cssText='position:fixed;left:2.2%;bottom:5%;z-index:60;'+
        'font-family:"IPAGothic","Noto Sans JP",sans-serif;color:#fff;'+
        'text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.5);'+
        'line-height:1.25;pointer-events:none;letter-spacing:.04em';
      document.body.appendChild(capEl);
    }
    capEl.style.display=(main||sub)?'block':'none';
    capEl.innerHTML='<div style="font-size:3.1vh;font-weight:bold">'+(main||'')+
      '</div><div style="font-size:1.9vh;opacity:.88">'+(sub||'')+'</div>';
  }
  /* 撮影用の見通し距離。前面展望は線路の先にある物が全部画角へ入るので、
     描画の呼び出し回数が他の画(約1,500)の5倍に跳ね上がる。遠方面とフォグを
     縮めて霞ませると見た目を保ったまま軽くなる。far=0 で時刻の既定へ戻す。
     遠方面を縮めると空ドーム(R=16,000m)が切り落とされるので、
     render() でドームをカメラの真上へ移し、遠方面の内側へ縮める。 */
  function setFar(far,fogNear,fogFar){
    farCut=far||0;
    const t=TIME[curTime]||TIME.noon;
    camera.far = farCut ? farCut : 30000;
    const wm=fogMul();                         // 天候で見通しが悪いときは近い方
    scene.fog.near = farCut ? Math.min(fogNear,wm<1?t.fog[0]*wm:Infinity) : t.fog[0]*wm;
    scene.fog.far  = farCut ? Math.min(fogFar, wm<1?t.fog[1]*wm:Infinity) : t.fog[1]*wm;
    camera.updateProjectionMatrix();
    skyDome.scale.setScalar(farCut ? Math.min(1,farCut*0.92/SKY_R) : 1);
  }
  /* 影の品質。影は1パス増えるうえ影マップの解像度ぶん描き直すので、
     撮影の所要時間に最も効く。size を変えたら影マップは作り直させる。 */
  function setShadow(on,size){
    renderer.shadowMap.enabled=!!on; sun.castShadow=!!on;
    if(size){
      sun.shadow.mapSize.set(size,size);
      if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
    }
  }
  function render(){
    // 空は無限遠のものなので、カメラの真上へ平行移動して描く
    // (置きっぱなしだと区間の端で太陽の輝きの向きがずれる)
    skyDome.position.set(camera.position.x,0,camera.position.z);
    sunFollow(cam.tx,cam.tz,
      Math.hypot(camera.position.x-cam.tx,camera.position.y,camera.position.z-cam.tz));
    FX.update(fxT);              // 雪・花びらを今の時刻とカメラ位置で置き直す
    // 車両の LOD は「今のカメラ」で決め直す。世界を進めた後にカメラを動かすので、
    // そのままだと1コマ前のカメラ位置で判定され、カットの頭で前面の部品が消える
    for(const t of trains) for(const c of t.cars) if(c.visible) lodCar(c);
    for(const c of parkedCars) lodCar(c);
    lodStruct();                 // 駅・高架橋の細部も今のカメラで判定する
    renderer.render(scene,camera);
  }
  return {
    begin(){cineOn=true;hideUI();},
    setTime:setTime, setSeason:setSeason, setWeather:setWeather,
    times:Object.keys(TIME), seasons:Object.keys(SEASON),
    weathers:['clear','cloudy','rain','heavy','thunder','snow'],      // 画面のメニューの並び(thunder=雷。大雨と併用できる)
    label:()=>TIME[curTime].n+'・'+SEASON[curSeason].n+(curWeather!=='clear'?'・'+(curWeather==='heavy'&&curThunder?'大雨と雷':WEATHER[curWeather].n):''),
    step:dt=>{stepWorld(dt);fxT+=dt;},   // 天候の粒も同じ世界時間で進める
    shotStation:shotStation, shotFront:shotFront, shotAerial:shotAerial, stage:stage, STAGE:STAGE,
    render:render, caption:caption, setFar:setFar, setShadow:setShadow,
    fx:FX, fxTime:()=>fxT,
    /* 実時間のループから毎コマ呼ぶ(画面のメニューで時刻・季節を選んだとき用)。
       撮影の render() と同じく、空はカメラの真上へ移し、雪・花びらを今の時刻で置き直す */
    tick(dt){fxT+=dt; skyDome.position.set(camera.position.x,0,camera.position.z); FX.update(fxT);},
    now:()=>({time:curTime,season:curSeason,weather:curWeather,thunder:curThunder}),
    stations:STA.map(s=>({n:s.n,x:s.x})),
    setSize(w,h){renderer.setPixelRatio(1);renderer.setSize(w,h,false);
      camera.aspect=w/h;camera.updateProjectionMatrix();},
    stats:()=>({calls:renderer.info.render.calls,tri:renderer.info.render.triangles}),
  };
})();
window.CINE=CINE;
// 検証用(tools/verify_k8render.js):車両だけを白い一様な光の正射影で描き、
// v4 の照合ツール(側面45項目・前面14項目)で測るための入口
window.K8API={makeCar:makeCar, setCarDoors:setCarDoors, renderer:renderer, K8:K8, scene:scene};

/* ---- 航空写真の読み込み(3章の ORTHO_U の画像を作り、毎コマ lodStruct から update()) ----
   ・窓の置き場:カメラの前の地表(視線が地表に当たる所。当たらなければ ahead[m] 先。近は 350m・中は 1400m まで先へ寄せる)。
     窓の中心から 0.75 枚ずれたら、1枚単位で置き直す(行ったり来たりで置き直しを繰り返さない)
   ・読み込み:同時に 8枚まで。遠→中→近の順に、窓の中心に近いタイルから。読めたタイルは1コマに 6枚まで画像へ書く(撮影中と
     settle() は全部)。失敗したタイル(写真の無い所)はその段を使わない(下の段が見える)。初めの 12枚が全部失敗したら読むのをやめる
     (オフライン。今の色のまま)
   ・読んだ画像は最近使った 300枚(スマホ 100枚)を手元に置く。窓が戻れば読み直さずに書く
   ・settle():今のカメラの窓のタイルが揃う(か失敗する)まで待つ。撮影(capture.js)と検証が毎コマの前に呼ぶ=いつ撮っても同じ絵 */
ORTHO_MGR=(function(){
  if(typeof Image==='undefined') return null;
  const URL0='https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/', R2D=180/Math.PI, P2=z=>Math.pow(2,z);
  const lonOf=x=>LON0+x/MLON, latOf=z=>LAT0-z/MLAT;                     // toXY の逆
  const tX=(x,zm)=>(lonOf(x)+180)/360*P2(zm);
  const tY=(z,zm)=>{const r=latOf(z)/R2D; return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*P2(zm);};
  const xOf=(tx,zm)=>(tx/P2(zm)*360-180-LON0)*MLON;
  const zOf=(ty,zm)=>-(Math.atan(Math.sinh(Math.PI*(1-2*ty/P2(zm))))*R2D-LAT0)*MLAT;
  // 窓の原点(タイル ox,oy の北西の隅)のまわりの展開:tc.x=(x−x0)·sx, tc.y=(z−z0)·sz+(z−z0)²·q
  function frameOf(ox,oy,zm){
    const x0=xOf(ox,zm), z0=zOf(oy,zm), r=latOf(z0)/R2D, k=P2(zm)/(360*MLAT);
    return {x0:x0,z0:z0,sx:P2(zm)/(360*MLON),sz:k/Math.cos(r),q:-k*Math.tan(r)/Math.cos(r)*Math.PI/(360*MLAT)};
  }
  const setQ=(i,q)=>{const v=ORTHO_U.uOq.value; if(i===0)v.x=q; else if(i===1)v.y=q; else v.z=q;};
  const pot=n=>{let p=1; while(p<n) p*=2; return p;};
  const mkTex=(nx,ny,rep)=>{ const t=new THREE.DataTexture(null,nx*256,ny*256,THREE.RGBAFormat,THREE.UnsignedByteType);
    t.wrapS=t.wrapT=rep?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping; t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearMipmapLinearFilter;
    t.generateMipmaps=true; t.flipY=false; t.anisotropy=8; t.needsUpdate=true; return t; };
  const CLR=new THREE.DataTexture(new Uint8Array(256*256*4),256,256,THREE.RGBAFormat,THREE.UnsignedByteType), SRC=new THREE.Texture(), POS=new THREE.Vector2();
  const LV=ORTHO_LV.map((L,i)=>({i:i,z:L.z,n:L.n,ahead:L.ahead,whole:!!L.whole,ox:null,oy:null,nx:0,ny:0,slots:null,order:null,tex:null,
    u:ORTHO_U['uOr'+i].value,w:ORTHO_U['uOw'+i].value}));
  for(const L of LV){
    if(L.whole){ const x0=Math.floor(tX(TER.X0,L.z)), x1=Math.floor(tX(TER.X1,L.z)), y0=Math.floor(tY(TER.Z0,L.z)), y1=Math.floor(tY(TER.Z1,L.z));
      L.ox=x0; L.oy=y0; L.nx=pot(x1-x0+1); L.ny=pot(y1-y0+1); }   // 遠:地表全体を覆うタイル(一辺を2の冪に)
    else if(L.n){ L.nx=L.ny=L.n; }
    else continue;                                                // スマホの近
    L.tex=mkTex(L.nx,L.ny,!L.whole); ORTHO_U['uOrtho'+L.i].value=L.tex;
    L.slots=[]; for(let j=0;j<L.ny;j++) for(let i=0;i<L.nx;i++) L.slots.push({sx:i,sy:j,tx:null,ty:null,ok:false,has:false});
    if(L.whole){ for(const S of L.slots){S.tx=L.ox+S.sx; S.ty=L.oy+S.sy;}
      const f=frameOf(L.ox,L.oy,L.z); L.u.set(f.x0,f.z0,f.sx,f.sz); setQ(L.i,f.q); L.w.set(0,0,L.nx,L.ny); }
  }
  for(const L of LV) if(!L.tex){ const t=new THREE.DataTexture(new Uint8Array(4),1,1,THREE.RGBAFormat,THREE.UnsignedByteType);
    t.needsUpdate=true; ORTHO_U['uOrtho'+L.i].value=t; }            // 使わない段(スマホの近)は透明な1画素(画像の無い枠を読ませない)
  const ORDER=[LV[2],LV[1],LV[0]].filter(L=>L.slots);              // 遠→中→近
  const sortSlots=L=>{ const cx=L.ox+L.nx/2, cy=L.oy+L.ny/2; L.order=L.slots.slice().sort((a,b)=>Math.hypot(a.tx+0.5-cx,a.ty+0.5-cy)-Math.hypot(b.tx+0.5-cx,b.ty+0.5-cy)); };
  for(const L of ORDER) if(L.whole) sortSlots(L);
  /* 線路の帯の印:帯の縁からの距離[m](帯の外が正)を 128+10×距離 の 8bit で(±12.7m)。4m/画素の格子で地表の範囲を覆う。
     帯=事業区間の中の |off| ≤ 桁の半幅(掘割は側ごとの幅)+5.2m(建物を置かない帯 cityFree と同じ)と、交差鉄道(KEEP の直線)と、
     その帯に掛かって街から外した実際の建物の足跡+1m(ORTHO_HOLES のうち帯の縁から ORTHO_HOLE_NEAR 以内の物) */
  const MC=4, MW=Math.ceil((TER.X1-TER.X0)/MC), MH=Math.ceil((TER.Z1-TER.Z0)/MC), MD=new Uint8Array(MW*MH).fill(255);
  const XL=KEEP.filter(q=>q.k==='l');
  const half=(s,sg)=>(s>DECK_END?cutHalf(s,sg):deckHalf(s))+5.2;
  function bandDist(x,z){
    const q=prjXY(x,z), sc=clamp(q.s,DOM.x0,DOM.x1);
    let d=Math.max(Math.abs(q.off)-half(sc,q.off<0?-1:1),DOM.x0-q.s,q.s-DOM.x1);
    for(const L of XL){ const p=L.A.uv(x,z);
      const a=Math.max(L.u0-p.u,p.u-L.u1), b=Math.abs(p.n)-keepHw(L,p.u,p.n); d=Math.min(d,(a>0&&b>0)?Math.hypot(a,b):Math.max(a,b)); }
    return d;
  }
  {
    const seen=new Uint8Array(MW*MH);
    const put=(x,z)=>{ const i=Math.floor((x-TER.X0)/MC), j=Math.floor((z-TER.Z0)/MC); if(i<0||j<0||i>=MW||j>=MH) return;
      const k=j*MW+i; if(seen[k]) return; seen[k]=1;
      MD[k]=Math.max(0,Math.min(255,Math.round(128+10*bandDist(TER.X0+(i+0.5)*MC,TER.Z0+(j+0.5)*MC)))); };
    for(let s=DOM.x0-20;s<=DOM.x1+20;s+=2) for(let o=-46;o<=46;o+=2){ const f=frame(s,o); put(f.x,f.z); }
    for(const L of XL) for(let u=L.u0-20;u<=L.u1+20;u+=2) for(let v=-(keepHw(L,u,-1)+20);v<=keepHw(L,u,1)+20;v+=2){ const w=L.A.pos(u,v); put(w.x,w.z); }
    // 線路の帯に掛かって外した実際の建物の足跡+ORTHO_HOLE_M(帯との和=距離の小さい方)。値が飽和する 12.7m の外までは測らない
    const nearBand=P=>{ for(let i=0;i<P.length;i++){ const a=P[i], c=P[(i+1)%P.length], m=Math.max(1,Math.ceil(Math.hypot(c[0]-a[0],c[1]-a[1])/2));
      for(let k=0;k<m;k++) if(bandDist(a[0]+(c[0]-a[0])*k/m,a[1]+(c[1]-a[1])*k/m)<ORTHO_HOLE_NEAR) return true; } return false; };
    for(const P of ORTHO_HOLES){
      if(!nearBand(P)) continue;
      let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9; for(const p of P){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); z0=Math.min(z0,p[1]); z1=Math.max(z1,p[1]); }
      const i0=Math.max(0,Math.floor((x0-14-TER.X0)/MC)), i1=Math.min(MW-1,Math.floor((x1+14-TER.X0)/MC));
      const j0=Math.max(0,Math.floor((z0-14-TER.Z0)/MC)), j1=Math.min(MH-1,Math.floor((z1+14-TER.Z0)/MC));
      for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){ const k=j*MW+i, d=polyDist(P,TER.X0+(i+0.5)*MC,TER.Z0+(j+0.5)*MC)-ORTHO_HOLE_M;
        MD[k]=Math.min(MD[k],Math.max(0,Math.min(255,Math.round(128+10*d)))); }
    }
  }
  const MT=new THREE.DataTexture(MD,MW,MH,THREE.LuminanceFormat,THREE.UnsignedByteType);
  MT.magFilter=THREE.LinearFilter; MT.minFilter=THREE.LinearFilter; MT.generateMipmaps=false; MT.flipY=false; MT.unpackAlignment=1; MT.needsUpdate=true;
  ORTHO_U.uOrthoMask.value=MT; ORTHO_U.uOm.value.set(TER.X0,TER.Z0,1/(MW*MC),1/(MH*MC));
  // シェーダと同じ式(検証用):帯の印の双線形と、写真を使う割合(0=今の色・1=写真)
  function maskAt(x,z){
    const u=(x-TER.X0)/MC-0.5, v=(z-TER.Z0)/MC-0.5; if(u<-0.5||v<-0.5||u>MW-0.5||v>MH-0.5) return 1;
    const i=clamp(Math.floor(u),0,MW-2), j=clamp(Math.floor(v),0,MH-2), a=clamp(u-i,0,1), b=clamp(v-j,0,1), g=(ii,jj)=>MD[jj*MW+ii];
    const m=((g(i,j)*(1-a)+g(i+1,j)*a)*(1-b)+(g(i,j+1)*(1-a)+g(i+1,j+1)*a)*b);
    return clamp((m-128)*0.1+0.5,0,1);
  }
  /* 窓の置き場:視線が地表に当たる所(当たらなければ ahead 先)。カメラの前の地表 */
  const _d=new THREE.Vector3();
  function center(ahead){
    const p=camera.position; camera.getWorldDirection(_d);
    const fh=Math.hypot(_d.x,_d.z); if(!(fh>1e-4)) return {x:p.x,z:p.z};
    const h=Math.max(1,p.y-terH(p.x,p.z)), pitch=Math.atan2(-_d.y,fh), D=pitch>0.01?h/Math.tan(pitch):1e9, d=Math.min(D,ahead);
    return {x:p.x+_d.x/fh*d, z:p.z+_d.z/fh*d};
  }
  /* 画像の枠へ書く。縮小の段(mipmap)の作り直しは重い(2048 四方。ソフトウェアの描画では 1回 数十ms)ので、書くときは作り直さず、
     コマの終わりに画像ごとに1回だけ(その画像へ最後に書いたものを、作り直しを付けてもう一度書く) */
  const LAST=new Map();
  function blit(L,S,src){ POS.set(S.sx*256,S.sy*256);
    L.tex.generateMipmaps=!L.up; L.up=true;                       // 初めての書き込みは画像を GPU に作るので段も作る
    renderer.copyTextureToTexture(POS,src,L.tex); L.tex.generateMipmaps=true;
    LAST.set(L,{x:S.sx*256,y:S.sy*256,src:src===CLR?CLR:src.image}); }
  function mips(){ for(const [L,o] of LAST){ POS.set(o.x,o.y); if(o.src===CLR) renderer.copyTextureToTexture(POS,CLR,L.tex); else { SRC.image=o.src; renderer.copyTextureToTexture(POS,SRC,L.tex); } } LAST.clear(); }
  function clearSlot(L,S){ blit(L,S,CLR); S.has=false; }   // α=0 で塗る
  function place(L){
    const c=center(L.ahead), cx=tX(c.x,L.z), cy=tY(c.z,L.z), n=L.n;
    if(L.ox!==null&&Math.abs(cx-(L.ox+n/2))<0.75&&Math.abs(cy-(L.oy+n/2))<0.75) return;
    const ox=Math.round(cx-n/2), oy=Math.round(cy-n/2);
    if(ox===L.ox&&oy===L.oy) return;
    L.ox=ox; L.oy=oy;
    for(const S of L.slots){                                    // 枠 sx に入るのは窓の中で番号が sx と n の剰余で等しいタイル
      const tx=ox+(((S.sx-ox)%n)+n)%n, ty=oy+(((S.sy-oy)%n)+n)%n;
      if(tx!==S.tx||ty!==S.ty){ if(S.has) clearSlot(L,S); S.tx=tx; S.ty=ty; S.ok=false; }
    }
    const f=frameOf(ox,oy,L.z); L.u.set(f.x0,f.z0,f.sx,f.sz); setQ(L.i,f.q); L.w.set(((ox%n)+n)%n,((oy%n)+n)%n,n,n);
    sortSlots(L);
  }
  // 読み込み
  let on=true, active=0, tries=0, fails=0, dead=false, frameNo=0, nOk=0, cred=null;
  try{ on=localStorage.getItem('keio3d.photo')!=='0'; }catch(e){}
  const cache=new Map(), MAXA=8, CACHE_MAX=IS_MOBILE?100:300;
  const keyOf=(L,S)=>L.z+'/'+S.tx+'/'+S.ty;
  function want(L,S){
    const k=keyOf(L,S); let e=cache.get(k);
    if(e){ e.t=frameNo; return e; }
    if(active>=MAXA||dead) return null;
    e={k:k,st:0,img:null,t:frameNo}; cache.set(k,e); active++; tries++;
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{ e.st=1; e.img=img; active--; };
    img.onerror=()=>{ e.st=2; active--; fails++; if(tries>=12&&fails===tries) dead=true; };
    img.src=URL0+k+'.jpg';
    return e;
  }
  function putSlot(L,S,img){
    SRC.image=img; blit(L,S,SRC);
    S.ok=true; S.has=true; nOk++; if(!cred) credit(); if(nOk===1) showWater();
  }
  // 水面(4章の LU.waterMesh):写真が出ている間は隠す(写真に本物の川面が写っている。空を映す水面だけが白く浮く)
  function showWater(){ if(LU.waterMesh) LU.waterMesh.visible=!(on&&nOk>0); }
  function pump(limit){
    let n=0;
    for(const L of ORDER) for(const S of L.order||[]){
      if(S.ok||S.tx===null) continue;
      const e=want(L,S); if(!e||e.st!==1) continue;
      if(n<limit){ putSlot(L,S,e.img); n++; }
    }
    return n;
  }
  function evict(){
    if(cache.size<=CACHE_MAX) return;
    const inWin=new Set(); for(const L of ORDER) for(const S of L.slots) if(S.tx!==null) inWin.add(keyOf(L,S));
    const old=[...cache.values()].filter(e=>e.st!==0&&!inWin.has(e.k)).sort((a,b)=>a.t-b.t);
    for(let i=0;i<old.length&&cache.size>CACHE_MAX;i++) cache.delete(old[i].k);
  }
  function credit(){
    try{
      if(!cred){ cred=document.createElement('div');
        cred.textContent='航空写真:地理院タイル(全国最新写真(シームレス))を加工';   // CREDITS.txt と同じ表記
        cred.style.cssText='position:fixed;right:6px;bottom:40px;font:11px sans-serif;color:#334;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:4px;z-index:5;pointer-events:none';
        document.body.appendChild(cred); }
      cred.style.display=on?'':'none';
    }catch(e){}
  }
  function update(all){
    if(!on) return;
    frameNo++;
    for(const L of ORDER) if(!L.whole) place(L);
    pump(all||cineOn?1e9:6);
    mips();                                                      // 書いた画像の縮小の段を1回ずつ作り直す
    if(frameNo%60===0) evict();
  }
  // 今のカメラの窓のタイルが揃う(か失敗する)まで待つ。戻り値は stat()
  function pending(){ if(dead) return 0; let n=0; for(const L of ORDER) for(const S of L.slots){ if(S.ok||S.tx===null) continue; const e=cache.get(keyOf(L,S)); if(!e||e.st===0) n++; } return n; }
  function settle(ms){
    return new Promise(res=>{ const t0=Date.now();
      const chk=()=>{ update(true); if(!on||dead||pending()===0||Date.now()-t0>(ms||60000)) res(stat()); else setTimeout(chk,30); };
      chk(); });
  }
  function stat(){ return {on:on,dead:dead,tries:tries,fails:fails,cache:cache.size,put:nOk,pending:pending(),
    levels:LV.map(L=>({z:L.z,ox:L.ox,oy:L.oy,nx:L.nx,ny:L.ny,ok:L.slots?L.slots.filter(S=>S.ok).length:0,slots:L.slots?L.slots.length:0}))}; }
  function setOn(v){ on=!!v; ORTHO_U.uOrthoOn.value=on?1:0; try{localStorage.setItem('keio3d.photo',on?'1':'0');}catch(e){} if(cred) credit(); showWater(); }
  setOn(on);
  return {update:update,settle:settle,setOn:setOn,stat:stat,maskAt:maskAt,bandDist:bandDist,frameOf:frameOf,tX:tX,tY:tY,LV:LV,
    URL0:URL0,MC:MC,MW:MW,MH:MH,get on(){return on;},get dead(){return dead;}};
})();
$('btnPhoto').onclick=e=>{ if(!ORTHO_MGR) return; const v=!ORTHO_MGR.on; ORTHO_MGR.setOn(v);
  e.target.classList.toggle('on',v); e.target.textContent='航空写真 '+(v?'ON':'OFF'); };
{ const b=$('btnPhoto'), v=!!(ORTHO_MGR&&ORTHO_MGR.on); b.classList.toggle('on',v); b.textContent='航空写真 '+(v?'ON':'OFF'); if(!ORTHO_MGR) b.disabled=true; }

/* ---- 時刻・季節(画面のメニュー) ----
   撮影モードと同じ CINE.setTime / setSeason を使う(太陽の向き・光の色・露出・空・フォグ・
   夜の灯り・地表と樹木の色・冬の雪/春の花びら)。選んだ組合せはこの端末に覚えておき、
   次に開いたときも使う(保存できない環境では既定の 昼・夏)。 */
const LOOK_UI={time:'noon',season:'summer',weather:'clear',thunder:false};
function setLookUI(t,s){
  if(t&&CINE.times.indexOf(t)>=0){LOOK_UI.time=t;CINE.setTime(t);}
  if(s&&CINE.seasons.indexOf(s)>=0){LOOK_UI.season=s;CINE.setSeason(s);}
  for(const b of document.querySelectorAll('#segTime button')) b.classList.toggle('on',b.dataset.k===LOOK_UI.time);
  for(const b of document.querySelectorAll('#segSeason button')) b.classList.toggle('on',b.dataset.k===LOOK_UI.season);
  try{localStorage.setItem('keio3d.look',JSON.stringify(LOOK_UI));}catch(e){}
}
/* 天候のメニュー:晴れ・曇り・雨・大雨・雪はどれか1つ。雷は大雨と併用できる(大雨のときに押すと大雨+雷、
   それ以外で押すと雷だけ=暗い雲と雨に雷)。雷をもう一度押すと消える(大雨+雷なら大雨に、雷だけなら晴れに) */
function weatherClick(k){
  let w=LOOK_UI.weather, th=LOOK_UI.thunder;
  if(k==='thunder'){ if(th){ th=false; if(w==='storm') w='clear'; } else { th=true; if(w!=='heavy') w='storm'; } }
  else if(k==='heavy'){ w='heavy'; }                                // 雷はそのまま(大雨+雷)
  else { w=k; th=false; }
  setWeatherUI(w,th);
}
function setWeatherUI(w,th){
  CINE.setWeather(w,th);
  const nw=CINE.now(); LOOK_UI.weather=nw.weather; LOOK_UI.thunder=nw.thunder;
  for(const b of document.querySelectorAll('#segWeather button'))
    b.classList.toggle('on',b.dataset.k==='thunder'?LOOK_UI.thunder:b.dataset.k===LOOK_UI.weather);
  try{localStorage.setItem('keio3d.look',JSON.stringify(LOOK_UI));}catch(e){}
}
for(const b of document.querySelectorAll('#segTime button')) b.onclick=()=>setLookUI(b.dataset.k,null);
for(const b of document.querySelectorAll('#segSeason button')) b.onclick=()=>setLookUI(null,b.dataset.k);
for(const b of document.querySelectorAll('#segWeather button')) b.onclick=()=>weatherClick(b.dataset.k);
{
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('keio3d.look')||'null');}catch(e){saved=null;}
  setLookUI((saved&&saved.time)||'noon',(saved&&saved.season)||'summer');
  setWeatherUI((saved&&saved.weather)||'clear',!!(saved&&saved.thunder));
}

trains.forEach(placeTrain);
requestAnimationFrame(loop);
