/* ---- 駅の構造(2026-10 作り込み) -------------------------------------------
   【設計方針】駅は次の部品に分けて組み立てる。すべて駅ごとの結合ジオメトリ(STG)へ積むので、
   細かくしても描画の呼び出しは駅あたり材質の数(10回程度)で済む。遠くでは細部(md)を省く。
     ホーム    … 縁の張出し(下は退避空間)・縁石・点字ブロック・端の柵・番線の機器
     屋根      … 大屋根(公表デザインの7駅)/片持ちの上屋(既存駅)。梁・天井・鼻隠し・天窓
     柱        … ホームの樹状柱(枝で屋根の梁を受ける)。架線柱は屋根の梁と同じ位置で受ける
     昇降      … 階段とエスカレーターの井戸(床を抜く)・エレベーター
     サイン    … 吊りレールの駅名標(線路に向けて両面)・出口の案内・駅舎の看板
     ベンチ等  … ベンチ・自動販売機(乗務員用モニターは置かない:車上の車内モニター式とする。利用者指示)
     外装      … 側面(ホーム階)と高架下の駅舎。公表デザインの要点を形で表す
   公表デザインの要点(京王電鉄 2019.5.30 の発表文。図は参照できていない):
     代田橋   … レンガ調+透明感のある素材(近隣の歴史的建築物・玉川上水の流れ)
     明大前   … 透明感のある素材をリズミカルに組み合わせる(街の賑やかさと移り変わり)
     下高井戸 … 温かな色彩の大庇を街へ向けて広げる(商店街との繋がり)
     桜上水   … 木質調など自然と調和する質感・柔らかな配色(静かな住宅街と共存)
     上北沢   … 落ち着いた色合いの素材+透明感のある素材(桜並木が映える)
     芦花公園 … 木質調の縦格子を並べて書架を表現(文学にゆかりのある街)
     千歳烏山 … 温かみのある配色+開放感のある粗目の格子(街との一体感)
   八幡山(1970年に高架化済み)・笹塚(既設高架)・仙川(地上)は発表の対象外なので、
   既存駅らしい片持ちの上屋とする。 */
const SV=MAT.stVC;
const fv=(v,s)=>(typeof v==='function')?v(s):v;
// 水平な面(o0<o1)。up=true で上向き
function hS(Sx,mat,s0,s1,o0,o1,yf,up,o){
  return Sx.loft(mat,s0,s1,s=>[[fv(o0,s),yf],[fv(o1,s),yf]],Object.assign({side:up?-1:1},o||{}));
}
// 鉛直な面(y0<y1)。side=+1 で +off 向き
function vS(Sx,mat,s0,s1,o,y0,y1,side,o2){
  return Sx.loft(mat,s0,s1,s=>[[fv(o,s),y0],[fv(o,s),y1]],Object.assign({side:side},o2||{}));
}
// 線路方向に通る角材(断面 off o±hw・高さ y0〜y1)
function bar(Sx,col,s0,s1,o,hw,y0,y1,o2){
  Sx.col(col).loft(SV,s0,s1,s=>{const c=fv(o,s);return [[c-hw,y0],[c+hw,y0],[c+hw,y1],[c-hw,y1]];},
    Object.assign({closed:true,caps:true},o2||{}));
}
// その s が井戸・エレベーターの近く(柱やベンチを置かない範囲)か
const nearAny=(s,list,m)=>list.some(q=>s>q.s0-m&&s<q.s1+m);

/* ホームの躯体。線路に面する縁は張出し(厚さ LIP)の下を RECESS だけ引っ込める
   (実物のホーム下の退避空間)。線路の無い縁(相対式の背面など)は垂直に落とす。
   wells の範囲は床を抜いて井戸にする(その区間は井戸の左右に分けて作る)。 */
function platBody(S,x0,x1,pc,hw,y,wells,sh){
  const SH=sh||[()=>0,()=>0], fL=SH[0], fR=SH[1];
  const mid=(x0+x1)/2, mg=S.mg, yb=y<3?Math.min(y-DECK_DROP,floorY(mid)):y-DECK_DROP, yt=y+STD.PLAT, yl=yt-STD.LIP;   // 地上・掘割の駅は躯体を地表(底)まで
  const tL=trackNear(mid,pc-hw-TACTILE_TOL/2,TACTILE_TOL/2);
  const tR=trackNear(mid,pc+hw+TACTILE_TOL/2,TACTILE_TOL/2);
  const cuts=[x0,x1];
  for(const w of wells) cuts.push(clamp(w.s0,x0,x1),clamp(w.s1,x0,x1));
  cuts.sort((a,b)=>a-b);
  for(let k=0;k<cuts.length-1;k++){
    const a=cuts[k], b=cuts[k+1]; if(b-a<0.01) continue;
    const m=(a+b)/2, w=wells.find(q=>m>q.s0&&m<q.s1);
    const spans=w?[[pc-hw,w.o0],[w.o1,pc+hw]]:[[pc-hw,pc+hw]];
    for(const sp of spans){
      const l0=sp[0], r0=sp[1], eL=(l0===pc-hw), eR=(r0===pc+hw);
      // 縁は面する線路に沿う(待避線がホームの端で曲がる駅。井戸の脇は中ほどなので曲がらない)
      const L=s=>l0+(eL?fL(s):0), R=s=>r0+(eR?fR(s):0);
      // 床版。C[i]=点iから点i+1までの面の色。上面の縁0.5mは明るい縁石
      const C=[0x8a8d92,eR?0xdcd9cf:0x9a9da2];
      if(eR) C.push(0xd8d5ca,0xbdbcb5); else C.push(0xbdbcb5);
      if(eL) C.push(0xd8d5ca);
      C.push(eL?0xdcd9cf:0x9a9da2);
      const prof=s=>{const l=L(s), r=R(s), P=[[l,yl],[r,yl]];
        if(eR) P.push([r,yt],[r-0.5,yt]); else P.push([r,yt]);
        if(eL) P.push([l+0.5,yt]);
        P.push([l,yt]); return P;};
      mg.loft(SV,a,b,prof,{closed:true,caps:true,cols:C,tag:'ホーム',step:1,tol:0.005});
      // 床版の下の躯体。線路側は引っ込める(張出しの下に影ができる)
      const iL=(eL&&tL)?STD.RECESS:0, iR=(eR&&tR)?STD.RECESS:0;
      const Q=s=>[[L(s)+iL,yb],[R(s)-iR,yb],[R(s)-iR,yl],[L(s)+iL,yl]];
      const QC=[0x777a80,(eR&&tR)?0x6c7075:(eR?0xb3b6ba:0x8d9095),0x777a80,(eL&&tL)?0x6c7075:(eL?0xb3b6ba:0x8d9095)];
      mg.loft(SV,a,b,Q,{closed:true,caps:true,cols:QC,step:1,tol:0.005});
    }
  }
}
/* 階段とエスカレーターの井戸。w.dir=+1 なら入口は s0 側で +s へ降りる/-1 なら入口は s1 側で
   -s へ降りる。奥は手すり壁で閉じる。幅の左55%が階段、残りがエスカレーター(下り)。
   床版の下に続く先は暗がりにする。 */
function stairWell(S,w,y){
  const mg=S.mg, md=S.md, yt=y+STD.PLAT, yb=y-DECK_DROP;
  const f=w.dir||1, e0=f>0?w.s0:w.s1, e1=f>0?w.s1:w.s0;      // 入口・奥
  const oS=w.o0+(w.o1-w.o0)*0.55;
  mg.col(0x23272c); hS(mg,SV,w.s0,w.s1,w.o0,w.o1,yb+0.02,true);           // 井戸の底
  const rise=0.165, run=0.30, N=Math.ceil((yt-yb)/rise);
  for(let k=0;k<N;k++){                                                   // 階段(段の塊を積む)
    const sA=e0+f*k*run, yB=Math.max(yb+0.04,yt-(k+1)*rise);
    mg.col(0x9b9994).box(SV,sA+f*run/2,(w.o0+oS)/2,yb,yB,run,oS-w.o0-0.02,{skip:'-y'});
    md.col(0xcdbd84).box(SV,sA+f*0.03,(w.o0+oS)/2,yB,yB+0.006,0.06,oS-w.o0-0.04,{skip:'-y'});   // 段鼻の滑り止め
  }
  // エスカレーター:乗り口の床板(金属)と、30°で下る踏み段の帯
  const sC=e0+f*0.7, dl=(yt-yb-0.04)/Math.tan(Math.PI/6), eo=(oS+w.o1)/2, ehw=(w.o1-oS)/2-0.06;
  mg.col(0xb4b8bd).box(SV,e0+f*0.35,eo,yt-0.04,yt,0.7,ehw*2,{skip:'-y'});
  mg.col(0x3a3e44).box(SV,sC+f*dl/2,eo,yt-0.06-dl*Math.tan(Math.PI/6)/2-0.03,yt-0.06-dl*Math.tan(Math.PI/6)/2+0.03,
    dl/Math.cos(Math.PI/6),ehw*2,{pitch:-f*Math.PI/6});
  for(const o of[oS+0.03,w.o1-0.03]){                                     // 欄干(ガラス)と手すり
    const A=mg.axes(sC,o), B=mg.axes(sC+f*dl,o);
    const p0=[A.f.x,yt,A.f.z], p1=[B.f.x,yb+0.04,B.f.z];
    mg.face(MAT.glass,[p0,p1,[p1[0],p1[1]+0.9,p1[2]],[p0[0],p0[1]+0.9,p0[2]]],A.n);
    md.col(0x1a1c1f).tube(SV,[p0[0],p0[1]+0.93,p0[2]],[p1[0],p1[1]+0.93,p1[2]],0.04,6);
  }
  // 囲い:長辺2面と奥の面にガラスの手すり壁(高さ1.1m)。下に金属の幅木、上に笠木
  const H=1.1;
  vS(mg,MAT.glass,w.s0,w.s1,w.o0,yt,yt+H,-1); vS(mg,MAT.glass,w.s0,w.s1,w.o1,yt,yt+H,1);
  {const A0=mg.axes(e1,w.o0), A1=mg.axes(e1,w.o1);
   mg.face(MAT.glass,[[A0.f.x,yt,A0.f.z],[A1.f.x,yt,A1.f.z],[A1.f.x,yt+H,A1.f.z],[A0.f.x,yt+H,A0.f.z]],v3sc(A0.t,f));}
  for(const o of[w.o0,w.o1]){
    bar(mg,0xc3c7cc,w.s0,w.s1,o,0.04,yt,yt+0.12,{tag:'階段の囲い'});
    bar(md,0xd4d8dc,w.s0,w.s1,o,0.035,yt+H,yt+H+0.05);
  }
  mg.col(0xc3c7cc).box(SV,e1,(w.o0+w.o1)/2,yt,yt+0.12,0.08,w.o1-w.o0,{skip:'-y'});
  md.col(0xd4d8dc).box(SV,e1,(w.o0+w.o1)/2,yt+H,yt+H+0.05,0.07,w.o1-w.o0,{skip:'-y'});
  for(let s=w.s0+1.5;s<w.s1-0.5;s+=1.5) for(const o of[w.o0,w.o1])          // 支柱
    md.col(0xc3c7cc).box(SV,s,o,yt,yt+H,0.05,0.05,{skip:'-y'});
  // 入口の案内:ホーム側=出口(黄)/階段側=番線案内(白)。少しホーム寄りに発車標
  stairGuide(md,w,e0-f*0.6,yt+2.25,yt+2.62);
  depBoards(md,w,e0-f*4.0,yt,w.yTop);
}
/* 地上駅(仙川)の上り階段:ホームから線路の上の橋上駅舎(床 yF)へ上がる。w の向きは stairWell と同じ
   (入口 e0 → 奥 e1)。奥の端で駅舎の床に着く。半分が階段(段の塊)、半分が上りエスカレーター。
   屋根と両側のガラスで囲う(入口側は水平、段の上は勾配なり) */
function stairUp(S,w,y,yF){
  const mg=S.mg, md=S.md, yt=y+STD.PLAT, f=w.dir||1, e0=f>0?w.s0:w.s1, e1=f>0?w.s1:w.s0;
  const oS=w.o0+(w.o1-w.o0)*0.55, run=0.30, N=Math.ceil((yF-yt)/0.165), r=(yF-yt)/N, sB=e1-f*N*run;
  for(let k=0;k<N;k++){
    const sA=sB+f*k*run, yA=yt+(k+1)*r;
    mg.col(0x9b9994).box(SV,sA+f*run/2,(w.o0+oS)/2,yt,yA,run,oS-w.o0-0.02,{skip:'-y'});
    md.col(0xcdbd84).box(SV,sA+f*0.03,(w.o0+oS)/2,yA,yA+0.006,0.06,oS-w.o0-0.04,{skip:'-y'});   // 段鼻の滑り止め
  }
  const dl=(yF-yt)/Math.tan(Math.PI/6), eo=(oS+w.o1)/2, ehw=(w.o1-oS)/2-0.06, ym=(yt+yF)/2-0.45;   // エスカレーター(トラス込み)
  mg.col(0x5a5f66).box(SV,e1-f*dl/2,eo,ym-0.5,ym+0.5,dl/Math.cos(Math.PI/6),ehw*2,{pitch:f*Math.PI/6});
  mg.col(0xb4b8bd).box(SV,e1-f*(dl+0.35),eo,yt,yt+0.04,0.7,ehw*2,{skip:'-y'});
  const H=2.6, P=(s,o,yy)=>{const q=frame(s,o);return [q.x,yy,q.z];}, A=mg.axes(e0,0);
  for(const o of[w.o0,w.o1]){                                             // 両側のガラス(入口側+勾配の部分)
    mg.face(MAT.glass,[P(e0,o,yt),P(sB,o,yt),P(sB,o,yt+H),P(e0,o,yt+H)],A.n);
    mg.face(MAT.glass,[P(sB,o,yt),P(e1,o,yF),P(e1,o,yF+H),P(sB,o,yt+H)],A.n);
    bar(md,0xc3c7cc,Math.min(e0,sB),Math.max(e0,sB),o,0.04,yt+H-0.06,yt+H+0.02);
  }
  for(const sd of[1,-1]){                                                  // 屋根(上面と下面)
    const y0=yt+H+(sd>0?0.12:0), y1=yF+H+(sd>0?0.12:0), a=w.o0-0.15, b=w.o1+0.15;
    mg.col(0xd5d8db).face(SV,[P(e0,a,y0),P(sB,a,y0),P(sB,b,y0),P(e0,b,y0)],[0,sd,0])
      .face(SV,[P(sB,a,y0),P(e1,a,y1),P(e1,b,y1),P(sB,b,y0)],[0,sd,0]);
  }
  stairGuide(md,w,e0-f*0.05,yt+2.05,yt+2.42);                              // 入口の案内:出口(黄)/番線案内(白)
  depBoards(md,w,e0-f*4.0,yt,w.yTop);
}
/* 橋上駅舎:線路の上を渡る駅舎。床の下端はレール面+7.6m(架線柱の頂部・ビームより上)。
   ガラスの帯の壁・屋根・柱(ホームの中心線と線路の外)。看板は南北の面に */
function concourse(S,st,s0,s1,o0,o1,y,yF,cols){
  const mg=S.mg, yB=yF-0.34, i=STA.indexOf(st), c=(o0+o1)/2, hw=(o1-o0)/2;           // 床の厚さ 0.34m
  mg.col(0xc9ccd0).cbox(SV,s0,s1,c,hw,yB,yF,{tag:'橋上駅舎'});                              // 床
  mg.col(0xe8e9e6).cbox(SV,s0,s1,c,hw+0.6,yF+3.3,yF+3.55,{tag:'橋上駅舎'});                // 屋根
  for(const o of[o0,o1]){
    mg.col(st.c).cbox(SV,s0,s1,o,0.12,yF,yF+0.9).col(0xdfe1e3).cbox(SV,s0,s1,o,0.12,yF+2.8,yF+3.3);
    vS(mg,MAT.glass,s0,s1,o,yF+0.9,yF+2.8,o>c?1:-1);
  }
  const P=(s,o,yy)=>{const q=frame(s,o);return [q.x,yy,q.z];};
  for(const s of[s0,s1]) mg.face(MAT.glass,[P(s,o0,yF),P(s,o1,yF),P(s,o1,yF+3.3),P(s,o0,yF+3.3)],mg.axes(s,0).t);
  for(const q of cols) for(const s of q.s) mg.col(0xd9dbdd).box(SV,s,q.o,q.y,yB,0.6,0.6,{skip:'-y',tag:'橋上駅舎の柱'});
  for(const sg of[-1,1]) signQuad(mg,3*i+2,(s0+s1)/2,sg>0?o1+0.13:o0-0.13,yF+2.85,yF+3.25,6.0,sg);
}
/* エレベーター:ガラスのかご路(2m角)・四隅の柱・上の機械箱(駅の色)・扉(ステンレス)。
   H=かご路の高さ(地上駅は橋上駅舎の床まで) */
function elevator(S,s,o,y,col,Hh){
  const mg=S.mg, yt=y+STD.PLAT, H=Hh||2.5;
  mg.box(MAT.glass,s,o,yt,yt+H,2.0,2.0,{skip:'-y+y',tag:'エレベーター'});
  for(const a of[-0.97,0.97])for(const b of[-0.97,0.97])
    mg.col(0xb9bec4).box(SV,s+a,o+b,yt,yt+H,0.08,0.08,{skip:'-y'});
  mg.col(col).box(SV,s,o,yt+H,yt+H+0.25,2.1,2.1);
  mg.col(0xc9cdd2).box(SV,s-1.02,o,yt,yt+2.1,0.04,1.05,{skip:'-y'});        // 扉(新宿方を向く)
  mg.col(0x5b6470).box(SV,s-1.03,o,yt+2.1,yt+2.3,0.03,1.2,{skip:'-y'});      // 扉の上の表示
  S.md.col(0x30353b).box(SV,s+0.1,o,yt,yt+2.3,1.6,1.6,{skip:'-y'});          // かご(ガラス越しに見える)
}
/* ホームの付帯物(ベンチ・自動販売機)。近くだけ描く。乗務員用のホームモニターは置かない
   (ホームドアの線区は車上の車内モニター式になる見込み。利用者指示で撤去) */
function benchAt(md,s,o,y,face){                 // face=+1/-1:座る人が向く off の向き
  const yt=y+STD.PLAT;
  md.col(0xa87c50).box(SV,s,o,yt+0.40,yt+0.46,1.8,0.44,{tag:'ベンチ'});
  md.col(0xa87c50).box(SV,s,o-face*0.24,yt+0.50,yt+0.88,1.8,0.05);
  for(const d of[-0.75,0.75]) md.col(0x6c737b).box(SV,s+d,o,yt,yt+0.40,0.06,0.40,{skip:'-y'});
}
/* 自動販売機(飲料)。機体はその色(赤・青・白)、前面は商品見本の窓・投入口・取出口を描いた光る面。
   以前は白い箱に赤/青の板だけで、ごみ箱と見分けにくかった(利用者の問い合わせ) */
function vendAt(md,s,o,y,face,k){
  const yt=y+STD.PLAT, c=[0xc8242b,0x2a5caa,0xe8e8e8][k%3];
  md.col(c).box(SV,s,o,yt,yt+1.83,0.98,0.72,{skip:'-y',tag:'自動販売機'});
  md.col(0x2b3036).box(SV,s,o,yt+1.83,yt+1.86,1.0,0.74,{skip:'-y'});
  pidsQuad(md,pidsVend(k%3),s,o+face*0.366,yt+0.04,yt+1.80,0.94,face,true);
}

/* ---- 屋根 ---- */
/* 大屋根の形(駅ごと)。断面を「上面」「天井」の折れ線(-E→+E、高さはレール面基準)で持つ。
   既定は平らな屋根(中央が少し盛り上がる)。上北沢は公表パースのとおり軒を下げて屋根面を
   見せる(ガラスのスクリーンの上に立ハゼの屋根)。線路の上では天井をレール面+7.05m以上に
   保つ(パンタグラフ・架線より上。⑪が確かめる)。 */
const ROOF_DEF={
  top:E=>[[-E,STD.ROOF],[0,STD.ROOF+STD.CROWN],[E,STD.ROOF]],
  ceil:E=>[[-E,STD.CEIL],[E,STD.CEIL]],
  beam:E=>E-0.25, fas:[STD.FAS0,STD.FAS1],
};
const ROOF_OF={};   // 駅ごとの屋根の形(既定以外)。品川版は無し
// 鼻隠し・屋根の色(公表パース)。屋根の上面は立ハゼ
const FAC_ROOF={'北品川':0x4a4f55};   // 鼻隠し:濃い灰(北品川の決定デザインのパース)
// 折れ線 poly 上の off における高さ
function polyAt(poly,o){
  if(o<=poly[0][0]) return poly[0][1];
  for(let i=1;i<poly.length;i++){
    const a=poly[i-1],b=poly[i];
    if(o<=b[0]) return a[1]+(b[1]-a[1])*(o-a[0])/Math.max(1e-9,b[0]-a[0]);
  }
  return poly[poly.length-1][1];
}
// 大屋根(ホーム階全体を覆う)。梁は柱の位置と架線柱の位置に入れる。
// 屋根の下には架線柱を建てない(5章)ので、架線はこの梁から吊る(吊り材を線路ごとに下ろす)
function bigRoof(S,st,y,colLines){
  const mg=S.mg, md=S.md, c0=st.x, RL=staRoofHalf(st), R0=c0-RL, R1=c0+RL, R=ROOF_OF[st.n]||ROOF_DEF;
  const E=s=>deckHalf(s)+0.38;
  const lift=(p)=>p.map(q=>[q[0],y+q[1]]);
  // 天井(下向き)と上面(上向き・立ハゼ)
  const ce=R.ceil(E(c0));
  for(let i=0;i<ce.length-1;i++)
    mg.col(0xe9e9e5).loft(SV,R0,R1,s=>{const p=lift(R.ceil(E(s)));return [p[i],p[i+1]];},{side:1,tag:'大屋根'});
  const tp=R.top(E(c0));
  for(let i=0;i<tp.length-1;i++)
    mg.col(0xb3b9bf).loft(MAT_SEAM,R0,R1,s=>{const p=lift(R.top(E(s)));return [p[i],p[i+1]];},
      {side:-1,uv:(s,p)=>[s/0.5,p[0]/4]});
  for(const sg of[-1,1])                                                         // 鼻隠し
    mg.col(FAC_ROOF[st.n]||st.c).loft(SV,R0,R1,s=>{const o=sg*E(s),i=sg*(E(s)-0.2);
      return [[i,y+R.fas[0]],[o,y+R.fas[0]],[o,y+R.fas[1]],[i,y+R.fas[1]]];},{closed:true,caps:true});
  for(const s of[R0,R1]){                                                        // 妻側の屋根の厚み
    const e=E(s), A=mg.axes(s,0), f=s<c0?-1:1, cp=R.ceil(e), tq=R.top(e);
    const offs=[...new Set(cp.map(q=>q[0]).concat(tq.map(q=>q[0])))].sort((p,q)=>p-q);
    const P=(o,yy)=>{const q=frame(s,o);return [q.x,yy,q.z];};
    for(let i=0;i<offs.length-1;i++){
      const a=offs[i], b=offs[i+1];
      mg.col(0xc9ccd0).face(SV,[P(a,y+polyAt(cp,a)),P(b,y+polyAt(cp,b)),P(b,y+polyAt(tq,b)),P(a,y+polyAt(tq,a))],v3sc(A.t,f));
    }
  }
  // 梁(柱の位置と架線柱の位置)。下面は天井より下に見える
  const poles=POLE_S.filter(p=>p>R0+1&&p<R1-1);
  for(const s of colLines.concat(poles)){
    const e=R.beam(E(s));
    mg.col(0xd5d8db).box(SV,s,0,y+STD.BEAM,y+STD.CEIL,0.32,e*2,{skip:'+y',tag:'屋根の梁'});
  }
  // 架線は架線柱の位置の梁から可動ブラケットで吊る(6b章 buildCatenary)
  // 天窓(ホームの上。空が映るガラスの帯)
  for(const p of pltOf(st)){
    const a=c0-(RL-16), b=c0+(RL-16), o0=p[0]-1.0, o1=p[0]+1.0;
    const yr=s=>o=>y+polyAt(R.top(E(s)),o);
    mg.loft(MAT.glass,a,b,s=>[[o0,yr(s)(o0)+0.12],[o1,yr(s)(o1)+0.12]],{side:-1});
    for(const o of[o0,o1]) bar(mg,0x7b828a,a,b,o,0.06,yr(c0)(o)-0.05,yr(c0)(o)+0.16);
  }
}
// 片持ちの上屋(既存駅)。ホームの中心線の柱で受ける
function canopy(S,x0,x1,pc,hw,y,col){
  const mg=S.mg, w=hw+0.35, yc=y+STD.CAN0, yr=y+STD.CAN1;
  mg.col(0xdedfda); hS(mg,SV,x0,x1,pc-w,pc+w,yc,false,{tag:'上屋'});
  mg.col(0x8d949b).loft(SV,x0,x1,()=>[[pc-w,yr-0.08],[pc,yr+0.12],[pc+w,yr-0.08]],{side:-1});
  for(const sg of[-1,1])
    mg.col(col).loft(SV,x0,x1,()=>{const o=pc+sg*w;return [[o-sg*0.14,yc-0.1],[o,yc-0.1],[o,yr],[o-sg*0.14,yr]];},{closed:true,caps:true});
  for(const s of[x0,x1]){
    const A=mg.axes(s,pc), P=(o,yy)=>{const f=frame(s,o);return [f.x,yy,f.z];};
    mg.col(0xc9ccd0).face(SV,[P(pc-w,yc),P(pc+w,yc),P(pc+w,yr-0.08),P(pc,yr+0.12),P(pc-w,yr-0.08)],v3sc(A.t,s<(x0+x1)/2?-1:1));
  }
}

/* ---- 側面の外装(公表パース 2019.5.30)。sg=+1:北面/-1:南面 ---------------------
   外装の外面は桁端から d=0.15m 外。範囲は大屋根と同じ。下端は床版の上面(レール面-0.6m)で、
   その下の高架の側面(桁)も駅ごとの色・材で覆う(パースでは桁の色が駅ごとに違う)。
   形の大きいもの(帯・格子・縦材)は mg、細い方立などは md(近くだけ)。
   不透明の板は厚みのある箱で作る(片面の板だとホームの内側から見て消える)。 */
const FD=0.15, FAC_Y0=-0.6;
const WEAVE=[];                 // 千歳烏山の格子の交点(横・縦の帯の off)。検証用
const fO=(sg,d)=>s=>sg*(deckHalf(s)+d);
function fBand(Sx,mat,col,s0,s1,sg,d,th,y0,y1,o){        // 厚さ th の板(外面が d)
  if(col!==null) Sx.col(col);
  Sx.loft(mat,s0,s1,s=>{const o2=sg*(deckHalf(s)+d);return [[o2-sg*th,y0],[o2,y0],[o2,y1],[o2-sg*th,y1]];},
    Object.assign({closed:true,caps:true},o||{}));
}
function fRail(Sx,col,s0,s1,sg,d,dep,y0,y1,tag){        // 外装に沿って通る横材(曲線に追従)
  fBand(Sx,SV,col,s0,s1,sg,d+dep,dep,y0,y1,{tag:tag});
}
function fGlass(Sx,s0,s1,sg,d,y0,y1,tag){ vS(Sx,MAT.glass,s0,s1,fO(sg,d),y0,y1,sg,{tag:tag}); }
function fFin(Sx,col,sx,sg,d,w,dep,y0,y1,tag){            // 外装の面から外へ dep 張り出す縦材
  Sx.col(col).box(SV,sx,sg*(deckHalf(sx)+d+dep/2),y0,y1,w,dep,{skip:'-y',tag:tag});
}
const uvW=(su,sv)=>(s,p)=>[s/su,p[1]/sv];                  // 鉛直な面の模様の UV
const FAC={
  /* 北品川(令和8年6月決定の駅舎デザイン。東京都建設局のページのパース「海側・山側」):ホーム階は濃い灰の金属の枠。
     腰(ホーム面〜+2.3m)に縦ルーバーの帯を2段、その上はガラス(方立 1.5m)。木の縦板(幅1.2m)を約9m ごと。
     両端の 10m はガラスの箱で、中ほどに青海波のパネル。高架の側面は明るい灰。寸法はパースからの読み取り(推定) */
  '北品川':function(S,st,sg,y){
    const RL=staRoofHalf(st), a=st.x-RL+1, b=st.x+RL-1, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0, yL=y+2.3, BOX=10;
    const DK=0x45494e, FR=0x5a5f65;
    fBand(S.mg,SV,0xc4c7ca,a,b,sg,FD,0.2,yg,y0,{tag:'外装:高架の側面'});
    fBand(S.mg,SV,DK,a+BOX,b-BOX,sg,FD,0.2,y0,y0+0.25,{tag:'外装:腰の枠'});
    fGlass(S.mg,a,b,sg,FD-0.06,y0+0.25,y1,'外装:ガラス');
    for(let s=a+BOX;s<b-BOX;s+=0.25) fFin(S.md,0x3d4146,s,sg,FD,0.05,0.12,y0+0.3,yL,'外装:縦ルーバー');   // 縦ルーバーの帯(近くだけ)
    fBand(S.mg,SV,0x3d4146,a+BOX,b-BOX,sg,FD-0.12,0.06,y0+0.3,yL,{tag:'外装:縦ルーバー'});                  // 遠くから見た帯の地
    for(const yy of[y0+0.3+(yL-y0-0.3)/2,yL]) fRail(S.mg,FR,a+BOX,b-BOX,sg,FD,0.10,yy-0.06,yy+0.06,'外装:枠');
    for(let s=a;s<=b+0.01;s+=1.5) fFin(S.mg,FR,s,sg,FD,0.08,0.16,yL,y1,'外装:方立');
    for(let s=a+BOX+4;s<b-BOX-1;s+=9) fBand(S.mg,SV,0x9c7a58,s,s+1.2,sg,FD+0.05,0.08,y0+0.3,y1-0.2,{tag:'外装:木の縦板'});
    for(const [e0,e1] of[[a,a+BOX],[b-BOX,b]]){                                 // 端のガラスの箱と青海波のパネル
      const m=(e0+e1)/2;
      fBand(S.mg,MAT_SEIGAIHA,0xffffff,m-1.4,m+1.4,sg,FD+0.04,0.05,y0+0.4,y1-0.3,{uv:uvW(0.6,0.6),tag:'外装:青海波'});
      fRail(S.mg,FR,e0,e1,sg,FD,0.12,y0+0.2,y0+0.4,'外装:枠');
    }
    fRail(S.mg,DK,a,b,sg,FD,0.14,y1-0.3,y1,'外装:枠');
  },
  /* 既定(北品川以外の新設の大屋根の駅。品川版には無い):桁の側面は明るい灰、ホーム階はガラスの帯に白い縦ルーバー */
  default:function(S,st,sg,y){
    const RL=staRoofHalf(st), a=st.x-RL+1, b=st.x+RL-1, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0;
    fBand(S.mg,SV,0xc9ccd0,a,b,sg,FD,0.2,yg,y0,{tag:'外装:高架の側面'});
    fBand(S.mg,SV,0xe4e6e8,a,b,sg,FD,0.2,y0,y+1.2,{tag:'外装:腰壁'});
    fGlass(S.mg,a,b,sg,FD-0.06,y+1.2,y1,'外装:ガラス');
    for(let s=a;s<=b+0.01;s+=1.2) fFin(S.md,0xf2f3f4,s,sg,FD,0.08,0.30,y+1.2,y1,'外装:縦ルーバー');
    fRail(S.mg,0xd8183a,a,b,sg,FD,0.08,y1-0.25,y1-0.05,'外装:赤の帯');
  },
};

/* ---- 高架下の駅舎(公表パース) -------------------------------------------
   桁下の駅舎。長辺の中央に入口(暗い奥・ガラス・看板)。左右の壁と庇は駅ごと(BLDG_FAC)。
   seg=[[s0,s1,入口側の端(+1=s1/-1=s0)],...] */
const BLDG_FAC={
  /* 北品川(決定デザインのパース):濃い灰の壁(横の羽目板)に木の縦板とガラスの窓、上に瓦の庇(旧東海道の意匠)。推定の寸法 */
  '北品川':function(mg,md,st,sg,seg,hb){
    for(const [s0,s1,ent] of seg){
      fBand(mg,SV,0x4b4f54,s0,s1,sg,-1.0+0.05,0.05,0,hb-0.3,{tag:'駅舎:濃い灰の壁'});
      for(let s=s0+1.5;s<s1-2;s+=5.5){ fGlass(mg,s,s+2.6,sg,-1.0+0.10,0.3,3.0);
        fBand(mg,SV,0xa9794c,s+2.8,s+3.8,sg,-1.0+0.10,0.05,0.2,3.2,{tag:'駅舎:木の縦板'}); }
    }
    // 瓦の庇:駅舎の長さいっぱい、高さ 3.6〜4.2m・出 1.6m。上面は瓦の色、軒先は濃い灰
    const a=Math.min(...seg.map(q=>q[0])), b=Math.max(...seg.map(q=>q[1]));
    mg.loft(SV,a,b,s=>{const i=sg*(deckHalf(s)-1.0), o=sg*(deckHalf(s)+0.6);
      return [[i,4.2],[o,3.6],[o,3.48],[i,4.05]];},{closed:true,caps:true,cols:[0x3a3e44,0x2f3236,0x55595e,0x55595e],tag:'駅舎:瓦の庇'});
    return {canopyCol:0x3a3e44};
  },
};
function bldg(S,st,y){
  // c0=駅舎の中ほど(入口・看板・庇の位置)。範囲は bldgSpan(下高井戸は駅の西端部)
  const SP=bldgSpan(st), a=SP[0], b=SP[1], c0=(a+b)/2;
  const mg=S.mg, md=S.md, H=(b-a)/2, hb=y-GIRDER-0.05, E=deckHalf(c0)-1.0, F=BLDG_FAC[st.n];
  mg.col(0xe9e7e2).cbox(SV,a,b,0,E,0,hb,{tag:'駅舎'});
  // 妻側(線路方向の端):窓の帯と通用口
  for(const [s,f] of[[a,-1],[b,1]]){
    const A=mg.axes(s,0), P=(o,yy)=>{const q=frame(s+f*0.03,o);return [q.x,yy,q.z];};
    mg.col(0x3a4148).face(SV,[P(-E+1.5,2.9),P(E-1.5,2.9),P(E-1.5,4.7),P(-E+1.5,4.7)],v3sc(A.t,f));
    mg.col(0x8c939b).face(SV,[P(-0.6,0),P(0.6,0),P(0.6,2.2),P(-0.6,2.2)],v3sc(A.t,f));
    for(let o=-E+1.5;o<=E-1.5+0.01;o+=1.8)
      md.col(0xbfc4c9).box(SV,s+f*0.05,o,2.9,4.7,0.06,0.07,{skip:'-y'});
  }
  for(const sg of[-1,1]){
    // 入口:暗い奥+ガラス+枠、上に看板
    mg.col(0x2b3036); vS(mg,SV,c0-6,c0+6,fO(sg,-1.0+0.02),0,3.3,sg);
    fGlass(mg,c0-6,c0+6,sg,-1.0+0.06,0,3.3);
    for(let s=c0-6;s<=c0+6.01;s+=1.5) md.col(0xbfc4c9).box(SV,s,sg*(E+0.07),0,3.3,0.06,0.08,{skip:'-y'});
    signQuad(mg,3*STA.indexOf(st)+2,c0,sg*(E+0.04),3.95,5.15,4.8,sg);
    // 左右の壁(駅ごと)。庇も駅ごと(無ければ既定の箱の庇)
    const r=F?F(mg,md,st,sg,[[a,c0-6.3,1],[c0+6.3,b,-1]],hb):null;
    if(!r||!r.noCanopy)
      mg.col((r&&r.canopyCol)||st.c).box(SV,c0,sg*(E+0.9),3.45,3.7,14,1.8,{tag:'駅舎の庇'});
  }

}

/* ---- 駅を組み立てる ---- */
const STAIRS=[];                     // 階段・エレベーターの登録簿(検証用)
for(const s of STA){
  const y=railY(s.x),c0=s.x, i=STA.indexOf(s), S=STG[i];
  CUR=s.kk?KOUKU[s.kk-1].VGs:null;
  // 点字ブロックは「線路のある縁」だけに敷く。笹塚の内側は上の留置線を敷いてから判定する
  // (先に判定すると留置線がまだ TRACKS に無く、内側の縁に敷かれない)。
  const pr=platRange(s), x0=pr[0], x1=pr[1], pm=(x0+x1)/2, big=BIGROOF(s);
  const lampY=big?y+STD.RAIL0-0.06:y+STD.CAN0-0.08;
  const lifts=[];                    // 井戸とエレベーター(柱・ベンチを避ける)
  /* 地上駅は橋上駅舎へ上がる。yF=その床の上面:地上の駅は架線柱・ビームより上(レール面+7.6m が床の下端)、
     掘割の駅(仙川)はほぼ地表の高さ(床の下端=道床+CONC_CUT。下の架線柱は poleOffDecks が外へずらす)。
     駅舎と階段は pq(ホームの中ほど+CONC_AT)を中心に置く */
  const up=STA_UP(s), cutSta=floorY(c0)<-1, yF=cutSta?y+CONC_CUT+0.34:y+RAIL_TOP+7.6+0.34, pq=up?concMid(s):pm;
  const TRK_ST=staTracks(s,pm);                     // 番線(南から1,2,…)。階段口の案内と発車標が使う
  pltOf(s).forEach(function(pp,pi){
    const pc=pp[0], hw=pp[1];
    // 相対式は背面(線路の無い側)。地上駅(仙川)の単式ホームも背面に寄せる
    const back=(s.t==='side'||(up&&hw<2.0))?Math.sign(pc):0;
    const narrow=hw<2.0;                                     // 狭いホーム(仙川の単式)は階段1か所
    /* 階段・エスカレーターの井戸の幅(2026-10-13 利用者指示:ホームの幅に合わせて):島式は両脇に 1.6m ずつ、相対式は背面 0.35m・
       線路の側に 2.0m を残した幅(1.9〜3.6m)。以前は半幅の段で 1.9/2.2/2.4/2.8m */
    const ww=clamp(back?2*hw-0.35-2.0:2*hw-3.2,1.9,3.6), wc=pc+back*(hw-ww/2-0.35);
    // 階段は1面に2か所(利用者指示)。両側の入口から中ほど(駅舎)へ向かう。
    // 高架駅は高架下の駅舎へ降り、地上駅(仙川)は線路の上の橋上駅舎へ上がる(利用者指示)
    const SA=STAIR_AT[s.n];                                   // 駅舎が中心に無い駅(下高井戸=西端部)は置き直す
    const wells=narrow?(up?[{s0:pq-34,s1:pq-18,o0:wc-ww/2,o1:wc+ww/2,dir:1}]:[]):
                SA?SA.wells.map(q=>({s0:pm+Math.min(q[0],q[1]),s1:pm+Math.max(q[0],q[1]),o0:wc-ww/2,o1:wc+ww/2,dir:q[2]})):
                       [{s0:pq-34,s1:pq-18,o0:wc-ww/2,o1:wc+ww/2,dir:1},{s0:pq+18,s1:pq+34,o0:wc-ww/2,o1:wc+ww/2,dir:-1}];
    for(const w of wells) Object.assign(w,{st:s,pc:pc,hw:hw,trk:TRK_ST.filter(q=>q.plats.indexOf(pi)>=0),
      yTop:big?y+STD.CEIL:y+STD.CAN0});
    const sh=[edgeShift(s,pc-hw,-1),edgeShift(s,pc+hw,1)];   // 縁が面する線路に沿うずれ
    // その s のホームの中心(待避線の側の縁が曲がって狭くなる所では中心も寄る)。中心の線に置く物(柱・吊りレール・照明・駅名標・ベンチ)が使う
    const pcs=q=>pc+(sh[0](q)+sh[1](q))/2;
    platBody(S,x0,x1,pc,hw,y,up?[]:wells,sh);
    platDetail(S,x0,x1,pc,hw,y,{lampY:lampY},sh);
    for(const w of wells){(up?stairUp(S,w,y,yF):stairWell(S,w,y));lifts.push(w);STAIRS.push({st:s,kind:'階段',up:up,dir:w.dir,s0:w.s0,s1:w.s1,o0:w.o0,o1:w.o1,yF:up?yF:null});}
    if(!narrow){                                     // エレベーターは2つの階段の間(柱と柱の間)
      const es=SA?pm+SA.ev:pq+STD.COLP/2;
      elevator(S,es,wc,y,s.c,up?yF-(y+STD.PLAT):0);
      lifts.push({s0:es-1,s1:es+1});
      STAIRS.push({st:s,kind:'エレベーター',s0:es-1,s1:es+1,o0:wc-1,o1:wc+1});
    }
    // 柱:大屋根は樹状柱(2本の枝で梁を受ける)、上屋は中心線の柱
    const colO0=back?pc+back*(hw-0.9):pc;
    for(let k=-9;k<=9;k++){
      const cs=pm+k*STD.COLP;
      if(cs<x0+3||cs>x1-3||nearAny(cs,lifts,1.4)) continue;
      const top=big?y+STD.BEAM:y+STD.CAN0, colO=colO0+pcs(cs)-pc;
      S.mg.col(0xe4e6e8).cyl(SV,cs,colO,y+STD.PLAT,top-(big?1.4:0),big?0.2:0.16,10,{tag:'ホームの柱'});
      if(big){
        const A=S.mg.axes(cs,colO), yb2=top-1.4;
        for(const d of[-2.2,2.2]){
          const B=S.mg.axes(cs+d,colO);
          S.mg.col(0xe4e6e8).tube(SV,[A.f.x,yb2-0.05,A.f.z],[B.f.x,top,B.f.z],0.11,6);
        }
        S.mg.col(0xe4e6e8).cyl(SV,cs,colO,yb2-0.2,yb2+0.05,0.26,10);
      }else{
        S.mg.col(0xd5d8db).box(SV,cs,pcs(cs),y+STD.CAN0-0.35,y+STD.CAN0,0.3,hw*2+0.5,{skip:'+y'});   // 上屋の梁
      }
      S.md.col(0xb9bec4).box(SV,cs,colO,y+STD.PLAT,y+STD.PLAT+0.04,0.55,0.55,{skip:'-y'});     // 柱脚
    }
    // 吊りレール(大屋根)/上屋の下に、駅名標と照明
    const ry0=big?y+STD.RAIL0:y+STD.CAN0-0.2, ry1=big?y+STD.RAIL1:y+STD.CAN0;
    if(big){
      bar(S.mg,0x9aa1a8,x0+4,x1-4,pcs,0.15,ry0,ry1,{tag:'吊りレール'});
      for(let r=x0+5;r<x1-4;r+=5.25){const A=S.md.axes(r,pcs(r));
        S.md.col(0x9aa1a8).tube(SV,[A.f.x,ry1,A.f.z],[A.f.x,y+STD.CEIL,A.f.z],0.025,4);}
    }
    S.md.col(0xf6f5ee); hS(S.md,SV,x0+5,x1-5,q=>pcs(q)-0.09,q=>pcs(q)+0.09,ry0-0.02,false);   // 照明の帯
    for(const d of[-75,-45,0,45,75]){                // 駅名標(階段・EVの上を避ける)
      const ss=pm+d; if(nearAny(ss,lifts,1.5)) continue;
      for(const f of[1,-1]) signQuad(S.mg,3*i+(f>0?0:1),ss,pcs(ss)+f*0.035,ry0-0.55,ry0-0.1,1.6,f);
      S.mg.col(0x3a4048).box(SV,ss,pcs(ss),ry0-0.57,ry0-0.08,1.66,0.06);
      S.md.col(0x5b6470).box(SV,ss,pcs(ss),ry0-0.08,ry0,0.04,0.04);
    }
    // ベンチ・自動販売機(近くだけ)
    for(let k=-9;k<=8;k+=2){
      const bs=pm+(k+0.5)*STD.COLP; if(bs<x0+6||bs>x1-6||nearAny(bs,lifts,2.5)) continue;
      if(back) benchAt(S.md,bs,pc+back*(hw-0.5),y,-back);
      else if(hw>=2.4){ benchAt(S.md,bs,pcs(bs)+0.32,y,1); benchAt(S.md,bs,pcs(bs)-0.32,y,-1); }
    }
    if(!narrow){
      for(let k=0;k<2;k++){                          // 自動販売機は柱と柱の間(EVの反対側)
        const vs=pq-8.4+k*1.0;
        if(back) vendAt(S.md,vs,pc+back*(hw-0.42),y,-back,k);
        else {vendAt(S.md,vs,pc+0.38,y,1,k); vendAt(S.md,vs,pc-0.38,y,-1,k+1);}
      }
    }
    if(!big){                                        // 上屋。上り階段の上は階段の屋根に任せて切る
      let a=x0+(s.t==='ctx'?1:2); const e=x1-(s.t==='ctx'?1:2);
      for(const w of(up?wells.slice().sort((p,q)=>p.s0-q.s0):[])){ if(w.s0-a>1) canopy(S,a,w.s0,pc,hw,y,0x9aa0a6); a=w.s1; }
      if(e-a>1) canopy(S,a,e,pc,hw,y,0x9aa0a6);
    }
  });
  if(up){                                            // 橋上駅舎(仙川):ホームの中ほどで線路をまたぐ
    const ps=pltOf(s);
    // 掘割の駅は掘割の両側の地表へ 3m ずつ出る(擁壁の上に載る。柱はホームの上だけ)
    /* 品川(2面4線=quad):副本線がホームの外側にあるので、駅舎は構造物の幅いっぱい(±(deckHalf+0.6))にし、外側の柱は構造物の外、
       中の柱は線路の間ではなく島式ホームの中心に立てる(京王版の式=ホームの外縁+0.6 だと副本線の上に柱が立つ) */
    const quad=(s.t==='quad');
    const o0=cutSta?-(cutHalf(pq,-1)+3.0):quad?-(deckHalf(pq)+0.6):Math.min(...ps.map(q=>q[0]-q[1]))-4.4,
          o1=cutSta?cutHalf(pq,1)+3.0:quad?deckHalf(pq)+0.6:Math.max(...ps.map(q=>q[0]+q[1]))+0.6;
    const cols=quad?ps.map(q=>({s:[pq-STD.COLP,pq+STD.COLP],o:q[0],y:y+STD.PLAT})):[{s:[pq-STD.COLP,pq+STD.COLP],o:0,y:y+STD.PLAT}];
    if(!cutSta) cols.push({s:[pq-14,pq,pq+14],o:quad?o0+0.3:o0+0.6,y:0},{s:[pq-14,pq,pq+14],o:quad?o1-0.3:o1-0.4,y:0});
    CONC_EXT[s.n]={pq:pq,o0:o0,o1:o1,yF:yF};
    concourse(S,s,pq-CONC_HALF,pq+CONC_HALF,o0,o1,y,yF,cols);
    if(cutSta) for(const sg of[-1,1]){                // 掘割の外(地表の上)の部分は床の下を基壇で埋める
      const a=cutHalf(pq,sg)+CUT_W.OUT, b=sg>0?o1:-o0;
      S.mg.col(0xb9bcbf).cbox(SV,pq-CONC_HALF,pq+CONC_HALF,sg*(a+b)/2,(b-a)/2,-0.05,yF-0.34,{noBottom:true});
    }
  }
  PSD_DEF.push({st:s,y:y,drs:DRS_OF[s.t],x0:x0+2,x1:x1-2});
  if(big){
    // 大屋根の梁は柱の列にも入れる(柱の位置は全ホームで同じ s に揃えている)
    const cl=[]; for(let k=-9;k<=9;k++){const cs=pm+k*STD.COLP; if(cs>x0+3&&cs<x1-3) cl.push(cs);}
    bigRoof(S,s,y,cl);
    for(const sg of[-1,1]) (FAC[s.n]||FAC.default)(S,s,sg,y);
  }
  if(STA_BLDG(s)) bldg(S,s,y);
  CUR=null;
  const sp=textSprite(s.n,s.cfg,true);
  sp.scale.set(105,36,1);   // 駅名ラベル(小型化)
  const p=frame(c0,0);sp.position.set(p.x,railY(c0)+38,p.z);
  staLabels.push(sp);
}

/* ---- 品川の東西自由通路(延伸)と西口駅前広場デッキ(計画。v1 から移植・推定) --------------------------------
   京急の橋上駅舎(上の concourse。床はレール面+7.6m の上=架線より上)と同じ床の高さで、
   ・東:JR 品川駅の人工地盤(国土地理院の線路上空の建物)の西の縁まで通路を延ばす
   ・西:国道15号の東の縁まで通路を延ばし、国道15号の上に西口駅前広場のデッキ(s=駅の中心−10〜+170・v1 と同じ範囲)を架ける
     デッキの幅は国道15号の実際の道路の面(国土地理院。幹線)から求める(東の縁+1m 〜 西の縁−3m)
   形・位置・高さはどれも推定(国土交通省 東京国道事務所の「品川駅西口基盤整備」の資料で直す箇所。CLAUDE.md の表) */
const SG_DECK=[];                                   // 登録簿 {kind,s0,s1,o0,o1,y0,y1}(検証用)
{
  const st=STA_SG, S=STG[STA.indexOf(st)], c0=st.x, y=railY(c0), yF=y+RAIL_TOP+7.6+0.34, yB=yF-0.34, pq=concMid(st);
  const a=pq-CONC_HALF, b=pq+CONC_HALF, ps=pltOf(st);
  const CE=CONC_EXT[st.n], oW=CE.o0, oE=CE.o1;          // 橋上駅舎の西端・東端(7章の登録簿)
  const major=(x,z)=>{const l=PLR_GRID.get(Math.floor(x/PLR_CELL)+','+Math.floor(z/PLR_CELL));
    return !!l&&l.some(R=>R.k===1&&x>R.bb[0]&&x<R.bb[1]&&z>R.bb[2]&&z<R.bb[3]&&polyDist(R.P,x,z)<0);};
  // 国道15号の道路の面の東の縁・西の縁(線路の西。中央分離帯などの切れ目は 8m まで続きとみなす。交わる道路を拾わないよう幅は 40m まで)
  const r15=s=>{let e=null,w=null;
    for(let o=-15;o>=-140;o-=1){const f=frame(s,o); if(major(f.x,f.z)){ if(e===null) e=o; if(o<e-40) break; w=o; } else if(e!==null&&o<w-8) break;}
    return e===null?null:{e:e,w:w};};
  const R0=r15(pq), oR=R0?R0.e+1:-32;                 // 通路の西端=国道15号の東の縁の 1m 手前(歩道の上)
  const glassEnds=(s0,s1,o0,o1,tag)=>{               // 通路の床・屋根・両側(s の端)のガラスの壁
    S.mg.col(0xc9ccd0).cbox(SV,s0,s1,(o0+o1)/2,(o1-o0)/2,yB,yF,{tag:tag});
    S.mg.col(0xe8e9e6).cbox(SV,s0,s1,(o0+o1)/2,(o1-o0)/2+0.6,yF+3.3,yF+3.55,{tag:tag});
    for(const q of[s0,s1]) S.mg.cbox(MAT.glass,q-0.05,q+0.05,(o0+o1)/2,(o1-o0)/2,yF,yF+3.3);
    SG_DECK.push({kind:tag,s0:s0,s1:s1,o0:o0,o1:o1,y0:yB,y1:yF+3.55,
      inside:(s,o,r)=>s>s0-r&&s<s1+r&&o>Math.min(o0,o1)-r&&o<Math.max(o0,o1)+r});
  };
  // 東:JR の人工地盤の西の縁(線路上空の建物のうち駅に重なるもの)まで。無ければ +26m
  let oJ=26;
  if(GSR) for(const [R] of GSR.decks){ const q=R.map(p=>prjXY(p[0],p[1]));
    if(q.some(v=>v.s>a&&v.s<b)&&q.some(v=>v.off>oE)) oJ=Math.max(oE+4,Math.min(oJ,Math.min(...q.filter(v=>v.off>oE).map(v=>v.off))+4)); }
  glassEnds(a,b,oE,oJ,'東西自由通路(延伸・東)');
  glassEnds(a,b,oR,oW,'東西自由通路(延伸・西)');
  for(const q of[a+4,b-4]) for(const o of[(oE+oJ)/2,(oR+oW)/2]){            // 通路の柱(地面から床まで)
    const f=frame(q,o), g=terH(f.x,f.z); S.mg.col(0xd9dbdd).box(SV,q,o,g,yB,0.6,0.6,{skip:'-y',tag:'自由通路の柱'}); }
  // 西口駅前広場のデッキ(国道15号の上)
  const d0=c0-10, d1=c0+170, W=s=>{const r=r15(s)||R0||{e:-31,w:-63}; return {e:Math.max(r.e+1,oR),w:r.w-3};};
  const SM=[]; for(let q=d0;q<=d1+1e-6;q+=10) SM.push([q,W(q)]);       // 10m ごとの幅(ロフトの中は線形)
  const Wa=s=>{const i=clamp(Math.floor((s-d0)/10),0,SM.length-2), t=clamp((s-SM[i][0])/10,0,1);
    return {e:SM[i][1].e+(SM[i+1][1].e-SM[i][1].e)*t, w:SM[i][1].w+(SM[i+1][1].w-SM[i][1].w)*t};};
  S.mg.col(0xd3d0c8).loft(SV,d0,d1,s=>{const r=Wa(s);return [[r.w,yB],[r.e,yB],[r.e,yF],[r.w,yF]];},{closed:true,caps:true,tag:'西口駅前広場デッキ'});
  for(const sg of[0,1]) S.md.loft(MAT.glass,d0,d1,s=>{const o=sg?Wa(s).e:Wa(s).w;return [[o,yF],[o,yF+1.1]];},{side:sg?1:-1});   // ガラスの手すり
  for(let q=d0+8;q<d1-4;q+=22){ const r=Wa(q);                                    // 植栽(緑の枡)
    for(const f of[0.3,0.7]) S.mg.col(0x6f9160).box(SV,q,r.w+(r.e-r.w)*f,yF,yF+1.0,6,3,{skip:'-y'}); }
  for(let q=d0+6;q<d1-2;q+=24){ const r=Wa(q);                                    // 柱(国道15号の両側の歩道の上)
    for(const o of[r.e-0.8,r.w+1.5]){ const f=frame(q,o), g=terH(f.x,f.z); S.mg.col(0xc4c7ca).cyl(SV,q,o,g,yB,0.55,10,{tag:'デッキの柱'}); } }
  SG_DECK.push({kind:'西口駅前広場デッキ',s0:d0,s1:d1,o0:Math.min(...SM.map(m=>m[1].w)),o1:Math.max(...SM.map(m=>m[1].e)),y0:yB,y1:yF+1.1,
    inside:(s,o,r)=>{ if(s<d0-r||s>d1+r) return false; const w=Wa(clamp(s,d0,d1)); return o>w.w-r&&o<w.e+r; }, width:Wa});
  tag('東西自由通路(延伸)',pq,yF+14,(oE+oJ)/2+6);
  tag('西口駅前広場デッキ(計画)',(d0+d1)/2,yF+12,Wa((d0+d1)/2).w-8);
}

/* ============ 6b. 架線(インテグレート架線) ============
   【設計方針】JR東日本のインテグレート架線を手本にする(2026-10 作り直し)。
   ・電線は き電ちょう架線2条(左右に15cm離して並べる)+トロリ線1条の3条。
     き電ちょう架線がき電線を兼ねるので、別に張るき電線は無い
   ・トロリ線は支持点ごとに線路中心から左右200mmへ交互に振る(偏位=ジグザグ。
     パンタのすり板が一か所だけ減らないように)。支持点の間は直線(柱間では曲がらない)
   ・ハンガ(吊り線)は約5m間隔で、2条のき電ちょう架線の間の受けから吊る
   ・支持は可動ブラケット:水平パイプ・斜めパイプ・長幹がいし・き電ちょう架線の支持金具・
     振止め(トロリ線を横から押さえる腕。トロリ線から上り勾配にしてパンタに当てない)。
     線路が柱に近ければ柱から張り出し、遠ければ門型のVトラスビームから吊り下げ、
     大屋根の下は屋根の梁から吊り下げる
   ・架線柱は鋼管柱(上へ細くなる)。基礎・ベースプレート・番号札・頂部の架空地線
   高さはすべてレール面から測る(車両のパンタも同じ。旧来は道床面から測っていて6cm低かった)。
   部品は5章の区画(VIA_CH)の結合ジオメトリに積む:柱・ビームの弦=常時/ブラケット・がいし・
   ハンガ=近くだけ。電線は区画ごとに1本の LineSegments(線路の本数によらず描画の呼び出しは一定)。 */
const CAT={STAG:0.20, TWIN:0.075, HANG:5.0, ARM:1.6, REACH:3.0, H1:0.20, DIAG:0.80, ST:0.95, LOW:5.17, BEND:0.06};
const CHAINS=[], SUPS=[], POLES=[], BEAMS=[], POLE_LAMPS=[];   // 架線・支持点・柱・ビーム・柱の灯り(登録簿)
const rTop=s=>railY(s)+RAIL_TOP;                               // レール面の高さ
const chunkAt=s=>VIA_CH.find(C=>s>=C.s0&&s<C.s1)||VIA_CH[s<VIA_CH[0].s0?0:VIA_CH.length-1];
/* 掘割を渡る物(道路橋・橋上駅舎・覆い)の下なら、その床版の下面から吊る(柱は立てない)。
   yb=床版の下端、lo/hi=吊りパイプを置ける横の範囲(擁壁の内面の 0.3m 内) */
function cutDeckRoof(s){
  if(s<DECK_END) return null;
  const D=CUT_DECKS.find(d=>s>=Math.min(d.aS,d.aN)-0.01&&s<=Math.max(d.bS,d.bN)+0.01); if(!D) return null;
  const lo=-(cutHalf(s,-1)-CUT_W.T)+0.3, hi=cutHalf(s,1)-CUT_W.T-0.3;
  return {yb:D.bot, half:Math.min(-lo,hi), lo:lo, hi:hi, deck:true};
}
// 大屋根の下なら、その梁の下端の高さと梁の半長(7章 bigRoof と同じ式)
function staRoofAt(s){
  for(const st of STA) if(BIGROOF(st)&&inStaRoof(s)&&Math.abs(s-st.x)<STA_ROOF_HALF){
    const R=ROOF_OF[st.n]||ROOF_DEF;
    return {yb:railY(st.x)+STD.BEAM, half:R.beam(deckHalf(s)+0.38)};
  }
  return null;
}
// 端どうしでつながる線路(本線は工区ごとに分けて登録している)を1本の鎖にする。
// 偏位の左右を鎖の上で交互にするため(継ぎ目で同じ向きが続かないように)
function trackChains(){
  const nx=new Map(), pv=new Set();
  for(const a of TRACKS) for(const b of TRACKS)
    if(a!==b&&Math.abs(b.x0-a.x1)<0.01&&Math.abs(b.zf(b.x0)-a.zf(a.x1))<0.02){nx.set(a,b);pv.add(b);}
  const out=[];
  for(const t of TRACKS){
    if(pv.has(t)) continue;
    const ch=[t]; for(let c=t;nx.has(c);){c=nx.get(c);ch.push(c);}
    out.push({ch:ch, x0:ch[0].x0, x1:ch[ch.length-1].x1,
      zf:s=>{for(const q of ch) if(s<=q.x1+1e-6) return q.zf(s); return ch[ch.length-1].zf(s);}});
  }
  return out;
}
const catP=(s,o,y)=>{const f=frame(s,o);return [f.x,y,f.z];};
// 長幹がいし:芯と笠 n 枚。p0→p1(ワールド座標)
function catIns(mg,p0,p1,n){
  mg.col(0xc8bfb2).tube(VD,p0,p1,0.03,6);
  const L=Math.hypot(p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]), h=0.016/L;
  for(let k=1;k<=n;k++){
    const t=k/(n+1), a=[], b=[];
    for(let i=0;i<3;i++){a.push(p0[i]+(p1[i]-p0[i])*(t-h)); b.push(p0[i]+(p1[i]-p0[i])*(t+h));}
    mg.tube(VD,a,b,0.07,6);
  }
}
/* 可動ブラケット1基。b=付け根の off(柱の面/吊りパイプ)、dir=張り出す向き(±1)、
   M=支える架線(トロリ線の真上=2条の間)の off の一覧 */
function catBracket(C,s,b,dir,M,yr){
  const md=C.md, h1=yr+WIRE_CAT+CAT.H1, hd=h1-CAT.DIAG;
  const far=dir>0?Math.max.apply(null,M):Math.min.apply(null,M), near=dir>0?Math.min.apply(null,M):Math.max.apply(null,M);
  const e=far+dir*0.25, dq=b+dir*Math.max(0.75,Math.abs(near-b)*0.72);
  md.col(0x5f666d).box(VD,s,b+dir*0.05,h1-0.08,h1+0.08,0.15,0.10).box(VD,s,b+dir*0.05,hd-0.08,hd+0.08,0.15,0.10);
  catIns(md,catP(s,b+dir*0.10,h1),catP(s,b+dir*0.62,h1),3);              // 水平側のがいし
  md.col(0x9ba2a8).tube(VD,catP(s,b+dir*0.62,h1),catP(s,e,h1),0.03,6);     // 水平パイプ
  const D0=catP(s,b+dir*0.10,hd), D1=catP(s,dq,h1), Dm=D0.map((v,i)=>v+(D1[i]-v)*0.42);
  catIns(md,D0,Dm,2);                                                      // 斜め側のがいし
  md.col(0x9ba2a8).tube(VD,Dm,D1,0.025,6);                                 // 斜めパイプ
  for(const m of M){
    md.col(0x6e757c).box(VD,s,m,yr+WIRE_CAT+0.01,h1-0.02,0.05,0.26);       // き電ちょう架線の支持金具
    for(const sd of[-1,1]) md.box(VD,s,m+sd*CAT.TWIN,yr+WIRE_CAT-0.03,yr+WIRE_CAT+0.03,0.07,0.05);
    const q=m-dir*CAT.ST, yl=yr+CAT.LOW, yt=yr+WIRE_TRO+0.02;
    md.col(0x9ba2a8).tube(VD,catP(s,q,h1),catP(s,q,yl),0.017,4);           // 振止めの吊りパイプ
    md.tube(VD,catP(s,q,yl),catP(s,m,yt),0.015,4);                          // 振止め金具(上り勾配)
    md.col(0x5f666d).box(VD,s,m,yt-0.02,yt+0.03,0.10,0.05);                // トロリ線のイヤー
  }
  return {h1:h1, hd:hd, e:e, steady:M.map(m=>[[m-dir*CAT.ST,yr+CAT.LOW],[m,yr+WIRE_TRO+0.02]])};
}
// 鋼管柱(上へ細くなる)。基礎・ベースプレート・アンカーのナット・リブ・番号札
function catPole(C,s,o,sg,base,top){
  C.mg.col(0xbcc0c4).box(VD,s,o,base,base+0.45,0.9,0.9,{skip:'-y'});
  C.mg.col(0x7d858c).box(VD,s,o,base+0.45,base+0.49,0.62,0.62,{skip:'-y'});
  C.mg.col(0x8b939a).cyl(VD,s,o,base+0.49,top,[0.20,0.15],10,{tag:'架線柱'});
  C.mg.col(0x737a81).cyl(VD,s,o,top,top+0.05,0.17,10,{cap:true});
  for(const a of[-1,1]) for(const c of[-1,1]) C.md.col(0x4f555b).box(VD,s+a*0.24,o+c*0.24,base+0.49,base+0.56,0.07,0.07);
  C.md.col(0x7d858c).box(VD,s+0.29,o,base+0.49,base+0.75,0.18,0.02).box(VD,s-0.29,o,base+0.49,base+0.75,0.18,0.02)
    .box(VD,s,o+0.29,base+0.49,base+0.75,0.02,0.18).box(VD,s,o-0.29,base+0.49,base+0.75,0.02,0.18);
  C.md.col(0xf2f2ee).box(VD,s,o-sg*0.205,base+1.55,base+1.85,0.14,0.02);  // 番号札
  POLES.push({s:s,o:o,sg:sg,y0:base+0.49,y1:top,r:0.20});
}
// 門型のVトラスビーム:上弦2本(前後)・下弦1本、ラチスは近くだけ
function catBeam(C,s,o0,o1,yt,yb){
  const L=o1-o0, oc=(o0+o1)/2;
  for(const ds of[-0.22,0.22]) C.mg.col(0x8b939a).box(VD,s+ds,oc,yt-0.035,yt+0.035,0.07,L);
  C.mg.box(VD,s,oc,yb-0.04,yb+0.04,0.08,L-0.36);
  const n=Math.max(2,Math.round(L/0.75));
  C.md.col(0x8b939a);
  for(let k=0;k<n;k++){
    const a=o0+L*k/n, m=o0+L*(k+0.5)/n, b=o0+L*(k+1)/n;
    for(const ds of[-0.22,0.22]) C.md.tube(VD,catP(s+ds,a,yt),catP(s,m,yb),0.02,4).tube(VD,catP(s,m,yb),catP(s+ds,b,yt),0.02,4);
    C.md.tube(VD,catP(s-0.22,a,yt),catP(s+0.22,m,yt),0.018,4);
  }
  for(const o of[o0,o1]) C.md.col(0x6a7178).box(VD,s,o,yb-0.10,yt+0.08,0.56,0.10);   // 柱への取付金具
  BEAMS.push({s:s,o0:o0,o1:o1,y0:yb-0.04,y1:yt+0.035});
}
// 電線:鎖ごとに、支持点の間を直線(トロリ線)と放物線(き電ちょう架線2条)で張る
function catWires(c){
  const N=c.nodes.map((s,k)=>{const o=c.zf(s)+c.d[k], f=frame(s,o), g=frame(s,o+1);
    return {s:s,o:o,x:f.x,z:f.z,nx:g.x-f.x,nz:g.z-f.z,y:rTop(s)};});
  const hang=[], sag=[];
  for(let k=0;k<N.length-1;k++){
    const A=N[k], B=N[k+1], L=B.s-A.s;

    c.nodes=[c.x0].concat(c.sup,[c.x1]);

      const t={zf:c.zf}, b=(trackBulge(t,c.nodes[k-1],s)+trackBulge(t,s,c.nodes[k+1]))/2;
      if(Math.abs(b)<CAT.BEND){alt=-alt; return CAT.STAG*alt;}
      alt=-Math.sign(b);
      return Math.sign(b)*clamp(0.5*Math.abs(b)+0.1,0.15,0.25);

      twin:2*CAT.TWIN, cond:['き電ちょう架線','き電ちょう架線','トロリ線']});
    for(const t of c.ch)

        continue;
      }

      C.md.col(0x6a7178).box(VD,s,best.b,yb-0.08,yb,0.22,0.22);               // 上の取付金具
      const r=catBracket(C,s,best.b+best.dir*0.04,best.dir,M,yr);
      SUPS.push({s:s,mount:roof?(roof.deck?'床版':'屋根'):'ビーム',b:best.b,dir:best.dir,M:M,ch:L.map(w=>w.c.idx),

/* 【設計方針】建物・樹木は「置いてはいけない場所(占有域 KEEP)」と
   「すでに置いた物(OCC)」の2段階で棄却してから置く。
   ・占有域 …… 道路・河川・交差鉄道(井の頭線/世田谷線)・高架下と側道・施設
     交差鉄道は線路に対して斜めに走るので、s一定の帯では覆えない
     (井の頭線は880mの延長でsが約160m動く)。世界座標の直線として判定する。
   ・非重複 …… 世界座標の格子ハッシュに外接円を登録し、円同士が重ならないことを見る。

const KEEP=[];
const keepBand =(c,hw,oh)=>KEEP.push({k:'b',c:c,hw:hw,oh:oh===undefined?1e9:oh}); // 交差道路(s一定の帯)
const keepStrip=(o,hw,s0,s1)=>KEEP.push({k:'s',o:o,hw:hw,s0:s0,s1:s1});           // 並行道路(off一定の帯)
const keepRect =(c,hs,o,ho)=>KEEP.push({k:'r',c:c,hs:hs,o:o,ho:ho});              // 施設
const keepDisc =(c,o,r)=>KEEP.push({k:'d',c:c,o:o,r:r});                          // 池・広場
const keepLine =(A,hw,u0,u1)=>KEEP.push({k:'l',A:A,hw:hw,u0:u0,u1:u1});           // 交差鉄道(世界座標)。hw は数か (u,n)→半幅(側ごと)
const keepHw=(q,u,n)=>typeof q.hw==='function'?q.hw(clamp(u,q.u0,q.u1),n):q.hw;

function cityFree(s,off,rad,px,pz,roadIn){       // roadIn:道路の面への食い込みを許す量[m](実データの建物)
  // 高架下+側道。掘割(DECK_END より西)は側ごとの幅(仙川は北に広い単式ホームがあり、南は狭い)
  if(Math.abs(off)<(s>DECK_END?cutHalf(s,off<0?-1:1):deckHalf(s))+5.2+rad) return false;
  for(const q of KEEP){
    if(q.k==='b'){ if(Math.abs(s-q.c)<q.hw+rad && Math.abs(off)<q.oh) return false; }
    else if(q.k==='s'){ if(Math.abs(off-q.o)<q.hw+rad && s>q.s0 && s<q.s1) return false; }
    else if(q.k==='r'){ if(Math.abs(s-q.c)<q.hs+rad && Math.abs(off-q.o)<q.ho+rad) return false; }
    else if(q.k==='d'){ if(Math.hypot(s-q.c,off-q.o)<q.r+rad) return false; }
    else if(q.k==='f'){ if(q.fn(s,off,rad)) return false; }                       // 形を関数で持つ占有域(品川の自由通路・西口デッキ)
    else {                                                     // 交差鉄道の中心線(世界座標の曲線)
      const p=q.A.uv(px,pz);
      if(Math.abs(p.n)<keepHw(q,p.u,p.n)+rad && p.u>q.u0-rad && p.u<q.u1+rad) return false;
    }
  }
  // 実データの面の判定は重いので最後に(占有域で落ちる候補には要らない)
  if(PLL&&px!==undefined&&roadHit(px,pz,rad-(roadIn||0))) return false;   // 実データの道路の面
  if(PLL&&px!==undefined&&expyHit(px,pz,rad)) return false;     // 自動車道の橋脚
  if(PLL&&px!==undefined&&waterHit(px,pz,rad)) return false;    // 河川・池の水面
  return true;
}

const OCC=new Map(), OCC_CELL=26, OCC_GAP=1.2;
function occFree(px,pz,r){
  if(plbHit(px,pz,Math.min(PLB_PAD,r+OCC_GAP))) return false;      // PLATEAU の建物の足跡(あれば)
  const cx=Math.floor(px/OCC_CELL), cz=Math.floor(pz/OCC_CELL);
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    const l=OCC.get((cx+a)+','+(cz+b)); if(!l) continue;
    for(const o of l){
      const rr=r+o[2]+OCC_GAP;
      if((px-o[0])*(px-o[0])+(pz-o[1])*(pz-o[1])<rr*rr) return false;
    }
  }
  return true;
}
function occAdd(px,pz,r){
  const k=Math.floor(px/OCC_CELL)+','+Math.floor(pz/OCC_CELL);
  let l=OCC.get(k); if(!l){l=[];OCC.set(k,l);}
  l.push([px,pz,r]);
}

    get instanceColor(){return {set needsUpdate(v){for(const c of TREE_CH.values()) for(const m of [c.m,c.mn]) if(m.instanceColor) m.instanceColor.needsUpdate=v;}};},
    get cols(){return CITY.trees.map(t=>{const m=TREE_CH.get(t.ci).m; return m.cols?m.cols[t.j]:undefined;});},
    set cols(a){for(const c of TREE_CH.values()) c.m.cols=[];},
    get count(){return CITY.trees.length;}
  };
}

/* ============ 8a. JR 等の線路(国土地理院。gsi_rail.js) ============
   京急以外の鉄道(JR 山手線・京浜東北線・東海道線・横須賀線・新幹線ほか)の線路を、国土地理院の「軌道の中心線」から描く。
   ・道床(砕石):幅 3.0m の帯(上面+両側の斜面)。地表(terH)に沿わせる
   ・レール:狭軌(軌間 1.067m)。新幹線(標準軌)も区別できないので全部 1.067m で描く(推定)
   ・無壁舎(ホームの上屋):地表+4.6m の薄い屋根(厚さ 0.3m)
   ・線路の上の建物(駅の自由通路・駅ビル):下端を地表+6.8m(架線より上)に浮かせた人工地盤
   描画の呼び出しを減らすため、種類ごとに1つの結合ジオメトリにする(頂点カラー) */
const JR_GAUGE=1.067, JR_RAIL_OFF=(JR_GAUGE+0.065)/2;
if(GSR){
  const P=[],N=[],I=[],C=[], col=new THREE.Color();
  const vtx=(x,y,z,nx,ny,nz,hex)=>{P.push(x,y,z);N.push(nx,ny,nz);setSrgb(col,hex);C.push(col.r,col.g,col.b);return P.length/3-1;};
  // 折れ線 L に沿う帯。prof=[[横のずれ,高さ],…](左から右へ)。面の法線は隣の点から
  const ribbon=(L,prof,hex)=>{
    const S=[]; for(let i=0;i<L.length-1;i++){const A=L[i],B=L[i+1],n=Math.max(1,Math.ceil(Math.hypot(B[0]-A[0],B[1]-A[1])/4));
      for(let k=0;k<n;k++) S.push([A[0]+(B[0]-A[0])*k/n, A[1]+(B[1]-A[1])*k/n]);}
    S.push(L[L.length-1]); if(S.length<2) return;
    let prev=null;
    for(let i=0;i<S.length;i++){
      const a=S[Math.max(0,i-1)], b=S[Math.min(S.length-1,i+1)], l=Math.hypot(b[0]-a[0],b[1]-a[1])||1, tx=(b[0]-a[0])/l, tz=(b[1]-a[1])/l;
      const nx=-tz, nz=tx, g=terH(S[i][0],S[i][1]);
      const row=prof.map(q=>[S[i][0]+nx*q[0], g+q[1], S[i][1]+nz*q[0]]);
      const ids=[];
      for(let k=0;k<row.length-1;k++){            // 区間ごとに頂点を分ける(角で陰が分かれる)
        const p=row[k], q=row[k+1], dx=q[0]-p[0], dy=q[1]-p[1], dz=q[2]-p[2], w=Math.hypot(dx,dz)||1;
        let fx=-dy*dx/w, fy=w, fz=-dy*dz/w; const fl=Math.hypot(fx,fy,fz)||1; fx/=fl; fy/=fl; fz/=fl;
        ids.push([vtx(p[0],p[1],p[2],fx,fy,fz,hex), vtx(q[0],q[1],q[2],fx,fy,fz,hex)]);
      }
      if(prev) for(let k=0;k<ids.length;k++){const A=prev[k],B=ids[k];
        // 上向きの巻き順にそろえる(裏から照らされると暗くなる)。A0→B0 と A0→A1 の外積の y で見る
        const q=i=>[P[3*i],P[3*i+2]], a0=q(A[0]), b0=q(B[0]), a1=q(A[1]);
        const up=(b0[1]-a0[1])*(a1[0]-a0[0])-(b0[0]-a0[0])*(a1[1]-a0[1]);
        if(up>=0) I.push(A[0],B[0],A[1], A[1],B[0],B[1]); else I.push(A[0],A[1],B[0], A[1],B[1],B[0]);}
      prev=ids;
    }
  };
  for(const L of GSR.rails){
    ribbon(L,[[-1.9,0.02],[-1.35,0.30],[1.35,0.30],[1.9,0.02]],0x8f8a82);                       // 道床
    for(const sg of[-1,1]){ const o=sg*JR_RAIL_OFF;
      ribbon(L,[[o-0.04,0.30],[o-0.035,0.46],[o+0.035,0.46],[o+0.04,0.30]],0x5b5650); }         // レール
  }
  // 平らな多角形の板(上面・下面・側面)。y0/y1=下端・上端
  const slab=(R,y0,y1,top,side)=>{
    const V=R.map(p=>[p[0],p[1]]), T=earTri(V);
    for(const [yy,up] of [[y1,1],[y0,-1]]){const o=P.length/3;
      for(const v of V) vtx(v[0],yy,v[1],0,up,0,up>0?top:side);
      for(const t of T){const A=V[t[0]],B=V[t[1]],Cc=V[t[2]], cr=(B[1]-A[1])*(Cc[0]-A[0])-(B[0]-A[0])*(Cc[1]-A[1]);
        if((cr>=0)===(up>0)) I.push(o+t[0],o+t[1],o+t[2]); else I.push(o+t[0],o+t[2],o+t[1]);}}
    for(let k=0;k<V.length;k++){const a=V[k], b=V[(k+1)%V.length], l=Math.hypot(b[0]-a[0],b[1]-a[1])||1, nx=(b[1]-a[1])/l, nz=-(b[0]-a[0])/l;
      const i0=vtx(a[0],y0,a[1],nx,0,nz,side), i1=vtx(b[0],y0,b[1],nx,0,nz,side), i2=vtx(b[0],y1,b[1],nx,0,nz,side), i3=vtx(a[0],y1,a[1],nx,0,nz,side);
      I.push(i0,i1,i2,i0,i2,i3, i0,i2,i1,i0,i3,i2);}            // 両面(多角形の向きが揃わないことがある)
  };
  const gMin=R=>Math.min(...R.map(p=>terH(p[0],p[1])));
  // 京急の構造物の幅(deckHalf+0.5m)の内側の頂点は、その外縁へ線路直角に寄せる(国土地理院の形は現況。事業後は京急の駅になる所)
  const clipKQ=R=>R.map(p=>{const q=prjXY(p[0],p[1]); if(q.s<DOM.x0||q.s>DOM.x1) return p;
    const lim=deckHalf(q.s)+0.5; if(Math.abs(q.off)>=lim) return p; const f=frame(q.s,(q.off<0?-1:1)*lim); return [f.x,f.z];});
  for(const R0 of GSR.roofs){ const R=clipKQ(R0), g=gMin(R); slab(R,g+4.3,g+4.6,0x9aa0a6,0x7d848c); }            // ホームの上屋
  for(const [R0,h] of GSR.decks){ const R=clipKQ(R0), g=gMin(R); slab(R,g+6.8,g+6.8+Math.max(3.2,h-6.8),0xd9dcdf,0xb7c3cc); }   // 線路上空の建物
  const m=new THREE.Mesh(facesGeo(P,N,I,C),M(0xffffff,{vertexColors:true,side:THREE.DoubleSide}));
  m.name='JR等の線路'; m.receiveShadow=true; scene.add(m);
  STRUCT.push({tag:'JR等の線路', n:GSR.rails.length, roofs:GSR.roofs.length, decks:GSR.decks.length});
}

/* ============ 8b. 夜の灯り ============
   【設計方針】夜は太陽を弱めるだけだと全体が沈んで何も見えない。実際の夜景が
   見えるのは「地物が暗くても、窓・街灯・ホームの灯りが**自分で光っている**」から。
   そこで光源を増やすのではなく、**自発光(発光する面)を足す**。
   点光源を増やすと1つごとに全フラグメントの計算が増えるが、自発光の面は
   ただの描画なので、5,000棟ぶんでも描画の呼び出しは数回で済む。

   ・窓明かり … 建物の**側面4枚だけ**の薄い殻を建物と同じ位置に重ね、
     窓格子のテクスチャを**加算合成**で乗せる。黒い画素は何も足さないので
     昼夜の切替は group.visible だけでよい。屋根に窓が出ないよう天地面は作らない
   ・街灯/ホーム … 発光色の小さな球と箱。フォグを掛けない(霞の向こうでも灯りは見える)
   ・ホーム・上屋・車両 … 既存の材質に emissive を足して「照らされている」ように見せる

   昼は `visible=false` で完全に無効。影の対象からも外す(光るものは影を落とさない)。 */
const NIGHT_STAT={win:0,lamp:0,plat:0};
// 夜の駅の照明で車体を照らす強さ・消える距離[m]・全車両の登録簿(9章 carLit)。車両(makeCar)より前に宣言する
const CAR_LIT=0.35, CAR_LIT_FADE=40, CARS_ALL=[];
/* 夜の車両の下地(2026-10-13 利用者指摘:夜は前面が側面より暗く見える)。夜の光は空の環境光と月(南西の高い所)だけで、月に向く面と
   背く面の差が出る(上りの前面=東向きには月が当たらない)。車体と部品に、面の色を掛けた一様な発光を駅の外でも足して差を縮める */
const CAR_NIGHT_FILL=0.07;
let NIGHT_ON=false;
const NIGHT_HOOKS=[];      // 夜の切替で呼ぶ関数(後の章で足す物:ホームの人・自動車の灯火)。NIGHT.set が on で呼ぶ
/* 駅の照明の下の線路(道床・まくらぎ・レール・締結装置・バラスト)と桁の上面も夜に明るくする(利用者指示)。
   材質は全線で共有なので、**世界座標で駅の範囲に入っている面だけ**を、面の色を掛けた発光で照らす(車体の uLit と同じ考え方)。
   駅の範囲:ホームの実範囲(platRange)を線路に沿って3区間の折れ線にし(曲線の駅でも外れない)、横は桁の半幅、
   高さはレール面−1.5m より上(桁の下・地上は照らさない)。区間の外へ CAR_LIT_FADE で消える */
const STA_SEG=[];
for(const st of STA){
  const r=platRange(st), y0=railY(st.x)-1.5;
  for(let k=0;k<3;k++){
    const sa=r[0]+(r[1]-r[0])*k/3, sb=r[0]+(r[1]-r[0])*(k+1)/3, A=frame(sa,0), B=frame(sb,0);
    STA_SEG.push({A:[A.x,A.z],B:[B.x,B.z],hw:Math.max(deckHalf(sa),deckHalf(sb))+0.5,y0:y0,
                  open0:k===0, open1:k===2});      // 端の区間だけ外へ消える(中の継ぎ目は消さない)
  }
}
const STA_LIT_U={uStaA:{value:STA_SEG.map(g=>new THREE.Vector4(g.A[0],g.A[1],g.B[0],g.B[1]))},
                 uStaB:{value:STA_SEG.map(g=>new THREE.Vector4(g.hw,g.y0,g.open0?1:0,g.open1?1:0))},
                 uStaLit:{value:0}, uCarFill:{value:0}};
// 検証と同じ式(シェーダの staLitF と同じ)。点 (x,y,z) の照らされ具合 0〜1
function staLitAt(x,y,z){
  let f=0;
  for(const g of STA_SEG){
    if(y<g.y0) continue;
    const dx=g.B[0]-g.A[0], dz=g.B[1]-g.A[1], L=Math.hypot(dx,dz), ux=dx/L, uz=dz/L;
    const u=(x-g.A[0])*ux+(z-g.A[1])*uz, v=Math.abs(-(x-g.A[0])*uz+(z-g.A[1])*ux);
    if(v>g.hw) continue;
    const out=Math.max(0,g.open0?-u:(u<0?1e9:0),g.open1?u-L:(u>L?1e9:0));
    f=Math.max(f,1-out/CAR_LIT_FADE);
  }
  return Math.max(0,f);
}
function staLitPatch(mat,car){                 // car=車両の部品:夜はどこでも下地の明るさ(uCarFill)を足す
  if(!mat||mat.userData.staLit) return;
  const prev=mat.onBeforeCompile;
  mat.userData.staLit=true; mat.userData.carFill=!!car;
  mat.onBeforeCompile=function(sh,r){
    if(prev&&prev!==THREE.Material.prototype.onBeforeCompile) prev.call(this,sh,r);
    Object.assign(sh.uniforms,STA_LIT_U);
    sh.vertexShader='varying vec3 vStaW;\n'+sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n  { vec4 kw=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n  kw=instanceMatrix*kw;\n#endif\n  kw=modelMatrix*kw; vStaW=kw.xyz; }');
    sh.fragmentShader='varying vec3 vStaW; uniform vec4 uStaA['+STA_SEG.length+']; uniform vec4 uStaB['+STA_SEG.length+']; uniform float uStaLit; uniform float uCarFill;\n'+
      'float staLitF(vec3 p){ float f=0.;\n  for(int i=0;i<'+STA_SEG.length+';i++){ vec4 a=uStaA[i], b=uStaB[i];\n'+
      '    if(p.y<b.y) continue; vec2 d=a.zw-a.xy; float L=length(d); vec2 t=d/L, q=p.xz-a.xy;\n'+
      '    float u=dot(q,t), v=abs(-q.x*t.y+q.y*t.x); if(v>b.x) continue;\n'+
      '    float o=max(0.,max(b.z>.5?-u:(u<0.?1e9:0.), b.w>.5?u-L:(u>L?1e9:0.)));\n'+
      '    f=max(f,1.-o/'+CAR_LIT_FADE.toFixed(1)+'); }\n  return clamp(f,0.,1.); }\n'+
      sh.fragmentShader.replace('#include <emissivemap_fragment>',
        '#include <emissivemap_fragment>\n  { float sl=(uStaLit>0.)?uStaLit*staLitF(vStaW):0.;'+(car?' sl=max(sl,uCarFill);':'')+' if(sl>0.) totalEmissiveRadiance+=diffuseColor.rgb*sl; }');
  };
  const pk=prev?String(prev):'';
  mat.customProgramCacheKey=()=>'staLit|'+(car?'car|':'')+pk;
}     // 検証用(灯りの数)
/* 灯りの強さ。窓・街灯・ホーム照明・emissive のすべてに一律で掛ける
   (利用者指示で2.5倍)。色はリニア値に掛けるので、トーンマッピングを通った
   画面上では白へ寄りながら明るくなる(飽和で色が飛ぶのを ACES が和らげる) */
const LIGHT_GAIN=2.5;
const glow=h=>srgb(h).multiplyScalar(LIGHT_GAIN);
const NIGHT=(function(){
  const G=new THREE.Group(); G.visible=false; G.name='night'; scene.add(G);

  /* ---- 建物の窓明かり:窓は壁の面にシェーダで描く(8章 bldWinPatch)。夜は BLD_WIN_U.uWinNight で灯す ---- */
  NIGHT_STAT.win=CITY.buildings.filter(b=>b.wt!==undefined).length;
  // 加算合成なので黒=透明。奥行きは書かない(暈けが物の面と取り合わない)
  const lit=o=>mkMat('MeshBasicMaterial',Object.assign(
    {blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false},o));

  /* ---- 街灯(高架の側道の外側と甲州街道) ---- */
  {
    const pts=[];
    for(let x=DOM.x0+30;x<DECK_END-20;x+=34)
      for(const sg of[-1,1]) pts.push([x,sg*(deckHalf(x)+5.4)]);
    if(!PLL) for(let x=DOM.x0-200;x<DOM.x1+200;x+=46) pts.push([x,143],[x,173]);   // 模式の甲州街道
    else for(const q of ROAD_LAMPS){const r=prjXY(q[0],q[1]); pts.push([r.s,r.off]);}  // 実データの幹線の歩道際
    // 高架の上(架線柱の灯り。6b章が柱に腕を付けた位置)。前面展望で奥へ伸びる灯りの列になる
    for(const L of POLE_LAMPS) if(L.s<=DECK_END) pts.push([L.s,L.o,L.y]);
    const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(1,1,1);
    const head=new THREE.InstancedMesh(new THREE.SphereGeometry(0.42,6,4),
      mkMat('MeshBasicMaterial',{color:glow(0xffe3ad),fog:false}),pts.length);
    const halo=new THREE.InstancedMesh(new THREE.SphereGeometry(1.7,8,5),
      lit({color:glow(0xffd27a),opacity:0.20}),pts.length);
    // 地上の街灯は建物・樹木に埋まる位置を除く(高架上の灯りは対象外)
    for(let k=pts.length-1;k>=0;k--){
      const p=pts[k]; if(p[2]!==undefined) continue;
      const f=frame(p[0],p[1]); if(!occFree(f.x,f.z,1.0)) pts.splice(k,1);
    }
    pts.forEach(function(p,i){
      const f=frame(p[0],p[1]);
      m4.compose(new THREE.Vector3(f.x,(p[2]===undefined?5.2+terH(f.x,f.z):p[2]),f.z),q,sc);   // 地上の灯りは地表(地形)から 5.2m
      head.setMatrixAt(i,m4);halo.setMatrixAt(i,m4);
    });
    head.instanceMatrix.needsUpdate=true;halo.instanceMatrix.needsUpdate=true;
    G.add(head);G.add(halo);
    NIGHT_STAT.lamp=pts.length;
  }

  /* ---- ホームの照明(上屋の下に等間隔で並べる) ---- */
  {
    const pts=[];
    for(const pl of PLATS)
      for(let x=pl.x0+5;x<pl.x1-5;x+=7) pts.push([x,(pl.edge(x,-1)+pl.edge(x,1))/2,pl.lampY,pl.y+STD.PLAT,(pl.edge(x,1)-pl.edge(x,-1))/2]);   // 灯具は上屋・吊りレールの下(曲がる縁ではその s の中心)
    const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(1,1,1);
    const lamp=new THREE.InstancedMesh(new THREE.BoxGeometry(2.4,0.12,0.5),
      mkMat('MeshBasicMaterial',{color:glow(0xfff6e6),fog:false}),pts.length);
    const halo=new THREE.InstancedMesh(new THREE.BoxGeometry(3.4,1.1,2.4),
      lit({color:glow(0xfff0d8),opacity:0.18}),pts.length);
    /* 床の光だまり:灯具の真下に、中心が明るく縁へ消える長円の面を加算で重ねる */
    const pc=document.createElement('canvas'); pc.width=pc.height=64;
    {const cx=pc.getContext('2d'), gr=cx.createRadialGradient(32,32,2,32,32,32);
     gr.addColorStop(0,'rgba(255,248,232,1)'); gr.addColorStop(0.55,'rgba(255,240,215,.45)'); gr.addColorStop(1,'rgba(0,0,0,0)');
     cx.fillStyle='#000';cx.fillRect(0,0,64,64);cx.fillStyle=gr;cx.fillRect(0,0,64,64);}
    const pg=new THREE.PlaneGeometry(1,1); pg.rotateX(-Math.PI/2);
    const pool=new THREE.InstancedMesh(pg,lit({map:canvasTex(pc),color:glow(0x6e6658),opacity:1,polygonOffset:true,polygonOffsetFactor:-2}),pts.length);
    const e=new THREE.Euler(), qq=new THREE.Quaternion(), ps=new THREE.Vector3();
    pts.forEach(function(p,i){
      const f=frame(p[0],p[1]);
      m4.compose(new THREE.Vector3(f.x,p[2],f.z),q,sc);
      lamp.setMatrixAt(i,m4);halo.setMatrixAt(i,m4);
      e.set(0,-f.a,0); qq.setFromEuler(e);
      m4.compose(new THREE.Vector3(f.x,p[3]+0.03,f.z),qq,ps.set(7.5,1,Math.max(2,p[4]*2-0.8)));
      pool.setMatrixAt(i,m4);
    });
    lamp.instanceMatrix.needsUpdate=true;halo.instanceMatrix.needsUpdate=true;pool.instanceMatrix.needsUpdate=true;
    G.add(lamp);G.add(halo);G.add(pool);
    NIGHT_STAT.plat=pts.length; NIGHT_STAT.pool=pool.count;
  }

  /* ---- 昼夜の切替 -----------------------------------------------------------
     発光する面(G)の表示に加え、既存の材質へ emissive を足して
     「照らされている」ように見せる。昼は必ず 0 に戻す。
     ※ 車両の材質(9章)はここより後で定義されるが、呼ばれるのは読み込み後なので
       参照して差し支えない。 */
  const EMI=[
    ['plat',   0x5a554a], ['canopy', 0x3e3a32], ['hdoor', 0x3a362c],
    ['wall',   0x121109], ['glass',  0x6a5f44],
    // 高架の上は街灯が照らしている体。前面展望で路盤とレールが見えないと
    // 「真っ暗な板の上を走る」絵になる
    ['slab',   0x101216], ['deckNew', 0x101216], ['deckOld', 0x0e1014],
    ['barrier',0x14161b], ['rail',    0x1d2026], ['pole', 0x0e1014],
    // 結合ジオメトリ(3b章):駅はホーム・上屋と同じく明るめ、高架橋は桁と同じ
    ['stVC',   0x6a6458], ['vdVC',    0x101216], ['tie', 0x0e1014],
  ];
  /* 駅(結合ジオメトリ MAT.stVC)は夜に強く照らされている(利用者指示:駅部はもっと明るい)。
     emissive を一様に足すと暗い外装まで白く浮くので、**面の色(頂点カラー)を掛けた**発光にする
     =照明に照らされた自分の色で見える。ホーム・上屋・駅舎のガラスも強める */
  if(MAT.stVC) MAT.stVC.onBeforeCompile=function(sh){
    sh.fragmentShader=sh.fragmentShader.replace('#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n#ifdef USE_COLOR\n  totalEmissiveRadiance*=vColor;\n#endif');
  };

    G.visible=!!on;
    NIGHT_ON=!!on; for(const c of CARS_ALL) carLit(c);     // 留置車も含めて車体の照らし方を見直す
    for(const f of NIGHT_HOOKS) f(!!on);
    STA_LIT_U.uStaLit.value=on?CAR_LIT:0;                    // 駅の照明の下の線路
    STA_LIT_U.uCarFill.value=on?CAR_NIGHT_FILL:0;             // 車両の部品の夜の下地
    BLD_WIN_U.uWinNight.value=on?0.55*LIGHT_GAIN:0;          // 建物の窓明かり
    for(const [k,hex] of EMI){
      const m=MAT[k]; if(!m||!m.emissive) continue;
      m.emissive.copy(on?glow(hex):srgb(0x000000));
    }
    // 車両:前照灯・尾灯を強め、車内灯のぶんだけ車体を浮かせる
    if(typeof M_HL!=='undefined'){
      // 8000系(v4):灯火は昼から点いているので、夜はさらに強める。車内は照明が自発光で、
      // 窓が透けて見えるので車体には何も足さない
      M_HL.emissive.copy(on?glow(0xffffff):srgb(0xfff2d8));
      M_TL.emissive.copy(on?glow(0xff1a10):srgb(0xff0d08));
    }

  // 親子関係ではなく目印で判定する(群を入れ子にしても取りこぼさない)
  G.traverse(function(o){o.userData.night=true;});

  for(const m of [MAT.vdVC,MAT.tie,MAT.rail,MAT.railRust,MAT.fast,MAT_BALLAST,MAT_TONGUE]) staLitPatch(m);
  return {group:G, set:set, stat:NIGHT_STAT};
})();

// 断面:すその丸み → 垂直な側面 → 肩(超楕円) → 屋根頂部。帯・窓・扉の境目に頂点を置く
const K8_ROWS=(function(){
  const R=[], hw=K8.HWB;
  for(let k=0;k<7;k++){const t=k/6*Math.PI/2;
    R.push([K8.Z_FLR-0.14*Math.cos(t), hw-0.05+0.05*Math.sin(t)]);}
  for(const z of [K8.RED_LO[0],K8.RED_LO[1],K8.BLUE[0],K8.BLUE[1],K8.RED_UP[0],K8.RED_UP[1],
                  K8.WZ0,2.46,K8.DWZ1,K8.WZ1,K8.DZ1,K8.MAKU[0],K8.MAKU[1]]) R.push([z,hw]);
  R.push([K8.Z_SH0,hw]);
  for(let k=1;k<15;k++){const t=k/15;
    const y=hw*Math.pow(Math.cos(t*Math.PI/2),0.5);
    const z=K8.Z_SH0+(K8.Z_CROWN-K8.Z_SH0)*Math.sqrt(Math.max(0,1-Math.pow(y/hw,4)));
    R.push([z,Math.max(y,0.06)]);}

})();
// 前面の中心線の輪郭(写真の実測):下部は後退、1.62〜2.52 は垂直、その上は後退して肩へ
const K8_NOSE_PROFILE=[[0.95,9.576],[1.62,9.752],[2.52,9.752],[3.50,9.635],[3.55,9.615],
                       [3.60,9.570],[3.63,9.51],[3.66,9.44],[3.69,9.36],[3.73,9.28]];
const K8_NOSE_D=0.34;                    // 前面の角の回り込み
function k8xf(z){                        // 高さ z での前面中心線の x
  const P=K8_NOSE_PROFILE;
  if(z<=P[0][0]) return P[0][1];
  for(let i=0;i<P.length-1;i++){
    const a=P[i], b=P[i+1];
    if(z<=b[0]) return a[1]+(b[1]-a[1])*(z-a[0])/(b[0]-a[0]);
  }
  return P[P.length-1][1];
}
// 前面の平面形:中央はゆるい曲面、角で側面へ回り込む(s=-1〜1 は左右の正規化位置)
function k8nose(z,s,hw){
  const y=s*hw;
  return k8xf(z)-K8_NOSE_D*(1-Math.sqrt(Math.max(0,1-Math.pow(Math.abs(s),6))))-y*y/16.0;
}

    W.push([g+0.021,g+0.943,K8.WZ0,K8.WZ1,0.07,0.07,0]);

    if(cab&&d>7&&sg>0) continue;                         // 運転台側の扉1の前は窓なし(ロゴの板)
    const a=d+sg*0.895, b=d+sg*1.175;

    W.push([Math.min(a,b),Math.max(a,b),K8.WZ0,K8.WZ1,0.08,0.08,0]);

}

const k8lin=(r,g,b)=>[s2l(r),s2l(g),s2l(b)];             // sRGB(0〜1) → リニア(頂点カラー)

  seat:k8lin(.24,.19,.43), strap:k8lin(.92,.92,.90), ac:k8lin(.62,.64,.65), acL:k8lin(.30,.31,.32), acF:k8lin(.10,.11,.12),

/* 多角形の寄せ集め(v4 の bmesh 相当)。面ごとに頂点を持つので法線は面の向き(平らな陰影) */
function K8B(){this.P=[];this.N=[];this.C=[];this.U=[];}
K8B.prototype.poly=function(pts,col,uvs){               // pts:[[x,y,z],...] v4座標・反時計回り
  const n=pts.length; if(n<3) return;
  const a=pts[0], b=pts[1], c=pts[Math.min(2,n-1)];
  // 面の法線(v4座標)→ 写像
  let nx=0,ny=0,nz=0;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];
    nx+=(p[1]-q[1])*(p[2]+q[2]); ny+=(p[2]-q[2])*(p[0]+q[0]); nz+=(p[0]-q[0])*(p[1]+q[1]);}
  const l=Math.hypot(nx,ny,nz)||1; nx/=l;ny/=l;nz/=l;
  for(let i=1;i<n-1;i++) for(const k of [0,i,i+1]){
    const p=pts[k];
    this.P.push(p[0],p[2],-p[1]); this.N.push(nx,nz,-ny);
    this.C.push(col[0],col[1],col[2]);
    if(uvs) this.U.push(uvs[k][0],uvs[k][1]); else this.U.push(0,0);
  }
};
K8B.prototype.quad=function(a,b,c,d,col,uvs){this.poly([a,b,c,d],col,uvs);};
K8B.prototype.box=function(x0,x1,y0,y1,z0,z1,col){
  const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  for(const f of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])
    this.poly(f.map(i=>v[i]),col);
};
K8B.prototype.cyl=function(p0,p1,r,seg,col,cap){       // p0→p1 の円柱
  const d=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], L=Math.hypot(d[0],d[1],d[2])||1;
  const dn=[d[0]/L,d[1]/L,d[2]/L];
  let ux,uy,uz;                                           // dn に直交する単位ベクトル
  if(Math.abs(dn[0])<0.9){ux=0;uy=dn[2];uz=-dn[1];}else{ux=-dn[2];uy=0;uz=dn[0];}
  let ul=Math.hypot(ux,uy,uz); ux/=ul;uy/=ul;uz/=ul;
  const vx=dn[1]*uz-dn[2]*uy, vy=dn[2]*ux-dn[0]*uz, vz=dn[0]*uy-dn[1]*ux;
  const A=[],B=[];
  for(let i=0;i<seg;i++){const t=2*Math.PI*i/seg, c=Math.cos(t)*r, s=Math.sin(t)*r;
    const o=[ux*c+vx*s, uy*c+vy*s, uz*c+vz*s];
    A.push([p0[0]+o[0],p0[1]+o[1],p0[2]+o[2]]); B.push([p1[0]+o[0],p1[1]+o[1],p1[2]+o[2]]);}
  for(let i=0;i<seg;i++){const j=(i+1)%seg; this.quad(A[i],A[j],B[j],B[i],col);}
  if(cap!==false){ this.poly(A.slice().reverse(),col); this.poly(B,col); }
};
K8B.prototype.sphere=function(c,r,col){                 // 低多角形の球(乗客の頭)
  const S=6,T=4;
  for(let i=0;i<T;i++)for(let j=0;j<S;j++){
    const p=(a,b)=>{const th=Math.PI*a/T, ph=2*Math.PI*b/S;
      return [c[0]+r*Math.sin(th)*Math.cos(ph), c[1]+r*Math.sin(th)*Math.sin(ph), c[2]+r*Math.cos(th)];};
    if(i===0) this.poly([p(0,0),p(1,j),p(1,j+1)],col);
    else if(i===T-1) this.poly([p(i,j),p(T,0),p(i,j+1)],col);
    else this.quad(p(i,j),p(i+1,j),p(i+1,j+1),p(i,j+1),col);
  }
};
K8B.prototype.geo=function(){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(this.P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(this.N,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(this.C,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(this.U,2));
  return g;
};
// 前面の曲面に沿った四角いパッチ(v4 の patch)。off=面からの浮かせ量。UVは左右0〜1/上下0〜1
function k8patch(B,z0,z1,y0,y1,off,n,col){
  const hw=K8.HWB;
  for(let i=0;i<n;i++){
    const ya=y0+(y1-y0)*i/n, yb=y0+(y1-y0)*(i+1)/n, ua=i/n, ub=(i+1)/n;
    const P=(y,z)=>[k8nose(z,y/hw,hw)+off,y,z];
    B.quad(P(ya,z0),P(yb,z0),P(yb,z1),P(ya,z1),col,[[ua,0],[ub,0],[ub,1],[ua,1]]);
  }
}

/* ---- 9-5. 車体シェル(shell_mesh を移植) ----------------------------------------
   側面と前頭部は頂点を共有して滑らかな陰影に、端面・底面は別頂点にして角を立てる
   (v4 は 40° で角を立てている)。面の向きは「車体中心(0,0,2.3)から外へ」に揃える

function k8ShellGeo(cab){ return carShellGeo(K8_ROWS,k8nose,K8.LEN,cab); }
function carShellGeo(R,nose,LEN,cab){

  const per=[]; for(const r of R) per.push([-r[1],r[0]]); for(let i=nR-1;i>=0;i--) per.push([R[i][1],R[i][0]]);
  const n=per.length;
  const rear=per.map(p=>v(-L2,p[0],p[1]));
  let front;
  const smooth=[];                       // 滑らかに繋ぐ面(側面・前頭部)
  const tri=(a,b,c,list)=>list.push([a,b,c]);
  const quad=(a,b,c,d,list)=>{list.push([a,b,c]);list.push([a,c,d]);};
  const caps=[];                          // 角を立てる面(端面・底面)=別頂点で作る
  if(!cab){
    front=per.map(p=>v(L2,p[0],p[1]));
  }else{
    const C=44, grid=[];
    for(const r of R){
      const z=r[0], hw=r[1], row=[];
      for(let c=0;c<=C;c++){const s=-1+2*c/C; row.push(v(nose(z,s,hw),s*hw,z));}
      grid.push(row);
    }
    front=[]; for(let r=0;r<nR;r++) front.push(grid[r][0]); for(let r=nR-1;r>=0;r--) front.push(grid[r][C]);
    for(let r=0;r<nR-1;r++) for(let c=0;c<C;c++)
      quad(grid[r][c],grid[r][c+1],grid[r+1][c+1],grid[r+1][c],smooth);
    caps.push(grid[0].slice().reverse(), grid[nR-1].slice());   // 前頭部の下面・上面
  }
  for(let i=0;i<n-1;i++){
    // 底の閉じ(すその−y下端〜+y下端)は角を立てる。それ以外の側面は滑らかに
    quad(rear[i],front[i],front[i+1],rear[i+1],smooth);
  }
  caps.push([rear[n-1],front[n-1],front[0],rear[0]]);           // 底面
  caps.push(rear.slice().reverse());                             // 後端面
  if(!cab) caps.push(front.slice());                             // 前端面(中間車)
  // 面の向きを外向きに揃える
  const ctr=[0,0,2.3];
  const fix=(t)=>{
    const a=t[0]*3,b=t[1]*3,c=t[2]*3;
    const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2];
    const wx=P[c]-P[a],wy=P[c+1]-P[a+1],wz=P[c+2]-P[a+2];
    const nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx;
    const mx=(P[a]+P[b]+P[c])/3-ctr[0], my=(P[a+1]+P[b+1]+P[c+1])/3-ctr[1], mz=(P[a+2]+P[b+2]+P[c+2])/3-ctr[2];
    return (nx*mx+ny*my+nz*mz)<0 ? [t[0],t[2],t[1]] : t;
  };
  for(const t of smooth){const f=fix(t); I.push(f[0],f[1],f[2]);}
  // 角を立てる面は頂点を複製(法線を共有しない)。多角形は凸なので扇で三角形にする
  for(const loop of caps){
    const base=loop.map(k=>v(P[k*3],P[k*3+1],P[k*3+2]));
    for(let i=1;i<base.length-1;i++){const f=fix([base[0],base[i],base[i+1]]); I.push(f[0],f[1],f[2]);}
  }
  // v4 座標 → Three.js
  const Q=new Float32Array(P.length);
  for(let i=0;i<P.length;i+=3){Q[i]=P[i];Q[i+1]=P[i+2];Q[i+2]=-P[i+1];}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(Q,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

/* ---- 9-6. 車体の塗り分け(mat_car_body を移植) ----------------------------------
   v4 は Blender のノードで「物体座標 → 帯・窓・扉・前面の黒」を塗っている。同じ式を
   フラグメントシェーダで書く。拡散は Phong(envMap なし=Lambert と同一)のまま、
   色だけを差し替えるので、色管理・影・照明は他の材質と同じ経路を通る。
   扉の開閉(ビューア独自):扉は2枚引戸で、外板の"内側"を戸袋へ滑る。
     開度 o(0〜1)のとき戸は o×半幅だけ滑り、
       ・戸と戸の間の隙間 … 穴(車内が見える)
       ・見えている戸     … 戸の座標へ戻して扉窓・合わせ目を描く
       ・戸袋窓の奥       … 滑り込んだ戸が見える(本物の戸袋窓と同じ)
   uOpen.x/.y = シェルの +y 面/−y 面の開度(車両ごと)。 */
// 塗り分けの色(8000・9000 共通。前面のガラス域の色だけ形式で違う)
function k8ColorDefs(fglass,over){                 // over={C_名前:[r,g,b]}:形式ごとの色の差し替え(2100形)
  const f=v=>v.toFixed(5), c3=a=>'vec3('+a.map(f).join(',')+')';
  return (over?(L=>L.map(d=>{const m=d.match(/^#define (C_[A-Z_]+) /); return (m&&over[m[1]])?'#define '+m[1]+' '+c3(over[m[1]]):d;})):(L=>L))([
    '#define C_STL '+c3(k8lin(.72,.73,.74)), '#define C_DOOR '+c3(k8lin(.75,.77,.79)),
    '#define C_BELOW '+c3(k8lin(.36,.37,.38)), '#define C_IVORY '+c3(k8lin(.90,.88,.80)),
    '#define C_ROOF '+c3(k8lin(.60,.61,.60)), '#define C_RED '+c3(k8lin(.83,.02,.42)),
    '#define C_BLUE '+c3(k8lin(.11,.17,.42)), '#define C_RUB '+c3(k8lin(.05,.05,.055)),
    '#define C_GROOVE '+c3(k8lin(.30,.31,.32)), '#define C_FGLASS '+c3(fglass),
    '#define C_INSIDE '+c3(k8lin(.80,.80,.77)),
  ]);
}
function k8ShaderDefs(){
  const f=v=>v.toFixed(5);
  const c3=a=>'vec3('+a.map(f).join(',')+')';
  return [
    '#define K8_HWB '+f(K8.HWB), '#define K8_L2 '+f(K8.LEN/2),
    '#define Z_BOT '+f(K8.Z_BOT), '#define Z_FLR '+f(K8.Z_FLR), '#define Z_SH0 '+f(K8.Z_SH0),
    '#define DZ1 '+f(K8.DZ1), '#define DOOR_HW '+f(K8.DOOR_HW), '#define FW '+f(K8.FW),
    '#define RED_UP0 '+f(K8.RED_UP[0]), '#define RED_UP1 '+f(K8.RED_UP[1]),
    '#define RED_LO0 '+f(K8.RED_LO[0]), '#define RED_LO1 '+f(K8.RED_LO[1]),
    '#define BLUE0 '+f(K8.BLUE[0]), '#define BLUE1 '+f(K8.BLUE[1]),
    '#define MAKU0 '+f(K8.MAKU[0]), '#define MAKU1 '+f(K8.MAKU[1]),
    '#define MAKU_END '+f(K8.MAKU_END), '#define MAKU_CAB '+f(K8.MAKU_CAB),
    '#define IVORY_X '+f(K8.IVORY_X), '#define WRAP_X '+f(K8.WRAP_X),
    '#define CREW0 '+f(K8.CREW[0]), '#define CREW1 '+f(K8.CREW[1]),
    '#define DOORX vec4('+K8.DOORX.map(f).join(',')+')',
    ...k8ColorDefs(k8lin(.012,.014,.018)),
    '#define NWIN 26',
  ].join('\n')+'\n';
}
const K8_FRAG_FUNCS=`
varying vec3 vK8P; varying vec3 vK8N;
uniform vec4 uWin[NWIN]; uniform vec4 uWinR[NWIN]; uniform int uNWin; uniform vec2 uOpen;
float k8band(float v,float a,float b){return step(a,v)*step(v,b);}
// 角丸長方形の符号付き距離(負=内側)。上の角 rt・下の角 rb
float k8rr(vec2 p, vec4 b, float rt, float rb){
  vec2 c=vec2((b.x+b.y)*.5,(b.z+b.w)*.5), h=vec2((b.y-b.x)*.5,(b.w-b.z)*.5);
  float r=(p.y>c.y)?rt:rb; r=min(r,min(h.x,h.y)-1e-3);
  vec2 q=abs(p-c)-h+r;
  return length(max(q,0.))+min(max(q.x,q.y),0.)-r;
}
`;
// 塗り分けの本体。diffuseColor を上書きし、k8Spec(鏡面の強さ)を決める
const K8_FRAG_MAIN=`
  vec3 P=vK8P; vec3 Nn=normalize(vK8N);
  float X=P.x, Y=P.y, Z=P.z;
  float isSide=step(.75,abs(Nn.y));
  float sgn=(Y>0.)?1.:-1.;
  float u=X*sgn;
  vec3 col=C_STL; float painted=0.; k8Spec=1.;
  // ---- 帯 ----
#ifdef K8_CAB
  float rTop=mix(RED_UP1,RED_LO1,clamp((X-7.97)/(8.27-7.97),0.,1.));   // 段差:後ろが上段
  float rBot=mix(RED_UP0,RED_LO0,clamp((X-7.87)/(8.15-7.87),0.,1.));
  float red=step(rBot,Z)*step(Z,rTop);
  float makuHi=MAKU_CAB;
#else
  float red=k8band(Z,RED_UP0,RED_UP1);
  float makuHi=MAKU_END;
#endif
  float blue=k8band(Z,BLUE0,BLUE1)*(1.-red);
  float maku=k8band(Z,MAKU0,MAKU1)*k8band(X,-MAKU_END,makuHi)*isSide;
  maku*=1.-k8band(u,5.26,5.61); maku*=1.-k8band(u,3.86,4.06);
  maku*=1.-k8band(u,-0.24,0.86); maku*=1.-k8band(u,-5.61,-5.27);
  float roof=step(Z_SH0+.012,Z);
  // ---- 扉(側面のみ)。開いている戸は戸の座標 Xl へ戻して描く ----
  float o=(sgn>0.)?uOpen.x:uOpen.y;
  float slide=o*DOOR_HW;
  float onLeaf=0., Xl=X, inGap=0., behindLeaf=0., behindXl=X, doorLine=0.;
  for(int k=0;k<4;k++){
    float d=DOORX[k];
    float a=abs(X-d), s=(X>=d)?1.:-1.;
    float inOpen=step(k8rr(vec2(X,Z),vec4(d-DOOR_HW,d+DOOR_HW,Z_FLR,DZ1),.10,.005),0.);
    if(inOpen>.5){
      if(a<slide) inGap=1.;
      else { onLeaf=1.; Xl=X-s*slide; }
    } else if(a>=DOOR_HW && a<DOOR_HW+slide){          // 戸袋に滑り込んだ戸(外板の内側)
      behindLeaf=1.; behindXl=X-s*slide;
    }
    // 開口の縁(ゴム)と扉の外側の線
    float ring=k8rr(vec2(X,Z),vec4(d-DOOR_HW-.006,d+DOOR_HW+.006,Z_FLR,DZ1+.006),.10,.005);
    if(ring<=0. && ring>-.012) doorLine=1.;
    if(abs(a-.709)<.003 && Z>Z_FLR && Z<DZ1+.03) doorLine=2.;
  }
  onLeaf*=isSide; inGap*=isSide; behindLeaf*=isSide;
  // ---- 窓(外枠の内側 FW がガラス) ----
  float glass=0., frame=0., crewTop=0.;
  for(int i=0;i<NWIN;i++){
    if(i>=uNWin) break;
    vec4 b=uWin[i]; vec4 r=uWinR[i];
    float kind=r.z;
    float xx=X;
    if(kind>1.5 && kind<2.5){                           // 扉窓は戸と一緒に動く
      if(onLeaf<.5) continue;
      xx=Xl;
    } else if(onLeaf>.5) continue;                      // 戸の上に他の窓は無い
    float so=k8rr(vec2(xx,Z),b,r.x,r.y);
    if(so>0.) continue;
    float si=k8rr(vec2(xx,Z),vec4(b.x+FW,b.y-FW,b.z+FW,b.w-FW),max(r.x-FW,.004),max(r.y-FW,.004));
    if(si<=0.){ glass=1.; if(kind>2.5 && Z>2.823) crewTop=1.; }
    else frame=1.;
  }
  glass*=isSide; frame*=isSide;
  // ---- 色 ----
  if(onLeaf>.5){ col=C_DOOR; }
  if(Z<Z_FLR-.004) col=mix(col,C_BELOW,.35);
#ifdef K8_CAB
  float ivr=step(IVORY_X,X);
  col=mix(col,C_IVORY,ivr); painted=max(painted,ivr);
  col=mix(col,C_ROOF,roof*(1.-ivr));
#else
  col=mix(col,C_ROOF,roof);
#endif
  painted=max(painted,max(max(red,blue),max(maku,roof)));
  col=mix(col,C_RED,max(red,maku));
  col=mix(col,C_BLUE,blue);
  // 戸の合わせ目・戸先の線(戸の座標で)
  if(onLeaf>.5){
    float dd=1e3; for(int k=0;k<4;k++) dd=min(dd,abs(Xl-DOORX[k]));
    if(dd<.0055) col=C_RUB;
    if(abs(dd-.587)<.003 && Z>Z_FLR+.01 && Z<DZ1-.02) col=C_GROOVE;
  }
  if(doorLine>.5 && doorLine<1.5) col=C_RUB;
  if(doorLine>1.5 && onLeaf<.5) col=C_GROOVE;
#ifdef K8_CAB
  if(abs(X-IVORY_X)<.004 && Z>Z_BOT+.05 && Z<Z_SH0-.01 && isSide>.5) col=C_GROOVE;   // 継ぎ目
  { float cr=k8rr(vec2(X,Z),vec4(CREW0,CREW1,Z_FLR+.02,3.046),.06,.005);            // 乗務員扉
    if(isSide>.5 && cr<=0. && cr>-.012) col=C_RUB; }
#endif
  if(frame>.5) { col=C_RUB; painted=1.; }
  // ---- 透ける所(窓ガラス・扉の隙間)。戸袋窓の奥に戸があれば戸を見せる ----
  if(inGap>.5) discard;
  if(glass>.5){
    if(crewTop>.5){ col=C_RUB; }
    else if(behindLeaf>.5){
      // 戸袋の戸。戸の扉窓の位置なら透ける
      bool see=false;
      for(int k=0;k<4;k++){ float d=DOORX[k]; float w=abs(behindXl-d);
        if(w>.135+FW && w<.546-FW && Z>1.995+FW && Z<2.908-FW) see=true; }
      if(see) discard;
      col=C_DOOR*.78; painted=0.;
    } else discard;
  }
#ifdef K8_CAB
  // ---- 前面の黒(ガラス域)と側面への回り込み ----
  float yy=Y*Y/(1.2*1.2), ay=abs(Y);
  float cb=max(ay-1.10,0.), ct=max(ay-1.05,0.);
  float zb=1.86+yy*.07+cb*cb*1.2, zt=3.464-yy*.055-ct*ct*.6;
  float inz=step(zb,Z)*step(Z,zt);
  float wrapG=step(k8rr(vec2(X,Z),vec4(WRAP_X,K8_L2+1.,2.056,3.42),.15,.25),0.);
  float tt=clamp((Nn.x-.3)/.4,0.,1.);
  float fglass=step(WRAP_X,X)*(inz*tt+wrapG*(1.-tt));
  if(fglass>.5){ col=C_FGLASS; painted=0.; k8Spec=1.6; }
#endif
  // 車体の内側の面(窓や扉の隙間から見える反対側の壁の裏)は車内の壁の色にする
  if(!gl_FrontFacing){ col=C_INSIDE; painted=1.; }
  diffuseColor.rgb=col;
  if(painted>.5) k8Spec=min(k8Spec,.35);
`;
const CARMAT=mkPhong({color:srgb(0xffffff),side:THREE.DoubleSide,specular:srgb(0x3a4046),shininess:55});
/* 車体の材質(8000・9000 共通):窓の一覧 W・定数 defs・塗り分けの本体 main だけが形式で違う。
   窓の8番目(9000系)は中央の柱の半幅(無ければ 0=柱なし) */
function carBodyMat(cab,W,defs,main,key,ud){
  const m=CARMAT.clone(), NW=26, uWin=[], uWinR=[];
  for(let i=0;i<NW;i++){
    const w=W[i]||[0,0,0,0,0,0,0];
    uWin.push(new THREE.Vector4(w[0],w[1],w[2],w[3]));
    uWinR.push(new THREE.Vector4(w[4],w[5],w[6],w[7]||0));
  }
  const U={uWin:{value:uWin},uWinR:{value:uWinR},uNWin:{value:W.length},
           uOpen:{value:new THREE.Vector2(0,0)}, uLit:{value:0}};
  m.userData.k8=Object.assign({cab:!!cab, uni:U},ud);
  m.onBeforeCompile=function(sh){
    Object.assign(sh.uniforms,U);
    sh.vertexShader='varying vec3 vK8P; varying vec3 vK8N;\n'+sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  vK8P=vec3(position.x,-position.z,position.y); vK8N=vec3(normal.x,-normal.z,normal.y);');
    sh.fragmentShader='uniform float uLit;\n'+defs()+(cab?'#define K8_CAB\n':'')+K8_FRAG_FUNCS+
      sh.fragmentShader
        .replace('#include <color_fragment>','#include <color_fragment>\n  float k8Spec=1.;\n  {'+main+'  }\n')
        .replace('#include <specularmap_fragment>','#include <specularmap_fragment>\n  specularStrength*=k8Spec;')
        .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n  totalEmissiveRadiance+=diffuseColor.rgb*uLit;');   // 夜の駅の照明(carLit)
  };
  m.customProgramCacheKey=()=>key+(cab?'C':'M');
  return m;
}
const k8BodyMat=cab=>carBodyMat(cab,cab?K8_WIN.cab:K8_WIN.mid,k8ShaderDefs,K8_FRAG_MAIN,'k8body');
if(K8_WIN.cab.length>26||K8_WIN.mid.length>26) throw new Error('窓の数がシェーダの上限を超える');

/* ---- 9-7. 材質 ------------------------------------------------------------------ */
const TRIMMAT=mkPhong({vertexColors:true,side:THREE.DoubleSide,specular:srgb(0x3a4046),shininess:40});
const K8M={
  vc:mkMat('MeshLambertMaterial',{vertexColors:true,side:THREE.DoubleSide}),   // 頂点カラーの部品

  glass:mkMat('MeshBasicMaterial',{color:k8hex(.52,.60,.60),transparent:true,depthWrite:false,

// 金属は物理ベース(空を映す)。台車・パンタは Standard
const M_BOG =mkStd({vertexColors:true,metalness:0.70,roughness:0.52,envMapIntensity:0.8});
const M_PN  =mkStd({color:srgb(0x202326),metalness:0.80,roughness:0.38,envMapIntensity:1.0});   // パンタの枠
const M_SH  =mkStd({color:srgb(0xb9bec4),metalness:0.85,roughness:0.30,envMapIntensity:1.0});   // 舟体
const M_PANS=mkStd({color:srgb(0x9aa1a8),metalness:0.85,roughness:0.25,envMapIntensity:1.0});   // 台枠・ホーン

const M_HL =mkMat('MeshLambertMaterial',{color:0xffffff,emissive:0xfff2d8});   // 前照灯
const M_TL =mkMat('MeshLambertMaterial',{color:0xff1a10,emissive:0xff0d08});   // 尾灯
const M_HL_OFF=mkMat('MeshLambertMaterial',{color:k8hex(.33,.32,.30)});
const M_TL_OFF=mkMat('MeshLambertMaterial',{color:k8hex(.35,.05,.05)});
const M_PASS=mkMat('MeshBasicMaterial',{color:0xffffff});                       // 識別灯(点灯=白)
const M_PASS_OFF=mkMat('MeshLambertMaterial',{color:k8hex(.30,.30,.29)});       // 消灯=レンズの灰

/* ---- 9-8. 文字(表示器・車番・ロゴ)はキャンバスに描いて貼る -------------------- */
const K8_FONT='"IPAGothic","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
const K8_TEXCACHE={}, K8_IMGCACHE={};
function k8Img(key,w,h,draw){

/* 塗装・板(ロゴ・車番)は画像だけを作り、1両ごとに1枚のシートに詰めて1つの Mesh で描く(k8Sheet。2026-10-15 利用者指示:
