<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>京急本線 泉岳寺〜新馬場間 連続立体交差事業(品川駅付近 地平化)3Dビューア</title>
<style>
  :root{
    --ink:#1c2733; --panel:rgba(252,253,254,.94); --line:#c7ced6;
    --keio-pink:#e4007f; --keio-indigo:#1b2a66; --dim:#5a6673;
    --mono:ui-monospace,'SF Mono','Consolas',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif;
    color:var(--ink);background:#dfe8f0}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  /* ---- パネルの開閉タブ ---- */
  .tog{position:fixed;z-index:20;border:1px solid var(--line);background:rgba(255,255,255,.94);
    color:var(--keio-indigo);font:700 12px/1 inherit;cursor:pointer;
    box-shadow:0 2px 8px rgba(20,30,50,.12);padding:0}
  #navTog{top:0;left:50%;transform:translateX(-50%);width:64px;height:22px;
    border-radius:0 0 8px 8px;border-top:none}
  #toolTog{right:0;top:50%;transform:translateY(-50%);width:22px;height:64px;
    border-radius:8px 0 0 8px;border-right:none}
  #nav,#tools{transition:transform .26s ease}
  #nav.hide{transform:translateY(calc(-100% - 20px))}
  #tools.hide{transform:translateX(calc(100% + 20px))}

  /* ---- マスコンの操作ボタン(タッチ対応) ---- */
  #spd .ctl{display:flex;gap:6px}
  #spd .ctl button{min-width:46px;height:40px;border:1px solid var(--keio-indigo);border-radius:9px;
    background:#fff;color:var(--keio-indigo);font:700 15px/1.1 inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #spd .ctl button span{font:600 9.5px/1 inherit;color:var(--dim)}
  #spd .ctl button:active{background:var(--keio-indigo);color:#fff}
  #tools button:disabled{opacity:.42;cursor:not-allowed}
  #spd .ctl button.eb{border-color:#d62828;color:#d62828}
  #spd .ctl button.eb:active{background:#d62828;color:#fff}

  /* ---- スマートフォン対応(横画面で使用) ---- */
  #rot{position:fixed;inset:0;display:none;z-index:99;background:#f4f6f8;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font:600 15px/1.7 var(--sans);color:var(--ink);text-align:center;padding:24px}
  #rot .ico{font-size:44px;transform:rotate(90deg)}
  @media (orientation:portrait) and (max-width:900px){
    #rot{display:flex}
    #tools,#nav,#spd{display:none !important}
  }
  @media (orientation:landscape) and (max-height:560px){
    #tools{top:26px;right:6px;padding:5px;gap:4px;max-height:calc(100vh - 40px);overflow:auto}
    #tools button{font-size:10.5px;padding:6px 8px}
    #nav{left:6px;right:6px;top:24px;padding:6px 8px 4px}
    #nav svg{height:54px}
    #nav .cap b{font-size:11px} #nav .cap i{font-size:10px}
    /* マスコン:左下に小さく(面積1/4)・半透明で配置し、中央の視界を空ける */
    #spd{left:4px;bottom:4px;transform:scale(.5);transform-origin:left bottom;
      opacity:.55;padding:8px 10px;gap:10px;align-items:center}
    #spd:active,#spd:focus-within{opacity:.95}
    #spd .v b{display:none}
  }
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 3px 14px rgba(20,35,55,.12);backdrop-filter:blur(4px)}
  #hdr{top:12px;left:12px;padding:11px 14px 10px;max-width:min(450px,calc(100vw - 24px))}
  #hdr h1{font-size:14.5px;font-weight:700;letter-spacing:.02em;line-height:1.45}
  #hdr h1 .rt{color:var(--keio-pink)}
  #hdr .sub{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6}
  #hdr .facts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  #hdr .facts span{font:600 10px var(--mono);color:var(--keio-indigo);
    border:1px solid var(--keio-indigo);border-radius:3px;padding:2px 5px;background:#fff}
  #tools{top:12px;right:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #tools button{font:600 11.5px/1 inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left;white-space:nowrap}
  #tools button:hover{border-color:var(--keio-indigo)}
  #tools button.on{background:var(--keio-indigo);color:#fff;border-color:var(--keio-indigo)}
  #tools button.ride.on{background:var(--keio-pink);border-color:var(--keio-pink)}
  /* 時刻・季節の切替(4つ並びの小さなボタン) */
  #tools .seg{display:flex;align-items:center;gap:3px}
  #tools .seg b{font:700 10.5px/1 inherit;color:var(--dim);min-width:27px}
  #tools .seg button{flex:1;min-width:26px;padding:6px 0;text-align:center}
  /* 運転モードの種別(運転モードを押したときだけ出す) */
  #tools #segRide{display:none}
  #tools #segRide.show{display:flex}
  #tools button:focus-visible{outline:2px solid var(--keio-pink);outline-offset:1px}
  #nav{left:12px;right:196px;top:12px;padding:10px 14px 8px}   /* 上部固定・右のボタン群を回避 */
  #nav .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  #nav .cap b{font-size:12.5px;letter-spacing:.08em;color:var(--keio-indigo)}
  #nav .cap i{font:11.5px var(--mono);color:var(--dim);font-style:normal}
  #nav svg{display:block;width:100%;height:100px;cursor:pointer}
  #nav text{font-family:'Hiragino Sans','Yu Gothic UI',sans-serif}
  #note{display:none;left:12px;bottom:120px;max-width:min(510px,calc(100vw - 24px));
    max-height:52vh;overflow:auto;padding:12px 15px;font-size:11.5px;line-height:1.75}
  #note.show{display:block}
  #note h2{font-size:12px;color:var(--keio-indigo);margin-bottom:5px}
  #note h2:not(:first-child){margin-top:10px}
  #note p{color:#33404d}
  #note .lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
  #note .lg span{display:inline-flex;align-items:center;gap:5px;font-size:11px}
  #note .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
    border-radius:5px;background:#fff;cursor:pointer;color:var(--ink)}
  #kjStepRow button{font:700 13px/1 inherit;width:30px;height:30px;border:1px solid var(--keio-indigo);
    border-radius:6px;background:#fff;color:var(--keio-indigo);cursor:pointer}
  #kjStepRow button:disabled{opacity:.3;cursor:default}
  #hint{right:12px;bottom:120px;padding:7px 11px;font:10.5px/1.7 var(--mono);color:var(--dim)}
  /* 運転台(マスコン+速度計。運転モード時のみ表示) */
  #spd{display:none;left:16px;bottom:16px;padding:9px 14px;
    align-items:center;gap:12px}
  #spd.show{display:flex}
  /* 段位チップ(P4〜N〜B7・EB) */
  #spd .notch{min-width:56px;height:38px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font:700 17px/1 var(--mono);color:#fff;background:#8a9099;
    letter-spacing:.04em}
  #spd .notch.p{background:#2f7d4f}      /* 力行 */
  #spd .notch.n{background:#8a9099}      /* 中立 */
  #spd .notch.b{background:#d98a3a}      /* 制動 */
  #spd .notch.e{background:#d62828}      /* 非常 */
  /* 戸閉灯:扉が閉まっていれば点灯(黄)/開いていれば消灯(黒)。速度表示の左 */
  #spd .dl{display:flex;flex-direction:column;align-items:center;gap:3px}
  #spd .dl i{width:26px;height:26px;border-radius:50%;background:#14181c;
    border:2px solid #4a5058;box-shadow:inset 0 0 4px rgba(0,0,0,.6)}
  #spd .dl.on i{background:#f2c230;border-color:#c99b12;box-shadow:0 0 9px rgba(242,194,48,.85)}
  #spd .dl b{font:700 9px/1 inherit;color:var(--dim)}
  #spd .v{font:700 22px var(--mono);color:var(--ink);min-width:86px;text-align:center}
  /* 次駅と停止位置までの距離 */
  #spd .nxt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:96px}
  #spd .nxt b{font:700 12.5px/1.2 inherit;color:var(--keio-indigo)}
  #spd .nxt span{font:700 15px/1 var(--mono);color:var(--ink)}
  #spd .nxt span.near{color:#d62828}
  #spd .v i{font:600 12px var(--mono);color:var(--dim);font-style:normal;margin-left:4px}
  #spd .v b{display:block;font:600 9.5px var(--mono);color:var(--dim);margin-top:1px}
  @media (max-width:640px){
    #hdr{padding:9px 11px}
    #hdr h1{font-size:12.5px}
    #hdr .sub,#hdr .facts{display:none}
    #tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:12px;left:12px;right:12px;padding:6px}
    #tools button{padding:7px 8px}
    #hint{display:none}
    #nav svg{height:88px}
  }
</style>
</head>

/* ============================================================================
   京急本線 泉岳寺〜新馬場間 連続立体交差事業(品川駅付近 地平化)3Dビューア ── 保守ガイド
   京王線(笹塚〜仙川)の3Dビューア(3d-keio の最新版)のエンジンを複製し、線区に依存する所を品川向けに改造した。
   ----------------------------------------------------------------------------
   ■ ファイル構成(この見出しコメントで検索できます)
     1. 与件データ        : RAW(駅・現況中心線・別線の振り・平滑化・縦断・旧踏切・地物)
     2. 平面線形          : 現況中心線+振り+平滑化 → CT(10m 格子)→ frame(s,off)・prjXY
    2b. 断面・縦断        : railY(縦断)mainOff deckHalf・掘割 cutHalf・柱を立てない所 ROAD_SKIP/JR_SKIP
     3. シーン基盤        : renderer/材質MAT/strip・box・cyl
    3b. 結合ジオメトリ    : MG(材質ごとに結合・頂点カラー・掃引)/LOD(lodStruct)/登録簿STRUCT
     4. 地表・道路・水面  : 国土地理院の道路・水面(plateau_land.js)・地形(plateau_dem.js。絶対の標高)
     5. 高架橋            : RCラーメン高架橋・擁壁・掘割(5c)。240mの区画 VIA_CH
     6. 線路の登録        : layTrack(本線・品川の内側の線と引上線・両渡り)/trimTracks
    6a. 軌道              : 道床・まくらぎ・締結装置・レール(標準軌)・分岐器(TURNOUTS/FROGS)
    6b. 架線              : インテグレート架線(鋼管柱・Vトラスビーム・可動ブラケット・電線)
     7. 駅                : ホーム・大屋根(北品川)/上屋(品川・新馬場)・橋上駅舎(品川)・階段とEV・駅名標・高架下駅舎
     8. 街並み            : 国土地理院の建物(plateau_bldg.js)・樹木/8a. JR 等の線路(gsi_rail.js)
     9. 列車              : 9b. 京急2100形(K21。9000系の作りを流用)/自動運転(快特・曲線の制限速度 VLIM)
    10. カメラ・モード    : オービット/運転モード(ワンハンドルマスコン・保安ブレーキ)/列車追尾
    11. 縦断図ナビ        : SVG(駅クリック・旧踏切の目盛・現在位置)
    12. UI・メインループ  : ボタン類/resize/loop

   ■ 座標系(最重要)
     ・s   : 線路に沿う距離[m](新馬場の中心=0。泉岳寺方=+、横浜方=−)。営業キロ(泉岳寺起点)は KM(s)
     ・off : 線路直角方向[m](+= s の増す向きの右手=おおむね東)
     ・ワールド: X=東/Z=南/Y=標高 TP−3.0m(Y_TP)。真上から見て北が上
     ・+s へ走る列車(エンジンの「下り」)は京急の上り(泉岳寺方面)。左側通行で −off 側の線を走る
     ・全構造物は frame(s,off) 経由で配置(地表・道路・建物・JR 線は国土地理院の絶対座標)

   ■ 主な調整パラメータ(推定値の一覧は CLAUDE.md)
     ・線形     : RAW.shift(別線の振り)・RAW.smooth(平滑化)。RAW.line(現況線)は触らない
     ・縦断     : RAW.prof・RAW.vc。区間の種類(高架・擁壁・掘割)はレール面の高さで決まる
     ・車両     : K21(2100形の諸元)・K21_FORMATIONS
     ・運行     : TRAIN_DEF・DEP_PAT/DEP_STOP(発車標)・VLIM(制限速度の係数 3.7)

   ■ 保守メモ
     ・編集後は bash tools/verify_all.sh(構文・スタブ実行・数値検証)
     ・長物は曲線追従ロフト(cbox・loft)で生成。直方体Boxは曲線上で弦になる
     ・操作系:ドラッグ=移動/Shift・Ctrl+ドラッグ=回転
   ========================================================================== */

/* ============ 2. 平面線形エンジン(現況中心線+別線の振り+平滑化) ============ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const plateau=(x,c,half,taper)=>{const d=Math.abs(x-c);return d<=half?1:d>=half+taper?0:1-sstep((d-half)/taper)};
const MLAT=110952,MLON=90594;                        // 1度あたりのメートル(北緯35.62°。GRS80 の近似。tools と同じ値)
const LAT0=(RAW.sta[0][5]+RAW.sta[0][7])/2, LON0=(RAW.sta[0][6]+RAW.sta[0][8])/2;   // 原点=新馬場駅の中心
const toXY=(la,lo)=>({x:(lo-LON0)*MLON, z:-(la-LAT0)*MLAT});   // ワールド:X=東+/Z=南+(北=-Z)

const CURL=(()=>{
  const P=RAW.line.map(p=>toXY(p[0],p[1])),o={x:[],z:[],s:[]};
  const push=(x,z)=>{const n=o.x.length;o.s.push(n?o.s[n-1]+Math.hypot(x-o.x[n-1],z-o.z[n-1]):0);o.x.push(x);o.z.push(z);};
  for(let i=0;i<P.length-1;i++){const A=P[i],B=P[i+1],n=Math.max(1,Math.ceil(Math.hypot(B.x-A.x,B.z-A.z)/2));
    for(let k=0;k<n;k++)push(A.x+(B.x-A.x)*k/n, A.z+(B.z-A.z)*k/n);}
  push(P[P.length-1].x,P[P.length-1].z);
  return o;
})();
function trap(x,a,b,c,d){if(x<=a||x>=d)return 0;if(x<b)return sstep((x-a)/(b-a));if(x<=c)return 1;return 1-sstep((x-c)/(d-c));}
function eastShift(sc){let e=0;for(const r of RAW.shift)e+=r[4]*trap(sc,r[0],r[1],r[2],r[3]);return e;}

const DP={x:[],z:[],s:[]};
{
  const N=CURL.x.length,px=[],pz=[];
  for(let i=0;i<N;i++){
    const j0=Math.max(0,i-2),j1=Math.min(N-1,i+2);
    let tx=CURL.x[j1]-CURL.x[j0],tz=CURL.z[j1]-CURL.z[j0];const tl=Math.hypot(tx,tz)||1;tx/=tl;tz/=tl;
    let nx=-tz,nz=tx; if(nx<0){nx=-nx;nz=-nz;}          // 線路に直角で東を向く単位ベクトル
    const e=eastShift(CURL.s[i]);
    px.push(CURL.x[i]+nx*e); pz.push(CURL.z[i]+nz*e);
  }
  for(const sm of RAW.smooth){                           // 指定区間をガウス平滑(重みは台形で滑らかに)
    const sg=sm[4],K=Math.ceil(sg*3/2),wk=[];for(let k=-K;k<=K;k++)wk.push(Math.exp(-.5*(k*2/sg)**2));
    const gx=px.slice(),gz=pz.slice();
    for(let i=0;i<N;i++){const w=trap(CURL.s[i],sm[0],sm[1],sm[2],sm[3]);if(w<=0)continue;
      let sx=0,sz=0,sw=0;for(let k=-K;k<=K;k++){const j=clamp(i+k,0,N-1);sx+=px[j]*wk[k+K];sz+=pz[j]*wk[k+K];sw+=wk[k+K];}

function prjXY(x,z){

renderer.toneMappingExposure=TONE_EXPO;

/* ---- 空の色 -----------------------------------------------------------------

const scene=new THREE.Scene();

/* ---- 航空写真(2026-10-26 利用者指示:候補1「国土地理院の航空写真を、閲覧時に読み込んで地表と屋根に貼る」) ----------
   国土地理院の地理院タイル「全国最新写真(シームレス)」を閲覧時に cyberjapandata.gsi.go.jp から読む(CORS 可。画像は同梱しない=
   写真を同梱しない方針のまま。繋がらなければ今の色で描く)。出典は画面の右下と CREDITS.txt。
   ・貼る所:地表の網・地表に敷いた面(道路・緑地・駐車場。水面と計画の放射23号線は除く)・歩道の上面・玉川上水の緑道・建物の
     屋根(上向きの面。近くの形・切妻・中遠の箱。PLATEAU の写真がある LOD2 の面はそちらのまま)。真上から投影する
   ・線路の構造物の帯(高架下と側道=建物を置かない帯と同じ幅:桁の半幅〔掘割は側ごとの幅〕+5.2m)と、井の頭線・世田谷線の帯は
     今の色のまま(写真は工事中の今の姿で、踏切や今の線路が写っている)。帯の印は帯の縁からの距離の場(4m/画素。双線形で縁がぼけない)
   ・3段:近 z18(1画素 約0.49m・8×8枚=約1.0km 四方)・中 z16(約1.9m・8×8枚=約4.0km)・遠 z14(約7.8m・地表全体を1枚に)。
     近・中の窓はカメラの前に置き、タイルを画像の決まった枠(番号の n の剰余)へ書く(トーラス状。窓が動いても書き直すのは新しく
     入るタイルだけ)。α=1 が「その枠に正しいタイルがある」印(枠を空けるときは α=0 で塗る)。色は α を掛けた値として重ねる
     (双線形・縮小の段でも、空いた枠との境が黒くならない)。スマホは近を使わず、中は 4×4 枚
   ・ワールド(x,z)→経緯度(toXY の逆)→Web メルカトルのタイル座標。窓の原点のまわりで z の2次まで展開してシェーダへ渡す
     (単精度でも 0.01画素。3次の残りは 5km 先で 0.2画素)
   ・明るさ:写真は撮影したときの光(陰を含む)。晴れた昼の平らな地表の照明(半球光+太陽=1.17)と ACES を通して、写真の輝度の
     中央値が元の写真とほぼ同じに見える係数 ORTHO_GAIN(沿線の z18 の36枚で、中央値が同じ=0.60・平均が同じ=0.67 の間)。
     夜・雨・雪は地表と同じ係数を掛ける(applyLook) */
const ORTHO_GAIN=0.65;
const ORTHO_BAND_HEX=0x8f8d88;                // 写真のとき、線路の帯の中の地表(高架下・側道の舗装の灰。写真の道路の明るさに近く)
const ORTHO_LV=[{z:18,n:IS_MOBILE?0:8,ahead:350},{z:16,n:IS_MOBILE?4:8,ahead:1400},{z:14,n:0,whole:true}];   // n=窓の一辺のタイルの数
const ORTHO_U={
  uOrtho0:{value:null}, uOrtho1:{value:null}, uOrtho2:{value:null}, uOrthoMask:{value:null},
  uOr0:{value:new THREE.Vector4(0,0,0,0)}, uOr1:{value:new THREE.Vector4(0,0,0,0)}, uOr2:{value:new THREE.Vector4(0,0,0,0)},   // (x0,z0,sx,sz)
  uOw0:{value:new THREE.Vector4(0,0,1,1)}, uOw1:{value:new THREE.Vector4(0,0,1,1)}, uOw2:{value:new THREE.Vector4(0,0,1,1)},   // (枠の原点,枚数)
  uOq:{value:new THREE.Vector3(0,0,0)}, uOm:{value:new THREE.Vector4(0,0,0,0)},
  uOf:{value:new THREE.Vector3(2,2,1000)},                                   // 窓の縁でぼかす速さ(近・中=0.5枚・遠=ぼかさない)
  uOrthoOn:{value:0}, uOrthoGain:{value:new THREE.Vector3(ORTHO_GAIN,ORTHO_GAIN,ORTHO_GAIN)}, uOrthoSnow:{value:new THREE.Vector4(0,0,0,0)},
  uOrthoBand:{value:new THREE.Vector4(0,0,0,0)},                             // 写真のとき帯の中の地表の色(舗装の灰)と割合
};
let ORTHO_MGR=null;                         // タイルの読み込みと窓(14章の前で作る)。無ければ写真は使わない
// 街から外した実際の建物(PLATEAU の足跡が占有域・道路などに掛かる物。8章)。そのうち線路の帯(高架下・側道・交差鉄道)に掛かって
// 外した物(足跡が帯の縁から ORTHO_HOLE_NEAR 以内)は、写真ではその屋根が帯の脇の地面に平らに写るので、足跡+ORTHO_HOLE_M を今の色に
// する。道路の面に掛かるなどで外した離れた建物は写真の屋根のまま(上から見れば屋根に見える。今の色にすると無地の穴になる)
const ORTHO_HOLES=[], ORTHO_HOLE_M=1.0, ORTHO_HOLE_NEAR=2.0;
// シェーダ:窓ごとの写真(α を掛けた色)を遠→中→近の順に重ね、帯の印で今の色と混ぜる。top=上向きの面だけ(歩道・屋根)
const ORTHO_FS='uniform sampler2D uOrtho0; uniform sampler2D uOrtho1; uniform sampler2D uOrtho2; uniform sampler2D uOrthoMask;\n'+
  'uniform vec4 uOr0; uniform vec4 uOr1; uniform vec4 uOr2; uniform vec4 uOw0; uniform vec4 uOw1; uniform vec4 uOw2;\n'+
  'uniform vec3 uOq; uniform vec4 uOm; uniform vec3 uOf; uniform float uOrthoOn; uniform vec3 uOrthoGain; uniform vec4 uOrthoSnow; uniform vec4 uOrthoBand;\n'+
  'vec4 orthoLv(sampler2D t,vec4 o,float q,vec4 w,float fk,vec2 p){ vec2 d=p-o.xy; vec2 tc=vec2(d.x*o.z,d.y*o.w+d.y*d.y*q);\n'+
  '  vec2 e=min(tc,w.zw-tc); float f=clamp(min(e.x,e.y)*fk,0.,1.); return texture2D(t,(w.xy+tc)/w.zw)*f; }\n'+
  'vec4 orthoAt(vec2 p){ vec4 c=orthoLv(uOrtho2,uOr2,uOq.z,uOw2,uOf.z,p); vec4 c1=orthoLv(uOrtho1,uOr1,uOq.y,uOw1,uOf.y,p); c=c*(1.-c1.a)+c1;\n'+
  '  vec4 c0=orthoLv(uOrtho0,uOr0,uOq.x,uOw0,uOf.x,p); return c*(1.-c0.a)+c0; }\n'+
  'float orthoMaskAt(vec2 p){ vec2 m=(p-uOm.xy)*uOm.zw; if(m.x<0.||m.y<0.||m.x>1.||m.y>1.) return 1.;\n'+
  '  return clamp((texture2D(uOrthoMask,m).r*255.-128.)*.1+.5,0.,1.); }\n'+
  'vec3 orthoMix(vec3 base,vec3 pw,float top,float band){ if(uOrthoOn<=0.||top<=0.) return base;\n'+
  '  vec4 c=orthoAt(pw.xz); float a=c.a*uOrthoOn*top; if(a<=0.) return base; float m=orthoMaskAt(pw.xz);\n'+
  '  base=mix(base,uOrthoBand.rgb,band*uOrthoBand.a*a*(1.-m));\n'+                 // 地表:帯の中は舗装の灰(高架下・側道)。写真の読めた所だけ
  '  float w=a*m; if(w<=0.) return base;\n'+
  '  vec3 s=clamp(c.rgb/max(c.a,1e-3),0.,1.); vec3 lin=mix(s/12.92,pow((s+.055)/1.055,vec3(2.4)),step(.04045,s))*uOrthoGain;\n'+
  '  return mix(base,mix(lin,uOrthoSnow.rgb,uOrthoSnow.a),w); }\n';
const ORTHO_VS='{ vec4 ow=vec4(transformed,1.); vec3 on=objectNormal;\n#ifdef USE_INSTANCING\n ow=instanceMatrix*ow; on=mat3(instanceMatrix)*on;\n#endif\n'+
  ' ow=modelMatrix*ow; vOrW=ow.xyz; vOrN=normalize(mat3(modelMatrix)*on); }';
/* 材質に航空写真を足す(前の onBeforeCompile があれば先に)。top=上向きの面だけ(縁石の側面などは今の色)。
   band=地表の網:写真を使うとき、線路の帯の中の地表を舗装の灰にする(季節の地表の色のままだと写真の中に緑の帯が浮く) */
function orthoPatch(mat,top,band){
  mat.userData.ortho=top?'top':'all'; if(band) mat.userData.orthoBand=true;
  const prev=mat.onBeforeCompile, pk=mat.customProgramCacheKey;
  mat.onBeforeCompile=function(sh,r){
    if(prev&&prev!==THREE.Material.prototype.onBeforeCompile) prev.call(this,sh,r);
    Object.assign(sh.uniforms,ORTHO_U);
    sh.vertexShader='varying vec3 vOrW; varying vec3 vOrN;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n'+ORTHO_VS);
    sh.fragmentShader=ORTHO_FS+'varying vec3 vOrW; varying vec3 vOrN;\n'+sh.fragmentShader.replace('#include <color_fragment>',
      '#include <color_fragment>\n diffuseColor.rgb=orthoMix(diffuseColor.rgb,vOrW,'+(top?'smoothstep(.5,.7,vOrN.y)':'1.')+','+(band?'1.':'0.')+');');
  };
  // シェーダの作り置きの鍵:前の手当ての鍵(無ければ前の関数の文字列)+写真の種類。同じ関数の文字列で別の材質の形を使い回さない
  mat.customProgramCacheKey=function(){
    const base=(pk&&pk!==THREE.Material.prototype.customProgramCacheKey)?pk.call(this):((prev&&prev!==THREE.Material.prototype.onBeforeCompile)?String(prev):'');
    return base+'|ortho'+(top?'T':'A')+(band?'B':''); };
  return mat;
}
/* ---- 影 ---------------------------------------------------------------------
   事業区間は約8.6km×幅±470m。1枚の影マップで全域を覆うとテクセルが数m角になり
   使い物にならないので、**太陽の向きは固定したまま影の写す範囲だけをカメラに
   追従**させる。範囲(半径 R)は視点から注視点までの距離に応じて広げる
   (寄れば精細・引けば広く)。

   影がちらつく(クロールする)のは、カメラが動くたびに影マップの画素境界と
   物の縁の位置関係がずれるため。**注視点を影テクセルの格子に載せて**防ぐ。
   格子は光源座標系で取る必要があるので、光の正規直交基底 F/Rt/Up を作って丸める。 */
const SH_MAP=2048;                 // 影マップの一辺[px]
const SH_MIN=180, SH_MAX=600;      // 影を写す半径の下限・上限[m]
                                   // (上限は影テクセルが0.6mを超えない大きさ)
const SUN_DIST=1400;               // 注視点から光源までの距離[m]
const dot3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const norm3=v=>{const l=Math.hypot(v.x,v.y,v.z);return {x:v.x/l,y:v.y/l,z:v.z/l};};
const cross3=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
/* 太陽の方向と、そこから作る影カメラの正規直交基底。
   時刻を変えられるように let にし、setSunDir() で一括して作り直す
   (基底を作り直さないと、影のテクセル格子が古い向きのままになる)。 */
let SUN_V={x:2400,y:3200,z:1600};                          // 太陽の方向(位置ベクトル)
let SUN_N, SUN_F, SUN_RT, SUN_UP;
function setSunDir(v){
  SUN_V=v;
  SUN_N=norm3(SUN_V);                                      // 注視点→光源(単位)
  SUN_F={x:-SUN_N.x,y:-SUN_N.y,z:-SUN_N.z};                // 光源→注視点(視線)
  SUN_RT=norm3(cross3(SUN_F,{x:0,y:1,z:0}));               // 影カメラの横軸
  SUN_UP=norm3(cross3(SUN_RT,SUN_F));                      // 影カメラの縦軸
}
setSunDir(SUN_V);
sun.castShadow=true;
sun.shadow.mapSize.set(SH_MAP,SH_MAP);
sun.shadow.camera.near=SUN_DIST-SH_MAX-120;
sun.shadow.camera.far =SUN_DIST+SH_MAX+120;
sun.shadow.bias=-0.0004;
sun.shadow.normalBias=0.5;         // 斜面のアクネ(縞)対策。桁の側面で出やすい
scene.add(sun.target);
let shadowR=SH_MIN;
// 影を写す半径[m]。視点が離れるほど広く取る(引いたときに影が途切れないように)
function shadowRadius(dist){return clamp(dist*0.55,SH_MIN,SH_MAX);}
/* 注視点(fx,fz)を中心に影の範囲を置き直す。太陽の"向き"は変えない
   (向きが変わると視点を動かすたびに影が回ってしまう)。 */
function sunFollow(fx,fz,dist){
  const R=shadowRadius(dist);
  if(R!==shadowR){
    shadowR=R;
    const c=sun.shadow.camera;
    c.left=-R;c.right=R;c.top=R;c.bottom=-R;c.updateProjectionMatrix();
  }
  const texel=2*shadowR/SH_MAP;                 // 影マップ1画素の実寸[m]
  const p={x:fx,y:0,z:fz};
  const a=Math.round(dot3(p,SUN_RT)/texel)*texel;   // 光源座標系で格子に載せる
  const b=Math.round(dot3(p,SUN_UP)/texel)*texel;
  const c=dot3(p,SUN_F);
  const t={x:SUN_RT.x*a+SUN_UP.x*b+SUN_F.x*c,
           y:SUN_RT.y*a+SUN_UP.y*b+SUN_F.y*c,
           z:SUN_RT.z*a+SUN_UP.z*b+SUN_F.z*c};
  sun.target.position.set(t.x,t.y,t.z);
  sun.target.updateMatrixWorld();
  sun.position.set(t.x+SUN_N.x*SUN_DIST, t.y+SUN_N.y*SUN_DIST, t.z+SUN_N.z*SUN_DIST);
}

/* 材質は必ずこの工場を通す(色を素通しで書くとその面だけ不自然に明るくなる)。
   色を持つテクスチャも canvasTex を通す。 */
function mkMat(kind,o){
  const q=Object.assign({},o);
  for(const k of ['color','emissive','specular']) if(typeof q[k]==='number') q[k]=srgb(q[k]);
  return new THREE[kind](q);
}
function canvasTex(cv){
  const t=new THREE.CanvasTexture(cv);
  t.encoding=THREE.sRGBEncoding;    // 色を持つテクスチャはsRGBとして読む
  return t;
}
/* ---- 空のテクスチャ(正距円筒) ------------------------------------------------
   天頂→地平→地平下のグラデーションに、太陽の方向のほのかな暖色を重ねる。
   球面のUVに合わせて画素ごとに向きを求める(SphereGeometry の並びに一致):
     行 yy=0 が天頂、yy=h が天底。列 xx が方位角。
   同じテクスチャを空ドームの map と、レール等の envMap の両方に使う
   (mapping は envMap のときだけ効くので、map として使っても支障がない)。   */
const SKY_TEX_W=512, SKY_TEX_H=256;
/* 空の色(SKY)と太陽の向き(SUN_N)から、既存のキャンバスへ描き直す。
   撮影モードが時刻を切り替えるたびに呼ぶので、キャンバスは作り直さない
   (作り直すとテクスチャの参照先が変わり、貼り替えの漏れが起きる)。 */
const SKY_CV=document.createElement('canvas');
SKY_CV.width=SKY_TEX_W;SKY_CV.height=SKY_TEX_H;
function skyPaint(cv){
  const ctx=cv.getContext('2d'), img=ctx.createImageData(SKY_TEX_W,SKY_TEX_H), d=img.data;
  const C=h=>[(h>>16)&255,(h>>8)&255,h&255];
  const top=C(SKY.TOP), hor=C(SKY.HOR), bot=C(SKY.BOT), sunc=C(SKY.SUN);
  for(let yy=0;yy<SKY_TEX_H;yy++){
    const th=(yy+0.5)/SKY_TEX_H*Math.PI;          // 天頂からの角度
    const cy=Math.cos(th), sy=Math.sin(th);
    // 地平(cy=0)を境に、上は天頂色へ・下は地平下色へ寄せる
    const t=(cy>=0)?Math.pow(cy,0.55):Math.pow(-cy,0.75);
    const a=(cy>=0)?top:bot;
    for(let xx=0;xx<SKY_TEX_W;xx++){
      const ph=(xx+0.5)/SKY_TEX_W*Math.PI*2;
      const dx=-Math.cos(ph)*sy, dy=cy, dz=Math.sin(ph)*sy;
      const g=Math.pow(Math.max(0,dx*SUN_N.x+dy*SUN_N.y+dz*SUN_N.z),7)*0.85;   // 太陽まわりの輝き
      const i=(yy*SKY_TEX_W+xx)*4;
      for(let k=0;k<3;k++){
        const base=hor[k]+(a[k]-hor[k])*t;
        d[i+k]=Math.min(255,base+(sunc[k]-base)*g);
      }
      d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}
const M=(c,o={})=>mkMat('MeshLambertMaterial',Object.assign({color:c},o));
skyPaint(SKY_CV);
const SKY_TEX=canvasTex(SKY_CV);
SKY_TEX.mapping=THREE.EquirectangularReflectionMapping;   // envMap として使うため
/* 空ドーム。カメラの遠方面(30000)の内側・場面(約11000)の外側に置く。
   ・フォグは掛けない(掛けると空まで一様に塗り潰される)
   ・トーンマッピングは地物と同じに通す(通さないと地平でフォグと色が合わない)
   ・影の対象から外す(裏面の巨大な球なので、入れると世界中が影になる) */
/* Standard材質の映り込みに使う環境マップ。生の正距円筒のままでは粗さを
   反映できないので、PMREM(粗さ別にぼかした版)へ変換して scene.environment に置く。
   ※ Lambert/Phong は scene.environment を見ないので、そちらは material.envMap を使う。 */
function makeEnv(){
  const g=new THREE.PMREMGenerator(renderer);
  g.compileEquirectangularShader();
  const t=g.fromEquirectangular(SKY_TEX).texture;
  g.dispose();
  return t;
}
let ENV_TEX=makeEnv();
scene.environment=ENV_TEX;
// 空の色と太陽の向きの組。同じなら rebuildSky() は何もしない(読み込みのとき、既定の空・時刻・天候で同じ空を3回作っていた。
// 環境マップ(PMREM)の作り直しは1回 0.3〜0.5秒)
const skySig=()=>[SKY.TOP,SKY.HOR,SKY.BOT,SKY.SUN,SUN_N.x,SUN_N.y,SUN_N.z].join();
let SKY_SIG=skySig();
/* 空の色・太陽の向きを変えた後に呼ぶ。キャンバスを描き直して空ドームの map を
   更新し、環境マップ(PMREM)も作り直す。古い方は必ず dispose する
   (時刻を切り替えるたびに GPU のテクスチャが積み上がる)。 */
function rebuildSky(){
  const sg=skySig(); if(sg===SKY_SIG) return;
  SKY_SIG=sg;
  skyPaint(SKY_CV);
  SKY_TEX.needsUpdate=true;
  const old=ENV_TEX;
  ENV_TEX=makeEnv();
  scene.environment=ENV_TEX;
  if(old&&old.dispose)old.dispose();
}
/* 物理ベース(Standard)の材質。金属・ガラス・水面など「空を映すと効く」ものに使う。

/* グループ対応ビルダ(全ジオメトリを平面線形に追従させる) */
let CUR=null;

function strip(x0,x1,step,fA,fB,mat){
  const xs=[];for(let x=x0;x<x1;x+=step)xs.push(x);xs.push(x1);
  const n=xs.length,pos=new Float32Array(n*2*3),idx=[];
  xs.forEach((x,i)=>{
    const a=fA(x),b=fB(x),pa=frame(a[0],a[2]),pb=frame(b[0],b[2]);
    pos[i*6]=pa.x;pos[i*6+1]=a[1];pos[i*6+2]=pa.z;
    pos[i*6+3]=pb.x;pos[i*6+4]=b[1];pos[i*6+5]=pb.z;
    if(i<n-1){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  return add(new THREE.Mesh(g,mat));
}
function box(w,h,d,mat,s,y,off,ry2){
  const p=frame(s,off);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(p.x,y,p.z);m.rotation.y=-p.a+(ry2||0);
  return add(m);
}
function cyl(r,h,mat,s,y,off,seg){
  const p=frame(s,off);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg||24),mat);
  m.position.set(p.x,y,p.z);return add(m);
}

/* ============ 3b. 結合ジオメトリ(駅・高架橋の細部を軽く描く) ============
   【設計方針】駅と高架橋の細部(柱・梁・ルーバー・ホームドアの戸袋・手すり…)は数が多い。
   1個ずつ Mesh にすると描画の呼び出しが部品の数だけ増える(2026-10 実測:ホームドアの
   固定部だけで 5,400回/画=運転モードの描画の7割)。そこで部品を**材質ごとに1本の
   バッファへ積み**、区画(駅1つ・高架の240m)ごとに1つの Mesh にして出す。
   色の違う部品は頂点カラーで塗り分けるので、何十色あっても描画は材質の数だけで済む。
   ・頂点は frame(s,off) で置く(線形を直せば追従する)
   ・面の向きは「外向きの目安」から作る側で決める(巻き順の取り違えで面が裏返る事故を防ぐ)
   ・法線は面ごと(平らな面をくっきり陰影づける)
   ・区画は視錐台カリングの単位でもあり、細部は LOD(近くだけ表示)の単位でもある
   ・tag を付けた部品は登録簿 STRUCT に (s,off,y) の範囲で残す(検証が建築限界を測る) */
const STRUCT=[];                                  // 構造物の部品の登録簿(検証用)
const MG_STAT={meshes:0,tris:0,verts:0};          // 結合ジオメトリの総量(負荷の確認用)
const _mgC=new THREE.Color();
const v3sc=(v,k)=>[v[0]*k,v[1]*k,v[2]*k];
function MG(){
  const B=new Map();                              // 材質 → 頂点バッファ
  let cr=1,cg=1,cb=1;                             // いまの色(リニア)
  const bx={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9,z0:1e9,z1:-1e9};
  const self={};
  function buf(mat){
    let q=B.get(mat);
    if(!q){q={p:[],n:[],c:[],u:[],i:[],nv:0};B.set(mat,q);}
    return q;
  }
  /* 平らな凸多角形を1枚積む(ワールド座標)。out=外向きの目安。法線がこれと逆なら
     頂点の順を逆にする。法線は Newell 法(3点が一直線に並ぶ四角形でも正しく出る)。 */
  function face(mat,P,out,UV){
    let nx=0,ny=0,nz=0;
    for(let k=0;k<P.length;k++){
      const a=P[k],b=P[(k+1)%P.length];
      nx+=(a[1]-b[1])*(a[2]+b[2]); ny+=(a[2]-b[2])*(a[0]+b[0]); nz+=(a[0]-b[0])*(a[1]+b[1]);
    }
    const l=Math.hypot(nx,ny,nz);
    if(l<1e-10) return;                           // 面積0(潰れた面)は積まない
    nx/=l;ny/=l;nz/=l;
    if(out&&nx*out[0]+ny*out[1]+nz*out[2]<0){
      P=P.slice().reverse(); if(UV)UV=UV.slice().reverse(); nx=-nx;ny=-ny;nz=-nz;
    }
    const q=buf(mat), v0=q.nv;
    for(let k=0;k<P.length;k++){
      const p=P[k];
      q.p.push(p[0],p[1],p[2]); q.n.push(nx,ny,nz); q.c.push(cr,cg,cb);
      if(UV) q.u.push(UV[k][0],UV[k][1]);
      if(p[0]<bx.x0)bx.x0=p[0]; if(p[0]>bx.x1)bx.x1=p[0];
      if(p[1]<bx.y0)bx.y0=p[1]; if(p[1]>bx.y1)bx.y1=p[1];
      if(p[2]<bx.z0)bx.z0=p[2]; if(p[2]>bx.z1)bx.z1=p[2];
    }
    q.nv+=P.length;
    for(let k=1;k<P.length-1;k++) q.i.push(v0,v0+k,v0+k+1);
  }
  self.face=function(mat,P,out,UV){face(mat,P,out,UV);return self;};
  // 色(sRGBの16進)。以後に積む面に効く
  self.col=function(hex){setSrgb(_mgC,hex);cr=_mgC.r;cg=_mgC.g;cb=_mgC.b;return self;};
  // 線路の座標系の単位ベクトル:t=線路方向(sが増える向き)/n=+off(北)/上は(0,1,0)
  function axes(s,off,yaw){
    const f=frame(s,off), a=f.a+(yaw||0);
    return {f:f, t:[Math.cos(a),0,Math.sin(a)], n:[-Math.sin(a),0,Math.cos(a)], a0:f.a};
  }
  self.axes=axes;
  /* 直方体。c=中心(ワールド)、X/Y/Z=半辺ベクトル。skip に '+x' '-y' などを入れた面は省く
     (地面に接する底面など、見えない面を作らない)。 */
  function boxA(mat,c,X,Y,Z,skip){
    const v=(i,j,k)=>[c[0]+X[0]*i+Y[0]*j+Z[0]*k, c[1]+X[1]*i+Y[1]*j+Z[1]*k, c[2]+X[2]*i+Y[2]*j+Z[2]*k];
    const S=skip||'';
    if(S.indexOf('+x')<0) face(mat,[v(1,-1,-1),v(1,1,-1),v(1,1,1),v(1,-1,1)],X);
    if(S.indexOf('-x')<0) face(mat,[v(-1,-1,-1),v(-1,-1,1),v(-1,1,1),v(-1,1,-1)],v3sc(X,-1));
    if(S.indexOf('+y')<0) face(mat,[v(-1,1,-1),v(-1,1,1),v(1,1,1),v(1,1,-1)],Y);
    if(S.indexOf('-y')<0) face(mat,[v(-1,-1,-1),v(1,-1,-1),v(1,-1,1),v(-1,-1,1)],v3sc(Y,-1));
    if(S.indexOf('+z')<0) face(mat,[v(-1,-1,1),v(1,-1,1),v(1,1,1),v(-1,1,1)],Z);
    if(S.indexOf('-z')<0) face(mat,[v(-1,-1,-1),v(-1,1,-1),v(1,1,-1),v(1,-1,-1)],v3sc(Z,-1));
  }
  self.boxA=function(mat,c,X,Y,Z,skip){boxA(mat,c,X,Y,Z,skip);return self;};
  function reg(tag,s,off,y0,y1,cs){        // 登録簿へ (s,off,y) の範囲を残す
    let s0=1e9,s1=-1e9,o0=1e9,o1=-1e9;
    for(const c of cs){s0=Math.min(s0,s+c[0]);s1=Math.max(s1,s+c[0]);o0=Math.min(o0,off+c[1]);o1=Math.max(o1,off+c[1]);}
    STRUCT.push({tag:tag,s0:s0,s1:s1,o0:o0,o1:o1,y0:y0,y1:y1});
  }
  /* 線路の座標で置く直方体。中心(s,off)、高さ y0〜y1、長さ L(線路方向)・幅 W(直角方向)。
     o.yaw=平面内の回転[rad] / o.pitch=線路方向の傾き[rad] / o.skip / o.tag(登録簿へ) */
  self.box=function(mat,s,off,y0,y1,L,W,o){
    o=o||{};
    const A=axes(s,off,o.yaw), h=(y1-y0)/2;
    let T=A.t, U=[0,1,0];
    if(o.pitch){const c=Math.cos(o.pitch),sn=Math.sin(o.pitch);

    boxA(mat,[A.f.x,(y0+y1)/2,A.f.z],v3sc(T,L/2),v3sc(U,h),v3sc(A.n,W/2),o.skip);
    if(o.tag){
      const cy=Math.cos(o.yaw||0), sy=Math.sin(o.yaw||0), cs=[];
      for(const i of[-1,1])for(const k of[-1,1])cs.push([i*L/2*cy-k*W/2*sy, i*L/2*sy+k*W/2*cy]);
      const dy=Math.abs(Math.sin(o.pitch||0))*L/2;
      reg(o.tag,s,off,y0-dy,y1+dy,cs);
    }
    return self;
  };
  /* 縦の角柱(円柱の近似)。seg 角形、半径 r(または [下端,上端] で先細り)、y0〜y1。
     o.cap で上面、o.tag で登録 */
  self.cyl=function(mat,s,off,y0,y1,r,seg,o){
    o=o||{}; seg=seg||8;
    const r0=Array.isArray(r)?r[0]:r, r1=Array.isArray(r)?r[1]:r;
    const A=axes(s,off,0), P0=[],P1=[];
    for(let k=0;k<seg;k++){
      const th=(k+0.5)/seg*Math.PI*2, c=Math.cos(th), sn=Math.sin(th);
      const ux=A.t[0]*c+A.n[0]*sn, uz=A.t[2]*c+A.n[2]*sn;
      P0.push([A.f.x+ux*r0,y0,A.f.z+uz*r0]);P1.push([A.f.x+ux*r1,y1,A.f.z+uz*r1]);
    }
    for(let k=0;k<seg;k++){
      const j=(k+1)%seg, mx=(P0[k][0]+P0[j][0])/2-A.f.x, mz=(P0[k][2]+P0[j][2])/2-A.f.z;
      face(mat,[P0[k],P0[j],P1[j],P1[k]],[mx,0,mz]);
    }
    if(o.cap) face(mat,P1.slice(),[0,1,0]);
    if(o.tag){const rr=Math.max(r0,r1); reg(o.tag,s,off,y0,y1,[[-rr,-rr],[rr,rr]]);}
    return self;
  };
  /* 任意の向きの角管(ワールド座標の2点 p0→p1、半径 r、seg 角形)。手すり・排水管・斜材 */
  self.tube=function(mat,p0,p1,r,seg){
    seg=seg||6;
    const d=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], L=Math.hypot(d[0],d[1],d[2]);
    if(L<1e-6) return self;
    const w=[d[0]/L,d[1]/L,d[2]/L];
    const ref=Math.abs(w[1])<0.9?[0,1,0]:[1,0,0];
    let u=[w[1]*ref[2]-w[2]*ref[1], w[2]*ref[0]-w[0]*ref[2], w[0]*ref[1]-w[1]*ref[0]];
    const ul=Math.hypot(u[0],u[1],u[2]); u=[u[0]/ul,u[1]/ul,u[2]/ul];
    const v=[w[1]*u[2]-w[2]*u[1], w[2]*u[0]-w[0]*u[2], w[0]*u[1]-w[1]*u[0]];
    const ring=(p)=>{const R=[];for(let k=0;k<seg;k++){const th=k/seg*Math.PI*2,c=Math.cos(th)*r,s=Math.sin(th)*r;
      R.push([p[0]+u[0]*c+v[0]*s,p[1]+u[1]*c+v[1]*s,p[2]+u[2]*c+v[2]*s]);}return R;};
    const R0=ring(p0),R1=ring(p1);
    for(let k=0;k<seg;k++){
      const j=(k+1)%seg, th=(k+0.5)/seg*Math.PI*2;
      face(mat,[R0[k],R0[j],R1[j],R1[k]],[u[0]*Math.cos(th)+v[0]*Math.sin(th),u[1]*Math.cos(th)+v[1]*Math.sin(th),u[2]*Math.cos(th)+v[2]*Math.sin(th)]);
    }

  };
  /* 断面 sect(s)=[[off,y],...] を s0〜s1 に沿って掃引する(断面の点数は s によらず一定)。
     o.closed … 閉じた断面。外向きは断面の面積の符号から自動で決まる
     o.side   … 開いた断面の外側(+1=点の並びの進む向きの右手側 / -1=左手側)
     o.col / o.cols[i] … 色(区間 i=点iから点i+1)
     o.caps   … 両端に蓋(凸の断面だけ)
     o.uv(s,点) … テクスチャ座標(レンガ等の模様を貼るとき)
     o.step(既定2m)で標本化し、誤差 o.tol(既定2cm)以内なら間引く。
     直線は粗く、曲線・勾配・幅の変わる所だけ細かくなる(三角形を増やさない)。 */
  self.loft=function(mat,s0,s1,sect,o){
    o=o||{};
    if(s1-s0<0.01) return self;
    const step=o.step||2, tol=o.tol||0.02, maxL=o.maxL||48;
    const S=[]; for(let s=s0;s<s1-1e-6;s+=step) S.push(s); S.push(s1);
    const SC=S.map(s=>sect(s));
    const W=S.map((s,k)=>SC[k].map(q=>{const f=frame(s,q[0]);return [f.x,q[1],f.z];}));
    const keep=[0]; let a=0;
    for(let j=2;j<S.length;j++){
      let bad=S[j]-S[a]>maxL;
      for(let k=a+1;k<j&&!bad;k++){
        const u=(S[k]-S[a])/(S[j]-S[a]);
        for(let m=0;m<W[k].length;m++){
          const p=W[a][m],q=W[j][m],r=W[k][m];
          const dx=p[0]+(q[0]-p[0])*u-r[0], dy=p[1]+(q[1]-p[1])*u-r[1], dz=p[2]+(q[2]-p[2])*u-r[2];
          if(dx*dx+dy*dy+dz*dz>tol*tol){bad=true;break;}
        }
      }
      if(bad){keep.push(j-1);a=j-1;}
    }
    if(keep[keep.length-1]!==S.length-1) keep.push(S.length-1);
    const n=SC[0].length, segs=o.closed?n:n-1;
    let ar=0; for(const Q of SC){let a2=0; for(let i=0;i<n;i++){const p=Q[i],q=Q[(i+1)%n];a2+=p[0]*q[1]-q[0]*p[1];} if(Math.abs(a2)>Math.abs(ar)) ar=a2;}
    const ori=o.closed?(ar>0?1:-1):(o.side||1);
    if(o.col!==undefined) self.col(o.col);
    for(let kk=0;kk<keep.length-1;kk++){
      const k0=keep[kk],k1=keep[kk+1], A=axes(S[k0],0);
      for(let i=0;i<segs;i++){
        const j=(i+1)%n, p=SC[k0][i], q=SC[k0][j];
        // 外向き(断面の面内):点の並びの右手側=(dy,-dx)。反時計回りの閉多角形なら外側
        const dOff=ori*(q[1]-p[1]), dY=-ori*(q[0]-p[0]);
        if(o.cols) self.col(o.cols[i]);
        const P=[W[k0][i],W[k1][i],W[k1][j],W[k0][j]];
        const UV=o.uv?[o.uv(S[k0],SC[k0][i]),o.uv(S[k1],SC[k1][i]),o.uv(S[k1],SC[k1][j]),o.uv(S[k0],SC[k0][j])]:null;
        face(mat,P,[A.n[0]*dOff,dY,A.n[2]*dOff],UV);
      }
    }
    if(o.caps){
      const A0=axes(s0,0),A1=axes(s1,0);
      face(mat,W[0].slice(),v3sc(A0.t,-1));
      face(mat,W[W.length-1].slice(),A1.t);
    }
    /* 登録簿へは 6m 以下の区間ごとに残す。面は標本の間を直線で結んだものなので、
       区間の両端の断面を同じく直線で補間して範囲を取れば、幅の変わる所でも過大にならない。
       横に大きく動く所(待避線の急な振り分け・ホームの端で曲がる縁)は、1区間の横の動きが 0.08m 以下になるまで細かく切る

const LODS=[];

function lodAdd(obj,b,dist,dmin){     // dmin:この距離より近いと描かない(近くは別の細かい形を描く物)
  const x=(b.x0+b.x1)/2, y=(b.y0+b.y1)/2, z=(b.z0+b.z1)/2;
  const r=Math.hypot(b.x1-b.x0,b.y1-b.y0,b.z1-b.z0)/2;

function lodStruct(){
  const p=camera.position;
  for(const L of LODS){

    const dd=Math.hypot(p.x-L.x,p.y-L.y,p.z-L.z)-L.r, v=dd<L.d*LOD_STRUCT&&!(L.dmin>0&&dd<L.dmin*LOD_STRUCT);

  if(typeof flowDraw==='function') flowDraw();    // 乗り降りの人(近い人だけ)

    for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){if(S[j*NX+i]!==S[j*NX+i]) continue; let a=0,w=0;
      for(let k=-KR;k<=KR;k++){const ii=hor?i+k:i, jj=hor?j:j+k; if(ii<0||jj<0||ii>=NX||jj>=NZ) continue; const v=S[jj*NX+ii]; if(v!==v) continue; a+=v*KW[k+KR]; w+=KW[k+KR];}

  for(let j=0;j<=TER.GZ;j++)for(let i=0;i<=TER.GX;i++){

  const base=(x,z)=>{const q=TER.prj(x,z), v=TER.wFar(q.s,q.off)*(TER.gsAt(q.s)-Y_TP); return Math.abs(v)<0.003?0:v;};
  const FORCE=new Uint8Array(TER.GX*TER.GZ);

  for(let j=0;j<TER.GZ;j++)for(let i=0;i<TER.GX;i++){

}
// 格子の面の高さ(地表の網と同じ式)。格子の外・地形が無いときは 0
function terH(x,z){

{

  const P=(s,o,y)=>{const f=frame(s,o);return [f.x,y,f.z];};
  for(const sg of[-1,1]){

      C.mg.loft(VD,a,b,s=>{const E=cutHalf(s,sg), f=floorY(s), yt=cutWallTop(s);
        return [[sg*(E-T),f],[sg*(E-T),f+0.6],[sg*(E-T),yt],[sg*(E+O),yt],[sg*(E+O),f]];},

        return [[so,f],[so+0.45,f],[n-0.45,f],[n,f]];},{side:-1,cols:[0x6c7074,0x8d9195,0x6c7074],tag:'掘割の底'});

  {const C=chunkOf(CUT_END), f=floorY(CUT_END), A=C.mg.axes(CUT_END,0);
   C.mg.col(0x3c4044).face(VD,[P(CUT_END,-(cutHalf(CUT_END,-1)-T),f),P(CUT_END,cutHalf(CUT_END,1)-T,f),
     P(CUT_END,cutHalf(CUT_END,1)-T,DECK_BOT),P(CUT_END,-(cutHalf(CUT_END,-1)-T),DECK_BOT)],v3sc(A.t,-1));}

  for(const D of CUT_DECKS){

    const C=chunkOf((D.aS+D.bN)/2), top=D.top-0.03, bot=D.bot;

const TIE_LOD=280;                 // まくらぎを描く距離[m](それより遠くでは1画素未満)。形は6a章
function viaFlush(){
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),v=new THREE.Vector3(),one=new THREE.Vector3(1,1,1);
  for(const C of VIA_CH){
    const g=new THREE.Group(), d=new THREE.Group();
    const b=C.md.bounds(), bb={x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1,z0:b.z0,z1:b.z1};
    C.mg.flush(g); C.md.flush(d);
    // まくらぎ([s,off,railY,長さの倍率,向き])と締結装置([s,off,railY,向き])のインスタンス。
    // 締結装置は s の順に FAST_BLK ごとのまとまりに分け、まとまりごとに近くだけ描く
    for(const [list,geo,mat,dist,blk] of[[C.ties,TIE_GEO,MAT.tie,TIE_LOD,1e9],
        [C.fast2,FAST2_GEO,MAT.fast,TRK.FAST_LOD,TRK.FAST_BLK],[C.fast1,FAST1_GEO,MAT.fast,TRK.FAST_LOD,TRK.FAST_BLK]]){
      for(let i0=0;i0<list.length;){
        let i1=i0; while(i1<list.length&&list[i1][0]-list[i0][0]<blk) i1++;
        const part=list.slice(i0,i1), im=new THREE.InstancedMesh(geo,mat,part.length), sc=new THREE.Vector3();
        const bx={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9,z0:1e9,z1:-1e9};
        part.forEach(function(t,i){
          const f=frame(t[0],t[1]), long=t.length>4; e.set(0,-(f.a+(long?t[4]:t[3])),0); q.setFromEuler(e);
          v.set(f.x,t[2]+TRK.TIE_Y,f.z); sc.set(1,1,long?t[3]:1); m4.compose(v,q,sc); im.setMatrixAt(i,m4);
          bx.x0=Math.min(bx.x0,f.x-2);bx.x1=Math.max(bx.x1,f.x+2);bx.y0=Math.min(bx.y0,v.y);bx.y1=Math.max(bx.y1,v.y);bx.z0=Math.min(bx.z0,f.z-2);bx.z1=Math.max(bx.z1,f.z+2);
        });
        im.instanceMatrix.needsUpdate=true;
        const tg=new THREE.Group(); tg.add(im); d.add(tg);
        lodAdd(tg,blk<1e9?bx:bb,dist);
        i0=i1;
      }
    }
    // 電線(6b章):き電ちょう架線・トロリ線・架空地線は常時、ハンガと受けは近くだけ
    if(C.wl.length) g.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',
      new THREE.Float32BufferAttribute(C.wl,3)),wireMat));
    if(C.wd.length) d.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',
      new THREE.Float32BufferAttribute(C.wd,3)),wireMat));
    g.add(d); scene.add(g);
    g.name='高架橋 '+C.s0.toFixed(0); d.name='高架橋の細部 '+C.s0.toFixed(0);
    lodAdd(d,bb,VIA.LOD);
  }
}

/* ============ 6. 軌道・架線・交差鉄道・地上線/仮線 ============ */
// 敷設した軌道と、張った架線の登録簿。
// 「線路はあるのに架線が無い」「架線が線路の真上に無い」を構造的に防ぐため、
// 軌道は layTrack() で登録だけしておき、全部が出揃ってから buildTrack() が
// 軌道と架線を必ず対にして作る(出揃うまで、どの線がどこで分かれるか=分岐器が決まらない)。
const TRACKS=[], WIRES=[];   // 敷設した線路・架線の登録簿(検証用)
function layTrack(id,x0,x1,zf){
  TRACKS.push({id:id,x0:Math.min(x0,x1),x1:Math.max(x0,x1),zf:zf});
  return id;
}

   エンジンの「下り」= s の増す向き(北行き)=京急の上り(泉岳寺方面)。zDown/zUp の名前はエンジンのまま(+s 向きの列車=−off 側=西)。 */

      const tr=2.0+d.a*plateau(x,d.c,d.h,d.t);

/* 分岐する線(副本線・停車線・留置線・渡り線)が本線と同じ位置に重ねて敷かれている所を落とす。
   重なったままだと同じ場所に線路と架線が二重にでき(「不要な線」)、分岐器の位置も決まらない。
   B の端が A の上にあり、A がその端から B の内側へも続く(=重なっている)とき、
   B を「A から離れ始める所」まで縮める。本線の継ぎ目(端どうしの接続)は A が内側へ続かないので対象外。 */
function trimTracks(){
  const EPS=0.005;
  for(const B of TRACKS) for(const A of TRACKS){
    if(A===B) continue;
    for(const end of[0,1]){
      const e=end?B.x1:B.x0, f=end?-1:1;            // f=端から線路の内側へ向かう向き
      if(!(e>A.x0-0.01&&e<A.x1+0.01)) continue;
      if(Math.abs(A.zf(e)-B.zf(e))>EPS) continue;
      if(!(f>0?A.x1>e+1:A.x0<e-1)) continue;
      let s=e;
      while(f*((end?B.x0:B.x1)-s)>1&&Math.abs(A.zf(s+f*0.25)-B.zf(s+f*0.25))<=EPS) s+=f*0.25;

    }
  }

  let m=0;
  for(let u=0.1;u<0.95;u+=0.1){

    if(Math.abs(e)>Math.abs(m)) m=e;

function trackTopo(){
  for(const B of TRACKS) for(const end of[0,1]){
    const e=end?B.x1:B.x0, f=end?-1:1;
    const A=TRACKS.find(A=>A!==B&&e>A.x0+1&&e<A.x1-1&&Math.abs(A.zf(e)-B.zf(e))<0.02);
    if(!A) continue;

    for(let s=e;f*(s-e)<80&&s>=B.x0&&s<=B.x1;s+=f*0.05){ if(full===null&&D(s)>=RAIL_W) full=s; if(D(s)>=TRK.HEEL){heel=s;break;} }

  }

    const A=TRACKS[i], B=TRACKS[j], lo=Math.max(A.x0,B.x0), hi=Math.min(A.x1,B.x1);
    if(hi-lo<1) continue;

  const t=(ins(sf-1)&&!ins(sf+1))?-1:(ins(sf+1)&&!ins(sf-1))?1:0;

   7章(駅の構造)と9章(ホームドア)が積み、9章の最後に stFlush() でまとめて Mesh にする。 */
const LOD_ST=520;                    // 駅の細部を描く距離[m]
const STG=STA.map(st=>({st:st, g:new THREE.Group(), d:new THREE.Group(), mg:MG(), md:MG()}));
function stFlush(){
  for(const S of STG){
    const b=S.md.bounds(), bb={x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1,z0:b.z0,z1:b.z1};
    S.mg.flush(S.g); S.md.flush(S.d);
    S.g.add(S.d); scene.add(S.g);
    S.g.name='駅 '+S.st.n; S.d.name='駅の細部 '+S.st.n;
    lodAdd(S.d,bb,LOD_ST);
  }
}
function tag(t,s,y,off,rd){const sp=textSprite(t,null,false);sp.scale.set(96,19,1);
  const p=frame(s,off);sp.position.set(p.x,y,p.z);
  if(rd){sp.visible=false;xingLabels.push(sp);}   // 道路系=「踏切名」トグルに連動
  else tagLabels.push(sp);
  return sp;}
function cbox(x0,x1,offC,hw,y0,y1,mat,step){   // 曲線追従の直方体(荒いポリゴン対策)
  step=step||14;
  strip(x0,x1,step,x=>[x,y1,offC-hw],x=>[x,y1,offC+hw],mat);   // 上面
  // 下面。上面と逆の巻き順(fA/fBを入れ替える)にして法線を下へ向ける。
  // これが無いと、駅の上屋を下から見たときに何も無いように見える(運転モードで発覚)。
  strip(x0,x1,step,x=>[x,y0,offC+hw],x=>[x,y0,offC-hw],mat);
  strip(x0,x1,step,x=>[x,y0,offC-hw],x=>[x,y1,offC-hw],mat);
  strip(x0,x1,step,x=>[x,y1,offC+hw],x=>[x,y0,offC+hw],mat);
  box(.3,y1-y0,hw*2,mat,x0+.15,(y0+y1)/2,offC);
  box(.3,y1-y0,hw*2,mat,x1-.15,(y0+y1)/2,offC);
}

// こま k の UV(左下・右下・右上・左上)
function signUV(k){
  const u0=(k%SIGN_COLS)/SIGN_COLS, u1=u0+1/SIGN_COLS;
  const r=Math.floor(k/SIGN_COLS), v1=1-r/SIGN_ROWS, v0=v1-1/SIGN_ROWS;
  return [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
}
/* 看板を1枚貼る。中心(s,off)・幅 w・高さ y0〜y1、向き face=+1(北=+off向き)/-1(南)/
   'e'(新宿方=-s向き)/'w'(+s向き)。見る人の左に UV の左端が来るように頂点を並べる。 */
const SIGNS=[];                      // 看板の登録簿(検証が向きと駅名の左右を確かめる)
function signQuad(Sx,k,s,off,y0,y1,w,face){
  SIGNS.push({k:k,s:s,off:off,y0:y0,y1:y1,w:w,face:face});
  const A=Sx.axes(s,off), c=[A.f.x,0,A.f.z];
  let L,R,out;                                 // 見る人から見た左端・右端の水平方向
  if(face===1||face===-1){
    const f=face;                              // 北向きの面を見る人は南を向く→左は新宿方(-s)
    L=v3sc(A.t,-f*w/2); R=v3sc(A.t,f*w/2); out=v3sc(A.n,f);
  }else{
    const f=(face==='w')?1:-1;                 // +s向きの面を見る人は -s を向く→左は +off 側
    L=v3sc(A.n,f*w/2); R=v3sc(A.n,-f*w/2); out=v3sc(A.t,f);
  }
  const P=(h,y)=>[c[0]+h[0],y,c[2]+h[2]];
  Sx.face(MAT.sign,[P(L,y0),P(R,y0),P(R,y1),P(L,y1)],out,signUV(k));
}
/* ---- 案内の画像(階段口の出口・番線案内、発車標、自動販売機の前面)。1枚のキャンバスにまとめる -------
   こま 512×128 を 4列×16行(2048×2048)。2こま幅(1024×128)も使う(島式の階段口の出口)。同じ絵は使い回す。
   どれも自ら光る面(内照の看板・LED・自販機の照明)なので、照明を受けない材質で描く(夜も同じ明るさ)。
   発車標は時刻(画面のメニュー・撮影の時刻)で書き直す。配色(調べた範囲。2026-10):
     出口 … 黄地に黒字(鉄道駅の案内の共通の約束)
     番線案内 … 白地に黒字、番線は黒地に白抜きの数字、方面は京王の駅の案内と同じ書き方
       (下り=京王八王子・高尾山口・橋本方面/上り=新宿・本八幡方面。笹塚は3番線=新宿・4番線=新線新宿・本八幡)
     発車標 … 黒地の LED。種別の色は京王の路線図の配色(特急=赤・急行=緑・区間急行=黄緑・各停=白) */
const PIDS_CW=512, PIDS_CH=128, PIDS_COLS=4, PIDS_ROWS=16;
const PIDS_CV=document.createElement('canvas');
PIDS_CV.width=PIDS_CW*PIDS_COLS; PIDS_CV.height=PIDS_CH*PIDS_ROWS;
const PIDS={used:0, memo:new Map(), deps:[]};
const PIDS_F='"Hiragino Sans","Yu Gothic UI","Noto Sans JP",IPAGothic,sans-serif';
const PIDS_TEX=canvasTex(PIDS_CV);
MAT.pids=mkMat('MeshBasicMaterial',{map:PIDS_TEX});
const GUIDES=[];                     // 案内の登録簿(検証が向き・番線の左右・発車標の位置を確かめる)
function pidsXY(r){return [(r.k%PIDS_COLS)*PIDS_CW, Math.floor(r.k/PIDS_COLS)*PIDS_CH];}
function pidsPaint(r,draw){
  const c=PIDS_CV.getContext('2d'), q=pidsXY(r);
  c.save(); c.beginPath(); c.rect(q[0],q[1],PIDS_CW*r.w,PIDS_CH); c.clip();
  draw(c,q[0],q[1],PIDS_CW*r.w,PIDS_CH); c.restore();
  PIDS_TEX.needsUpdate=true;
}
function pidsCell(key,w,draw){           // key が同じ絵は1回だけ描く。w=1/2(こま幅)
  if(PIDS.memo.has(key)) return PIDS.memo.get(key);
  if(w===2&&PIDS.used%2) PIDS.used++;
  const r={k:PIDS.used, w:w}; PIDS.used+=w;
  if(PIDS.used>PIDS_COLS*PIDS_ROWS) throw new Error('案内の画像のこまが足りない');
  pidsPaint(r,draw); PIDS.memo.set(key,r); return r;
}
function pidsUV(r,rot){                  // 左下・右下・右上・左上(rot:縦長の面に90°回して貼る)
  const u0=(r.k%PIDS_COLS)/PIDS_COLS, u1=u0+r.w/PIDS_COLS;
  const row=Math.floor(r.k/PIDS_COLS), v1=1-row/PIDS_ROWS, v0=v1-1/PIDS_ROWS;
  return rot?[[u0,v1],[u0,v0],[u1,v0],[u1,v1]]:[[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
}
const pFit=(c,t,px,wmax,wt)=>{let f=px;c.font=wt+' '+f+'px '+PIDS_F;
  while(f>8&&c.measureText(t).width>wmax){f-=1;c.font=wt+' '+f+'px '+PIDS_F;} return f;};
/* 面を1枚貼る(signQuad と同じ向きの決め方:見る人の左に絵の左端) */
function pidsQuad(Sx,r,s,off,y0,y1,w,face,rot){
  const A=Sx.axes(s,off), c=[A.f.x,0,A.f.z];
  let L,R,out;
  if(face===1||face===-1){ L=v3sc(A.t,-face*w/2); R=v3sc(A.t,face*w/2); out=v3sc(A.n,face); }
  else { const f=(face==='w')?1:-1; L=v3sc(A.n,f*w/2); R=v3sc(A.n,-f*w/2); out=v3sc(A.t,f); }
  const P=(h,y)=>[c[0]+h[0],y,c[2]+h[2]];
  Sx.face(MAT.pids,[P(L,y0),P(R,y0),P(R,y1),P(L,y1)],out,pidsUV(r,rot));
}
/* 出口(黄)。階段のピクトグラムと「出口 Exit」 */

/* 番線案内の半分(1つの線)。t={n,dest,en}。arrow=-1:左端に左向きの矢印/+1:右端に右向き/0:なし */
function pidsArrow(c,x,y,d){
  c.beginPath();
  c.moveTo(x+d*24,y); c.lineTo(x-d*4,y-26); c.lineTo(x-d*4,y-11); c.lineTo(x-d*26,y-11);
  c.lineTo(x-d*26,y+11); c.lineTo(x-d*4,y+11); c.lineTo(x-d*4,y+26); c.closePath(); c.fill();
}
function pidsTrack(t,arrow){
  return pidsCell('trk|'+t.n+'|'+t.dest+'|'+arrow,1,function(c,x,y,W,H){
    c.fillStyle='#f8f8f5'; c.fillRect(x,y,W,H);
    c.fillStyle='#c9c9c4'; c.fillRect(x,y+H-4,W,4);

    if(arrow>0){ pidsArrow(c,rx-26,y+H/2,1); rx-=64; }
    c.fillStyle='#15181c'; roundRect(c,lx,y+16,92,92,10); c.fill();         // 番線:黒地に白抜き
    c.fillStyle='#ffffff'; c.textAlign='center'; c.textBaseline='middle';

    lx+=108;

    pFit(c,t.dest,36,rx-lx,'700'); c.fillText(t.dest,lx,y+62);
    c.fillStyle='#3a3f45'; pFit(c,t.en,20,rx-lx,'600'); c.fillText(t.en,lx,y+96);

}
/* ---- 発車標の時刻表(模式) ----
   20分の繰り返し(下りは笹塚、上りは仙川の発車の分)に、駅までの所要を足して各駅の時刻を出す。
   停車駅は 2022年3月のダイヤ改正後(特急:笹塚・明大前・千歳烏山/急行:+桜上水/区間急行:+仙川/各停:全駅)。
   快速は本数が少ないので載せない。2面4線は各停=外側(待避線)・優等=内側(本線)。
   笹塚の上りは3番線=新宿行き・4番線=本八幡行き(京王新線・都営新宿線) */
const DEP_NOW={morning:7*60+30, noon:12*60, evening:17*60+30, night:21*60};
let depNow=DEP_NOW.noon;
// 品川版:種別の色・停車駅・並びは**推定の模式**(京急の実際のダイヤ・表示色ではない)。dn=エンジンの下り(+s)=泉岳寺方面
const DEP_COL={'快特':'#3fd46a','普通':'#f4f4f4'};
const DEP_STOP={'快特':['品川']};
const DEP_PAT={
  dn:[[0,'快特','泉岳寺'],[5,'普通','品川'],[10,'快特','青砥'],[15,'普通','品川']],   // 普通は品川で折り返す(内側の線へ。推定の模式)
  up:[[2,'快特','三崎口'],[7,'普通','浦賀'],[12,'快特','京急久里浜'],[17,'普通','浦賀']],
};
function depList(i,t){                    // 駅 i・線 t の次の2本 [種別,行先,分]
  const st=STA[i], base=t.dn?STA[0]:STA[STA.length-1], out=[];
  for(let k=-2;k<=3;k++) for(const e of DEP_PAT[t.dn?'dn':'up']){
    const ty=e[1], to=e[2], stops=DEP_STOP[ty];
    if(stops&&stops.indexOf(st.n)<0) continue;
    /* 品川(2面4線):外側=本線を通る列車(泉岳寺方面=快特と普通 泉岳寺行・横浜方面=快特)、内側=折り返しの線
       (西=当駅止まりの普通 品川行・東=品川始発の普通 浦賀行)。配線は東京都の標準横断図、列車の割り振りは推定 */
    if(t.quad){ const inner=!t.outer;
      if(t.dn){ if(inner!==(to==='品川')) continue; } else if(inner!==(ty==='普通')) continue; }
    const T=Math.floor(depNow/20)*20+20*k+e[0]+Math.round(Math.abs(st.x-base.x)/(ty==='普通'?520:900));
    if(T>=depNow) out.push([ty,to,T]);
  }
  return out.sort((a,b)=>a[2]-b[2]).slice(0,2);
}

/* ---- 駅の番線:ホームに面する線路を南(off の小さい側)から 1,2,… と数える ----
   京王の各駅の番線と同じ並び(左側通行なので下り=西行きは南側の線)。2面4線は外側が待避線 */
function staTracks(st,pm){
  const L=[];
  pltOf(st).forEach(function(pp,pi){
    for(const sg of[-1,1]){
      if(noStopEdge(st,pi,sg)) continue;                 // 列車が停まらない縁(仙川の島式の北)
      const edge=pp[0]+sg*pp[1];
      for(const t of TRACKS){
        if(pm<t.x0||pm>t.x1) continue;
        const o=t.zf(pm), d=sg*(o-edge);
        if(!(d>0.5&&d<2.6)) continue;
        let q=L.find(r=>Math.abs(r.off-o)<0.5);
        if(!q){ q={off:o,plats:[]}; L.push(q); }
        if(q.plats.indexOf(pi)<0) q.plats.push(pi);
      }
    }
  });
  L.sort((a,b)=>a.off-b.off);
  const quad=L.length>=4;
  L.forEach(function(q,j){
    q.n=j+1; q.dn=q.off<0; q.quad=quad;
    const same=L.filter(r=>(r.off<0)===q.dn);
    q.outer=quad&&Math.abs(q.off)>=Math.max.apply(null,same.map(r=>Math.abs(r.off)))-1e-6;
    // 品川版:エンジンの「下り」(dn)= +s = 京急の上り(泉岳寺方面)。方面の表記は推定
    if(q.dn){ q.dest='泉岳寺・都営浅草線方面'; q.en='for Sengakuji, Toei Asakusa Line'; }
    else { q.dest='横浜・三崎口方面'; q.en='for Yokohama, Misakiguchi'; }
  });
  return L;
}
/* 階段口の案内(利用者指示):ホームから階段を望む向き=黄の「出口」(列車を降りた乗客に見える)、
   階段からホームを望む向き=白の番線案内(見る人の左右に合わせて番線と方面を並べる)。両面の吊り看板。
   s=看板の位置(入口 e0 からホーム側へ)、w.trk=そのホームの線(staTracks) */
function stairGuide(md,w,s,yA,yB){
  const f=w.dir||1, oc=(w.o0+w.o1)/2, T=w.trk||[], two=T.length>=2, W=two?2.8:1.4;
  const fP=f>0?'e':'w', fS=f>0?'w':'e';          // ホーム側を向く面(法線 -f)/階段側を向く面(法線 +f)
  pidsQuad(md,pidsExit(two?2:1),s-f*0.012,oc,yA,yB,W,fP);
  const lf=f>0?1:-1;                              // 階段側の面を見る人(-f を向く)の左は lf·off の側
  const ord=T.slice().sort((a,b)=>lf*(b.off-a.off));
  if(two){
    pidsQuad(md,pidsTrack(ord[0],-1),s+f*0.012,oc+lf*W/4,yA,yB,W/2,fS);
    pidsQuad(md,pidsTrack(ord[1],1),s+f*0.012,oc-lf*W/4,yA,yB,W/2,fS);
  }else if(T.length===1){
    pidsQuad(md,pidsTrack(T[0],lf*(T[0].off-oc)>0?-1:1),s+f*0.012,oc,yA,yB,W,fS);
  }
  md.col(0x2b3036).box(SV,s,oc,yA-0.02,yB+0.02,0.016,W+0.04,{tag:'階段の案内'});
  GUIDES.push({kind:'stair',st:w.st,s:s,off:oc,w:W,dir:f,faceP:fP,faceS:fS,y0:yA,y1:yB,
    shown:ord.slice(0,two?2:1).map(q=>({n:q.n,off:q.off,dest:q.dest}))});
}
/* 発車標:階段口の少しホーム寄りに、そのホームの線ごとに1台(島式は線の側の半分の上)。両面。
   筐体・吊り棒は細部(md)。yTop=吊り棒の上端(屋根・上屋の天井) */
function depBoards(md,w,s,yt,yTop){
  const T=w.trk||[]; if(!T.length) return;
  const two=T.length>=2, bw=two?Math.min(2.3,w.hw-0.45):Math.min(2.3,2*w.hw-0.9), yA=yt+2.70, yB=yA+bw/4;   // 案内(〜2.62)の上に見える高さ
  for(const t of T){
    const oc=two?w.pc+Math.sign(t.off-w.pc)*(0.12+bw/2):w.pc, r=pidsDep(STA.indexOf(w.st),t);
    pidsQuad(md,r,s+0.07,oc,yA,yB,bw,'w'); pidsQuad(md,r,s-0.07,oc,yA,yB,bw,'e');
    md.col(0x15181c).box(SV,s,oc,yA-0.04,yB+0.04,0.13,bw+0.08,{tag:'発車標'});
    for(const e of[-1,1]) md.col(0x8d949b).box(SV,s,oc+e*(bw/2-0.2),yB+0.04,yTop,0.04,0.04);
    GUIDES.push({kind:'dep',st:w.st,s:s,off:oc,w:bw,n:t.n,toff:t.off,y0:yA,y1:yB,t:t});
  }
}
/* ---- 駅の外装と駅舎の模様のテクスチャ ----------------------------------------
   小さな画像を UV で繰り返す(データ量を増やさない)。白っぽく描いておき、色合いは
   頂点カラーで塗り分ける(同じ模様で何色も出せ、材質=描画の呼び出しを増やさない)。 */
function texOf(w,h,draw){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;

}
// レンガ(代田橋):1こま=4段×2丁。UV は 1m あたり (1/0.44, 1/0.28)
const brickTex=texOf(128,64,function(c){
  const tone=['#a8604f','#9c5646','#b36a56','#a35b4a','#ad6552'];
  for(let r=0;r<4;r++)for(let k=-1;k<3;k++){
    c.fillStyle=tone[(r*3+k+5)%tone.length];

});
// 横ルーバー(明大前):白い羽根と淡い灰の隙間。羽根の厚さを不揃いに。1こま=高さ0.9m
const louverTex=texOf(16,128,function(c,w,h){

// 石積み(芦花公園・上北沢):大きさの不揃いな切石。1こま=2.4m×1.2m

// 木の縦ルーバー(駅舎の壁):1こま=幅0.6m
const slatTex=texOf(32,8,function(c,w,h){

const MAT_BRICK=M(0xffffff,{map:brickTex,vertexColors:true});
// 青海波(北品川の駅舎デザイン:端部のガラスの箱のパネル。東京都・京急の決定デザインのパース)。1こま=0.6m 角

const hash01=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);};
